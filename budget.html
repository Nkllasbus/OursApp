const SALARY_DAY=20;
const salaryShift=()=>!(fin.meta&&fin.meta.salaryShift===false);
function effKey(t){ const k=t.date.slice(0,7); if(!salaryShift()||t.amount<=0||+t.date.slice(8,10)<SALARY_DAY||catOf(t)!=="Gehalt") return k;
  const [y,m]=k.split("-").map(Number); return m===12?`${y+1}-01`:`${y}-${pad(m+1)}`; }
function monthTx(y,m){
  const key=`${y}-${pad(m+1)}`; const list=allTx().filter(t=>effKey(t)===key);
  if(!hasBank()) Object.entries(rec).forEach(([id,r])=>{ if(!r||!r.amount) return; occurrences(r,y,m).forEach(d=>list.push({id:"r_"+id+"_"+d,rid:id,date:`${key}-${pad(d)}`,amount:r.kind==="income"?r.amount:-r.amount,name:r.name,cat:r.cat||(r.kind==="income"?"Gehalt":null),src:"rec"})); });
  return list.sort((a,b)=>b.date.localeCompare(a.date)||Math.abs(b.amount)-Math.abs(a.amount));
}
function monthStats(y,m){
  const list=monthTx(y,m).filter(t=>!t.ex); let inc=0, out=0, saved=0; const byCat={};
  list.forEach(t=>{ const c=catOf(t); if(NO_SPEND.has(c)) return; if(c===SAVE_CAT&&t.amount<0){ saved+=-t.amount; return; }
    if(t.amount>0) inc+=t.amount; else { out+=-t.amount; byCat[c]=(byCat[c]||0)-t.amount; } });
  return {list,inc,out,saved,byCat};
}

/* ---------- Verträge automatisch erkennen ---------- */
const RHY=[["week",6,8,"wöchentlich"],["month",26,35,"monatlich"],["quarter",84,97,"vierteljährlich"],["half",170,195,"halbjährlich"],["year",350,380,"jährlich"]];
const CON_ICON=[[/netflix|disney|dazn|prime|sky|youtube|wow/i,"🎬"],[/spotify|apple music|deezer|audible/i,"🎵"],[/vodafone|telekom|o2|congstar|1&1|freenet|mobilcom/i,"📱"],[/miete|vermiet|hausverwalt/i,"🏠"],
  [/versicherung|allianz|huk|axa|ergo|devk|debeka|krankenk/i,"🛡️"],[/fitx|mcfit|fitness|urban sports|gym/i,"💪"],[/strom|gas|stadtwerke|vattenfall|eon|enbw/i,"⚡"],[/icloud|google|dropbox|microsoft|adobe|chatgpt|openai/i,"☁️"],[/sparplan|etf|depot|trade republic|scalable/i,"📈"],[/rundfunk|ard zdf/i,"📺"]];
const conIcon=n=>{ for(const [re,e] of CON_ICON) if(re.test(n)) return e; return "🔁"; };
function contracts(){
  const groups={};
  allTx().forEach(t=>{ if(t.amount>=0||t.ex||t.src==="manual") return; const c=catOf(t); if(NO_SPEND.has(c)) return; const k=merchKey(t); if(!k) return; (groups[k]=groups[k]||[]).push(t); });
  const out=[], today=new Date(); today.setHours(0,0,0,0);
  Object.entries(groups).forEach(([k,list])=>{
    if(list.length<2) return; list.sort((a,b)=>a.date.localeCompare(b.date));
    const amts=list.map(t=>-t.amount).sort((a,b)=>a-b), med=amts[Math.floor(amts.length/2)];
    // Einkäufe (Supermarkt, Restaurant, Shopping, Bargeld) nur, wenn der Betrag immer genau gleich ist – dann ist es eher ein Abo
    const daily=/^(Lebensmittel|Essen gehen|Shopping|Bargeld)$/.test(catOf(list[list.length-1]));
    const same=list.filter(t=>Math.abs(-t.amount-med)<=(daily?Math.max(1,med*.01):Math.max(100,med*.2))); if(same.length<2) return;
    if(daily&&same.length<list.length*.8) return;
    const gaps=[]; for(let i=1;i<same.length;i++) gaps.push((fromIso(same[i].date)-fromIso(same[i-1].date))/864e5);
    const g=gaps.slice().sort((a,b)=>a-b)[Math.floor(gaps.length/2)], r=RHY.find(x=>g>=x[1]&&g<=x[2]); if(!r) return;
    if(r[0]==="week"&&same.length<4) return;
    const last=fromIso(same[same.length-1].date), next=new Date(last); if(r[0]==="week") next.setDate(next.getDate()+7); else next.setMonth(next.getMonth()+({month:1,quarter:3,half:6,year:12}[r[0]]));
    const kk=k.replace(/[.#$\[\]\/]/g,"_"), meta=fin.contracts[kk]||{};
    if(meta.hidden) return; if((today-last)/864e5>g*1.8) return;   // nicht mehr aktiv
    const avg=Math.round(same.slice(-3).reduce((a,t)=>a-t.amount,0)/Math.min(3,same.length));
    // Preiserhöhung: letzte Zahlung höher als die davor
    const a1=-same[same.length-1].amount, a0=same.length>1?-same[same.length-2].amount:a1;
    const raise=a1-a0>=50&&a1>a0*1.02?{from:a0,to:a1,date:same[same.length-1].date}:null;
    const first=fromIso(same[0].date), isNew=(today-first)/864e5<=g*2.2&&same.length<=3;
    out.push({key:kk,name:displayName(same[same.length-1]),cat:catOf(same[same.length-1]),rhythm:r[0],rlabel:r[3],avg:raise?a1:avg,perMonth:Math.round((raise?a1:avg)*PER_MONTH[r[0]]),last,next,n:same.length,txs:same.slice().reverse(),meta,auto:true,raise,isNew,first});
  });
  Object.entries(rec).forEach(([id,r])=>{ if(!r||r.kind==="income") return; const nd=nextDate(r); out.push({key:"rec_"+id,rid:id,name:r.name,cat:r.cat,rhythm:r.every,rlabel:(EVERY.find(e=>e[0]===r.every)||[0,""])[1].toLowerCase(),avg:r.amount,perMonth:Math.round(r.amount*PER_MONTH[r.every]),next:nd,n:0,txs:[],meta:fin.contracts["rec_"+id]||{},auto:false}); });
  return out.sort((a,b)=>b.perMonth-a.perMonth);
}

  if(errs.length) say(errs[0],9000); else if(manual) say(nNew?`${nNew} neue Umsätze geladen.`:"Alles aktuell.");

const hashTx=t=>{ const s=[t.date,t.amount,t.name,t.text].join("|"); let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return "h"+(h>>>0).toString(36); };

let categorizing=false;
// Händler, die keine Regel und kein Stichwort treffen, einmal von Claude zuordnen lassen – nur sichere Antworten zählen
async function categorizeNew(){
  if(categorizing||!WORKER_URL||categorizeNew.off) return;
  const seen=new Set(), todo=[];
  for(const t of allTx()){ if(t.amount>=0||t.ex||t.src==="manual"||t.src==="rec"||(t.cat&&t.catSrc!=="ai")) continue; const k=merchKey(t); if(!k||seen.has(k)||(fin.aicat&&k in fin.aicat)) continue;
    seen.add(k); fin.rules[k]=fin.rules[k]; const tmp=fin.aicat[k]; if(autoCat(t)) continue; todo.push([k,t]); if(todo.length>=60) break; }
  if(!todo.length) return; categorizing=true;
  try{ const d=await api({mode:"fin-cat",cats:catList().filter(c=>!INCOME_CATS.has(c)&&c!=="Umbuchung"),items:todo.map(([,t])=>({name:displayName(t),orig:t.name,text:cleanText(t.text,fin.accounts[t.acc]),amount:t.amount}))});
    if(!Array.isArray(d.sure)){ categorizeNew.off=true; categorizing=false; return; }   // alter Helfer ohne „sicher“-Angabe: nichts übernehmen
    const upd={}; todo.forEach(([k],i)=>{ const c=(d.cats||[])[i], ok=d.sure[i]&&c&&c!=="Sonstiges"; fin.aicat[k]=ok?c:"Sonstiges"; upd[k]=fin.aicat[k]; });
    await finRef("aicat").update(upd).catch(()=>{}); render();
  }catch(e){ categorizing=false; return; }
  categorizing=false; setTimeout(categorizeNew,1200);
}

/* ---------- CSV-Import (Bank, PayPal, Trade Republic …) ---------- */
let csv=null;
function readCsvText(buf){ try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(e){ return new TextDecoder("windows-1252").decode(buf); } }
function splitCsv(text){
  const lines=text.replace(/^﻿/,"").split(/\r?\n/).filter(l=>l.trim()); const sample=lines.slice(0,30).join("\n");
  const delim=[";",",","\t"].map(d=>[d,(sample.match(new RegExp(d==="\t"?"\t":"\\"+d,"g"))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const parse=l=>{ const out=[]; let cur="", inq=false; for(let i=0;i<l.length;i++){ const ch=l[i]; if(inq){ if(ch==='"'){ if(l[i+1]==='"'){ cur+='"'; i++; } else inq=false; } else cur+=ch; } else if(ch==='"') inq=true; else if(ch===delim){ out.push(cur.trim()); cur=""; } else cur+=ch; } out.push(cur.trim()); return out; };
  return lines.map(parse);
}
const COLS={date:/^(buchungs?tag|buchung|datum|date|buchungsdatum|valuta(datum)?|wertstellung|transaktionsdatum|booking date)$/i,
  amount:/^(betrag( \(eur\)| in eur| \(€\))?|umsatz|amount|netto|brutto|betrag eur|wert)$/i,
  name:/^(name|empfänger|empfaenger|auftraggeber\/empfänger|beguenstigter\/zahlungspflichtiger|begünstigter\/zahlungspflichtiger|zahlungsempfänger.*|auftraggeber.*|gegenpartei|payee|counterparty|partner)$/i,
  text:/^(verwendungszweck|beschreibung|description|betreff|buchungstext|vorgang|hinweis|typ|art|details?)$/i};
function analyzeCsv(rows,fileName){
  let hi=rows.findIndex(r=>r.some(c=>COLS.date.test(c))&&r.some(c=>COLS.amount.test(c))); if(hi<0) hi=0;
  const head=rows[hi]||[], body=rows.slice(hi+1).filter(r=>r.length>=Math.min(3,head.length));
  const find=re=>head.findIndex(c=>re.test(c));
  const paypal=head.includes("Transaktionscode")||head.includes("Brutto");
  const map={date:find(COLS.date),amount:paypal&&head.includes("Netto")?head.indexOf("Netto"):find(COLS.amount),name:find(COLS.name),text:paypal&&head.includes("Typ")?head.indexOf("Typ"):find(COLS.text)};
  if(map.name<0) map.name=find(/name|empf|auftrag/i); if(map.text<0) map.text=find(/zweck|text|betreff/i);
  const accName=paypal?"PayPal":/trade.?republic/i.test(fileName)||head.some(c=>/trade republic/i.test(c))?"Trade Republic":/paypal/i.test(fileName)?"PayPal":"";
  return {head,body,map,paypal,accName};
}
const parseDate=s=>{ s=String(s||"").trim(); let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/); if(m){ const y=+m[3]<100?2000+(+m[3]):+m[3]; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`; m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`; return null; };
const parseCsvAmount=s=>{ s=String(s||"").replace(/[€\s]|EUR/g,""); if(!s) return null; if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,"").replace(",","."); else s=s.replace(/,/g,""); const v=Math.round(parseFloat(s)*100); return Number.isFinite(v)?v:null; };

  if(sel==="__new"){ const n=($("#csvNew").value||"").trim()||"Importiertes Konto"; aid=("csv_"+n+"_"+Date.now().toString(36)).replace(/[.#$\[\]\/\s]/g,"_"); fin.accounts[aid]={name:n,src:"csv",kind:/depot/i.test(n)?"depot":"bank",balance:null}; }

  a.body.forEach(r=>{ const date=parseDate(r[a.map.date]), amount=parseCsvAmount(r[a.map.amount]); if(!date||amount==null||amount===0){ skip++; return; }
    const t={acc:aid,date,amount,name:String(r[a.map.name]||"").slice(0,120),text:String(r[a.map.text]||"").replace(/\s+/g," ").slice(0,300),src:"csv"};
    if(a.paypal&&/bankgutschrift|allgemeine abbuchung|kartengutschrift|umbuchung|überweisung auf|abbuchung von|kreditkarte|ausgleich/i.test(t.text)){ t.cat="Umbuchung"; t.catSrc="rule"; }
    const h=hashTx(t); if(seen.has(h)){ skip++; return; } seen.add(h); const id=(aid+"_"+h).replace(/[.#$\[\]\/\s]/g,"_"); fin.tx[id]=t; upd["tx/"+id]=t; n++; });
  finRef().update(upd).catch(showErr); closeSheet(); render(); say(`${n} Umsätze importiert${skip?`, ${skip} übersprungen (doppelt oder leer)`:""}.`,7000); categorizeNew();

  if(t.closest("#budDel")){ const c=sheetCtx.cat; delete fin.budgets[c]; finRef("budgets/"+c.replace(/[.#$\[\]\/]/g,"_")).remove().catch(showErr); closeSheet(); render(); return; }
  const ak=t.closest("[data-akind]"); if(ak){ sheetCtx.kind=ak.dataset.akind; document.querySelectorAll("[data-akind]").forEach(x=>x.setAttribute("aria-pressed",x===ak)); return; }
  if(t.closest("#accSave")){ const id=sheetCtx.id, a=fin.accounts[id], upd={name:($("#accName").value||"").trim()||a.name}; const bi=$("#accBal"); if(bi&&bi.value.trim()){ const b=parseSigned(bi.value); if(b!=null){ upd.balance=b; upd.syncAt=Date.now(); } } if(sheetCtx.kind) upd.kind=sheetCtx.kind;
    Object.assign(a,upd); finRef("accounts/"+id).update(upd).catch(showErr); closeSheet(); render(); return; }
  const del=t.closest("#accDel"); if(del){ if(del.dataset.sure!=="1"){ del.dataset.sure="1"; del.textContent=fin.accounts[sheetCtx.id].src==="eb"?"Wirklich trennen? Umsätze bleiben gespeichert.":"Wirklich löschen? Auch die Umsätze."; del.classList.add("sure"); return; }
    const id=sheetCtx.id, a=fin.accounts[id];
    if(a.src==="eb"){ const sk=a.session, s=fin.eb[sk]; const others=Object.entries(fin.accounts).filter(([k,x])=>k!==id&&x&&x.session===sk); if(!others.length&&s){ api({mode:"fin-end",session:s.session,ticket:s.ticket}).catch(()=>{}); delete fin.eb[sk]; finRef("eb/"+sk).remove().catch(()=>{}); }
      const na={...a,src:"csv",session:null,ebUid:null}; fin.accounts[id]=na; finRef("accounts/"+id).set(na).catch(showErr); }
    else { delete fin.accounts[id]; const upd={["accounts/"+id]:null}; Object.entries(fin.tx).forEach(([k,x])=>{ if(x&&x.acc===id){ delete fin.tx[k]; upd["tx/"+k]=null; } }); finRef().update(upd).catch(showErr); }
    closeSheet(); render(); return; }
  const nk=t.closest("[data-nakind]"); if(nk){ sheetCtx.kind=nk.dataset.nakind; document.querySelectorAll("[data-nakind]").forEach(x=>x.setAttribute("aria-pressed",x===nk)); return; }
  if(t.closest("#naSave")){ const n=($("#naName").value||"").trim(); if(!n){ say("Gib dem Konto einen Namen."); return; } const id=("man_"+Date.now().toString(36)); const a={name:n,src:"manual",kind:sheetCtx.kind,balance:parseSigned($("#naBal").value)||0,syncAt:Date.now()};
    fin.accounts[id]=a; finRef("accounts/"+id).set(a).catch(showErr); closeSheet(); render(); return; }
  if(t.closest("#csvGo")) return importCsv();
});
document.addEventListener("change",e=>{ if(e.target.id!=="salaryShift") return; fin.meta=fin.meta||{}; fin.meta.salaryShift=e.target.checked; finRef("meta/salaryShift").set(e.target.checked).catch(showErr); render(); });
$("#sheetModal").addEventListener("change",e=>{ const m=e.target.closest("[data-map]"); if(m&&csv){ csv.map[m.dataset.map]=+m.value; csvSheet(); } });
$("#csvFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const rows=splitCsv(readCsvText(await f.arrayBuffer())); csv=analyzeCsv(rows,f.name); if(!csv.body.length) throw new Error("In der Datei wurden keine Umsätze gefunden."); csvSheet(); }
  catch(err){ say(err.message||"Die Datei konnte nicht gelesen werden.",7000); }
});
document.addEventListener("keydown",e=>{ if(e.key!=="Escape") return; if(!$("#formModal").hidden) closeForm(); else if(!$("#sheetModal").hidden) closeSheet(); });
$("#prevM").addEventListener("click",()=>{ vm--; if(vm<0){ vm=11; vy--; } render(); });
$("#nextM").addEventListener("click",()=>{ vm++; if(vm>11){ vm=0; vy++; } render(); });
(()=>{ const wrap=document.querySelector(".wrap"), head=$("#head"), sc=$("#list");
  const measure=()=>{ if(!wrap.classList.contains("compact")) wrap.style.setProperty("--headH",head.offsetHeight+"px"); };
  sc.addEventListener("scroll",()=>{ measure(); if(sc.scrollTop>24) wrap.classList.add("compact"); else if(sc.scrollTop<=2) wrap.classList.remove("compact"); },{passive:true});
  addEventListener("resize",measure); measure(); })();

// Kontostand auch aktualisieren, wenn die App wieder in den Vordergrund kommt (höchstens alle 10 Minuten)
document.addEventListener("visibilitychange",()=>{ if(document.hidden||!myUid||!Object.keys(fin.eb||{}).length) return;
  const last=Math.max(0,...Object.values(fin.accounts).filter(a=>a&&a.src==="eb").map(a=>a.syncAt||0)); if(Date.now()-last>10*60e3) syncAll(false); });
/* ---------- Start ---------- */
Auth.start(firebaseConfig,"budget",(r,info)=>{
  root=r; if(info){ myUid=info.uid; myName=info.name||""; } render();
  if(!root){ $("#count").textContent="Keine Verbindung"; $("#status").textContent="Die Datenbank konnte nicht geladen werden. Prüf die Internetverbindung und lade die Seite neu."; return; }
  root.child("recurring").on("value",s=>{ rec=s.val()||{}; render(); },err=>{ $("#count").textContent="Keine Verbindung"; showErr(err); });
  root.child("expenses").on("value",s=>{ exp=s.val()||{}; render(); });
  root.child("cats").on("value",s=>{ customCats=s.val()||{}; render(); if(form) renderFormChips(); });
  if(myUid){ let first=true;
    finRef().on("value",s=>{ finLoaded=true; const v=s.val()||{}; fin={accounts:v.accounts||{},tx:v.tx||{},rules:v.rules||{},budgets:v.budgets||{},contracts:v.contracts||{},eb:v.eb||{},meta:v.meta||{},alias:v.alias||{},aicat:v.aicat||{},goals:v.goals||{}};
      if(!document.querySelector("#sheetModal:not([hidden]) input:focus")) render();
      if(first){ first=false; if(ebBack) finishBank();
        const last=Math.max(0,...Object.values(fin.accounts).filter(a=>a&&a.src==="eb").map(a=>a.syncAt||0));
        if(Object.keys(fin.eb).length&&Date.now()-last>10*60e3) setTimeout(()=>syncAll(false),600); else setTimeout(categorizeNew,800); } },()=>{});
  }
});
