<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ours · Gym</title>
<link rel="icon" href="ours-logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=Playfair+Display:wght@800;900&display=swap">
<style>
/* Gym: eigene Übungen nach Muskelgruppen und ein Wochenplan */
:root{
  --page:#191b2b; --dots:rgba(255,255,255,.035); --frame-line:#12131f; --shadow:rgba(10,11,22,.45);
  --band:#3c4270; --on-band:#eef0fa; --on-band-muted:#b8bcdc;
  --bg:#f2f2f6; --surface:#fcfcfe; --ink:#1e2030; --muted:#6c6f82; --line:#e1e2ea;
  --accent:#3c4270; --accent-soft:#e6e8f3; --btn:#e7e8f0; --ok:#4f8a5b;
  --display:"Gloock", Georgia, serif; --body:"Figtree", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;background-color:var(--page);
  background-image:radial-gradient(var(--dots) 1.2px,transparent 1.2px);background-size:18px 18px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:620px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;gap:12px;background:var(--bg);overflow:hidden;position:relative;
  padding:0 22px max(12px,env(safe-area-inset-bottom,0px))}
@media (max-width:660px){.wrap{padding-left:16px;padding-right:16px}}
@media (min-width:661px){.wrap{border-left:1px solid var(--frame-line);border-right:1px solid var(--frame-line)}}
header{flex:none;margin:0 -22px;background:var(--band);color:var(--on-band);position:relative;transition:margin-top .3s ease}
@media (max-width:660px){header{margin:0 -16px}}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;background:var(--bg);border-radius:14px 14px 0 0}
header.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(12px + env(safe-area-inset-top,0px)) 64px 25px!important}
header.brand .wordmark{font-family:"Playfair Display",var(--display);font-weight:900;font-size:clamp(2.1rem,9.5vw,2.7rem);line-height:1;color:var(--on-band);white-space:nowrap}
header.brand .pf-btn{top:calc(50% - 27px + env(safe-area-inset-top,0px) / 2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap.compact header{margin-top:calc(24px - var(--headH,110px))}
.count{display:none}
.status{flex:none;font-size:.82rem;color:var(--muted)}
.status:empty{display:none}

.panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.topbar{flex:none;display:flex;align-items:center;gap:8px}
.seg{flex:1;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;font-size:.88rem;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--band);color:var(--on-band)}
.btn{background:var(--btn);color:var(--ink);border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--band);color:var(--on-band)}
#addEx{white-space:nowrap;flex:none}
@media (max-width:430px){.wide{display:none} #addEx{width:42px;padding:9px 0;font-size:1.2rem}}
.ghost{background:none;border:0;color:var(--muted);padding:8px 4px}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;font-size:.88rem}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 2px 90px;margin:0 -2px;display:flex;flex-direction:column;gap:10px}
.scroll>*{flex:none}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:18px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.empty strong{color:var(--ink);font-family:var(--display);font-weight:400;font-size:1.3rem}

/* Woche */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav b{font-weight:600}
.weeknav small{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.weeknav .arr{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.weeknav .arr svg{width:16px;height:16px}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0 7px;font-size:.72rem;color:var(--muted)}
.wd b{font-size:1rem;color:var(--ink);font-weight:600}
.wd i{width:7px;height:7px;border-radius:50%;background:transparent}
.wd.train i{background:var(--accent)}
.wd.done i{background:var(--ok)}
.wd.today{border-color:var(--band);box-shadow:0 0 0 1px var(--band) inset}
.wd[aria-pressed="true"]{background:var(--band);border-color:var(--band);color:var(--on-band-muted)}
.wd[aria-pressed="true"] b{color:var(--on-band)}
.wd[aria-pressed="true"].train i{background:var(--on-band)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;color:var(--ink)}
.day-head .dn{flex:none;width:42px;text-align:center;line-height:1.1}
.day-head .dn b{display:block;font-size:1.15rem;font-weight:700}
.day-head .dn small{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day-head .dt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.day-head .dt b{font-weight:600}
.day-head .dt small{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-head .prog{flex:none;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--accent-soft);color:var(--accent)}
.day-head .prog.ok{background:#e1efe3;color:var(--ok)}
.day.today{border-color:var(--band)}
.day.rest .dt b{color:var(--muted);font-weight:500}
.day-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.exl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.exl li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-top:1px solid var(--line)}
.exl li:first-child{border-top:0}
.ck{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:transparent;display:grid;place-items:center;padding:0}
.ck svg{width:16px;height:16px}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.exn{flex:1;min-width:0;display:flex;flex-direction:column}
.exn b{font-weight:600;font-size:.95rem}
.exn small{font-size:.78rem;color:var(--muted)}
li.done .exn b{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.gdot{flex:none;width:9px;height:9px;border-radius:50%}
.day-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* Wochenplan als Kalender */
.wsum{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--muted)}
.wsum b{color:var(--ink)}
.cal-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:.86rem;white-space:nowrap}
.wsum{flex-wrap:wrap}
.cal-btn svg{width:17px;height:17px}
.plan{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:10px;align-items:stretch}
.pdate{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;line-height:1.1}
.pdate small{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pdate b{font-size:1.25rem;font-weight:700}
.tdy{margin-top:3px;font-size:.62rem;font-weight:700;color:#fff;background:var(--band);border-radius:999px;padding:1px 6px}
.prow.past .pdate{opacity:.55}
.pblock{flex:1;min-width:0;background:color-mix(in srgb,var(--tc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--tc) 28%,var(--line));border-left:5px solid var(--tc);border-radius:14px;overflow:hidden}
.prow.today .pblock{box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 35%,transparent)}
.pb-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px 4px;text-align:left;color:var(--ink)}
.pb-emo{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 18%,#fff);font-size:1.1rem}
.pb-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.pb-txt b{font-weight:700;font-size:1.02rem}
.pb-txt small{font-size:.8rem;color:var(--muted)}
.pb-prog{flex:none;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 9px;background:#fff;color:var(--tc)}
.pb-prog.ok{background:var(--ok);color:#fff}
.pb-groups{display:flex;flex-wrap:wrap;gap:4px;padding:2px 12px 10px 56px}
.pb-groups span{font-size:.7rem;font-weight:600;color:color-mix(in srgb,var(--gc) 80%,#000);background:color-mix(in srgb,var(--gc) 14%,#fff);border-radius:999px;padding:2px 8px}
.pb-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;border-top:1px dashed color-mix(in srgb,var(--tc) 30%,var(--line));padding-top:10px}
.pb-title{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:1px solid color-mix(in srgb,var(--tc) 30%,var(--line));background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:600;color:var(--ink);text-align:left}
.pb-title svg{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.pb-title[aria-expanded="true"] svg{transform:rotate(180deg)}
.prest{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1.5px dashed var(--line);background:none;border-radius:14px;padding:12px 14px;color:var(--muted);text-align:left}
.prest span{font-weight:500}
.prest small{color:var(--accent);font-weight:600;font-size:.82rem}
.prow.today .prest{border-color:var(--band)}
.timerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.92rem}
.timerow input[type=date]{font:inherit;padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.rep-seg{flex:none}
.rep-seg button{font-size:.84rem;padding:7px 6px}
.wdays .chip{min-width:42px;text-align:center}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0;line-height:1}
.stepper b{min-width:1.6em;text-align:center;font-size:1.05rem}
.rep-hint{margin:0;font-size:.8rem;color:var(--muted)}
.pcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.wsum-btns{display:flex;gap:6px}
.timerow input[type=time]{font:inherit;font-size:1.05rem;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
/* Workouts & Training */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.sec-h b{font-family:var(--display);font-weight:400;font-size:1.3rem}
.tpls{display:flex;flex-direction:column;gap:8px}
.tpl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:color-mix(in srgb,var(--tc) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--tc) 25%,var(--line));border-left:5px solid var(--tc);border-radius:14px;padding:10px 12px;color:var(--ink)}
.tpl>svg{flex:none;width:18px;height:18px;color:var(--muted)}
.tpl .pb-emo{background:color-mix(in srgb,var(--tc) 18%,#fff)}
.train{background:var(--surface);border:1.5px solid var(--band);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.train-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-2px;z-index:3;background:var(--surface);margin:-14px -14px 0;padding:12px 14px;border-radius:18px 18px 0 0}
.train-head small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.train-head b{font-family:var(--display);font-weight:400;font-size:1.35rem}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.5rem;color:var(--band);background:var(--accent-soft);border-radius:12px;padding:4px 12px}
.btn.big{padding:13px 16px;font-size:1rem;border-radius:12px}
.done-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:#e1efe3;color:var(--ok);border-radius:10px;padding:9px 12px;font-weight:600;font-size:.88rem;text-align:left}
.done-row span{text-decoration:underline;font-weight:500}
.exset{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.exset-h{display:flex;align-items:center;gap:10px}
.sets{display:flex;flex-direction:column;gap:6px}
.set-h,.set{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:center}
.set.cardio,.set-h:has(+.set.cardio){grid-template-columns:34px 1fr}
.stp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.stp input{border:0!important;border-radius:0!important;padding:8px 2px!important;flex:1;min-width:0}
.stp input.up-in{color:var(--ok);font-weight:700}
.sb{flex:none;width:32px;height:38px;border:0;background:var(--accent-soft);color:var(--accent);font-size:1.15rem;font-weight:700;padding:0;line-height:1}
.sb:active{background:var(--band);color:var(--on-band)}
.set button.sn{cursor:pointer;padding:0}
.set button.sn svg{width:16px;height:16px}
.set-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.set-foot small{font-size:.74rem;color:var(--muted)}
.sdone{flex:none;font-size:.78rem;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.exset.all{border-color:var(--ok)}
.exset.all .sdone{background:var(--ok);border-color:var(--ok);color:#fff}
.mark{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.95rem;color:#fff}
.mark.ok{background:var(--ok)}
.mark.miss{background:#c0453a}
.pblock.is-miss{opacity:.78}
.pblock.is-done .pb-txt b::after{content:"";}
.train.edit{border-color:#d0a03c}
.edit-dur label{display:flex;align-items:center;gap:8px;font-size:.9rem}
.edit-dur input{width:80px;font:inherit;text-align:center;padding:7px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.danger-l{color:#b0412e;align-self:center}
.hist-sec{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hlist button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:12px;padding:8px 12px;color:var(--ink)}
.hd{flex:none;width:38px;text-align:center;line-height:1.05}
.hd b{display:block;font-size:1.15rem}
.hd small{font-size:.7rem;color:var(--muted);text-transform:uppercase}
.set-h{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.set-h span:first-child{text-align:center}
.set .sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:.82rem;font-weight:700;justify-self:center}
.set.on .sn{background:var(--ok);border-color:var(--ok);color:#fff}
.set input{font:inherit;font-size:1rem;text-align:center;padding:8px 6px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.set input:focus{outline:none;border-color:var(--accent)}
.set input::placeholder{color:#a3a6b8}

.add-set{align-self:flex-start;border:1px dashed var(--line);background:none;color:var(--accent);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.85rem}
.sum-sheet{gap:14px}
.sum-top{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.sum-emo{font-size:2.4rem;line-height:1}
.sum-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum-stats div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.sum-stats b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.sum-stats small{font-size:.72rem;color:var(--muted)}
.up{color:var(--ok)} .down{color:#b0412e}
.sec-l{margin:0;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sum-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum-list li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.sum-list li:first-child{border-top:0}
.dif{flex:none;font-weight:700;font-size:.86rem;border-radius:999px;padding:3px 9px;background:var(--bg)}
.dif.up{background:#e1efe3;color:var(--ok)} .dif.down{background:#f6e3df;color:#b0412e} .dif.new{background:var(--accent-soft);color:var(--accent)} .dif.same{color:var(--muted)}
.kcal-row{display:flex;flex-direction:column;gap:2px;font-size:.88rem}
.kcal-row label{display:flex;align-items:center;gap:8px}
.kcal-row input{width:80px!important;font:inherit;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;text-align:center;background:var(--bg)}
.kcal-row small{color:var(--muted);font-size:.76rem}
.hist{display:flex;flex-direction:column;gap:6px}
.spark{width:100%;height:70px}
.hist ul{list-style:none;margin:0;padding:0;font-size:.86rem;display:flex;flex-direction:column;gap:3px}
.hist li{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.hist li b{color:var(--ink);font-weight:600}
/* Ich */
.me-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.me-t{font-family:var(--display);font-weight:400;font-size:1.25rem}
.me-t small{font-family:var(--body);font-size:.78rem;color:var(--muted)}
.me-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.me-grid.two{grid-template-columns:repeat(2,1fr)}
.me-grid label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted)}
.me-grid input{font:inherit;font-size:1rem;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0;width:100%;text-align:center}
.me-grid input:focus{outline:none;border-color:var(--accent)}
.me-card.res{border-color:var(--band)}
.me-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.me-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.me-list li span{color:var(--muted)}
.hr-row{display:flex;flex-direction:column;gap:6px}
.hr-row small{font-size:.76rem;color:var(--muted)}
.hr-row .flabel small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted)}
/* Streak */
.streak-card{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--accent-soft);border:1px solid var(--line)}
.streak-card .sc-emo{font-size:1.4rem;letter-spacing:-4px}
.streak-card.t1{background:#fff3e0;border-color:#f3c98b}
.streak-card.t2{background:linear-gradient(100deg,#ffe3c2,#fff3e0);border-color:#f0a95a}
.streak-card.t3{background:linear-gradient(100deg,#ffcf9e,#ffe9cf);border-color:#e9822d}

.fr-streak{flex:none;font-size:.8rem;font-weight:700;color:#7a2e05;background:#ffe3c2;border-radius:999px;padding:2px 8px}
.pb-head.ro{cursor:default}
.prest.ro{cursor:default}
.hrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:12px;padding:8px 12px}

.share-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}

.share-row b{font-weight:600;font-size:.94rem}
.share-row small{font-size:.8rem;color:var(--muted)}
.sw{position:relative;flex:none;width:46px;height:28px}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;pointer-events:none}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--ok)}

.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.fr-row-g{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink)}

.back-l{align-self:flex-start;text-decoration:none}
.fr-head{display:flex;align-items:center;gap:12px}
.fr-head b{display:block;font-family:var(--display);font-weight:400;font-size:1.4rem}
.fr-head small{color:var(--muted);font-size:.84rem}

.fr-tpl-h{display:flex;align-items:center;gap:10px}

.grp-head .n{font-size:.8rem;color:var(--muted);font-weight:600}

.grp.open .grp-head svg{transform:rotate(180deg)}
.grp-body{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.exrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;color:var(--ink);border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exrow svg{flex:none;width:16px;height:16px;color:var(--muted)}
.add-in{border:1px dashed var(--line);background:none;color:var(--accent);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem;text-align:left}

.th{flex:none;width:52px;height:40px;border-radius:8px;overflow:hidden;background:var(--accent-soft);display:block}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.none{background:repeating-linear-gradient(45deg,var(--accent-soft),var(--accent-soft) 6px,var(--surface) 6px,var(--surface) 12px)}
.th-btn{border:0;background:none;padding:0;flex:none;line-height:0;border-radius:8px}
.sub-l{margin:4px 0 -2px;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sub-l small{text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400}
.sugrow{padding:0 6px 0 0;gap:4px}
.sug-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;text-align:left;color:var(--ink)}
.plus{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:1.2rem;font-weight:700;line-height:1;padding:0}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pics figure{margin:0;display:flex;flex-direction:column;gap:4px}
.pics img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;background:var(--accent-soft)}
.pics figcaption{font-size:.76rem;color:var(--muted);text-align:center;font-weight:600}
@media (max-width:420px){.pics{grid-template-columns:1fr}}
.info-g{margin:-6px 0 0;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.88rem}
.card-note{color:var(--muted);font-size:.88rem;margin:0}
/* Bögen */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(15,16,32,.5);padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:420px;max-height:100%;overflow-y:auto;background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px -20px rgba(15,16,32,.6)}
.sheet h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.5rem}
.field{display:flex;flex-direction:column;gap:6px}
.flabel{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sheet input[type=text],.sheet input[inputmode]{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.sheet input:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:.85rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--band);border-color:var(--band);color:var(--on-band)}
.chip.sug{border-style:dashed}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted)}
.picks{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow-y:auto}
.picks .pg>b{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.pick{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:.95rem}
.pick input{width:20px;height:20px;accent-color:var(--band)}
.sheet-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-actions .right{display:flex;gap:8px;margin-left:auto}
.del{background:none;border:0;color:var(--muted);font-size:.85rem;text-decoration:underline;padding:4px 0}
.del.sure{color:#b0412e;font-weight:600}
.err{color:#b0412e;font-size:.85rem;margin:0}

/* Kopf wie auf den anderen Seiten */
.foot-count{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand" id="head">
    <div class="wordmark" aria-hidden="true">Gym</div>
    <h1 class="sr-only">Gym</h1>
  </header>
  <div class="count" id="count"></div>

  <section class="panel">
    <div class="topbar">
      <div class="seg" role="group" aria-label="Ansicht"><button type="button" data-view="week" aria-pressed="true">Wochenplan</button><button type="button" data-view="ex" aria-pressed="false">Übungen</button><button type="button" data-view="fr" aria-pressed="false">Freunde</button><button type="button" data-view="me" aria-pressed="false">Ich</button></div>
    </div>
    <div class="scroll" id="list"></div>
  </section>
  <div class="status" id="status" aria-live="polite"></div>
</div>

<div class="modal" id="exModal" hidden>
  <form class="sheet" id="exForm" role="dialog" aria-modal="true" aria-labelledby="exTitle" autocomplete="off">
    <h3 id="exTitle">Neue Übung</h3>
    <div class="field"><span class="flabel">Muskelgruppe</span><div class="chips" id="exGroups"></div></div>
    <div class="field"><label class="flabel" for="exName">Übung</label><input type="text" id="exName" maxlength="60" placeholder="z.B. Bankdrücken"><div class="chips" id="exSug"></div></div>
    <div class="nums">
      <label>Sätze<input inputmode="numeric" id="exSets" maxlength="2" placeholder="3"></label>
      <label>Wdh.<input inputmode="text" id="exReps" maxlength="7" placeholder="10"></label>
      <label>Gewicht kg<input inputmode="decimal" id="exKg" maxlength="6" placeholder="–"></label>
    </div>
    <p class="err" id="exErr" hidden></p>
    <div class="sheet-actions"><button class="del" type="button" id="exDel" hidden>Löschen</button>
      <div class="right"><button class="ghost" type="button" id="exCancel">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></div>
  </form>
</div>

<div class="modal" id="infoModal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="Übung" id="infoBody"></div></div>

<div class="modal" id="tplModal" hidden>
  <form class="sheet" id="tplForm" role="dialog" aria-modal="true" aria-labelledby="tplTitle" autocomplete="off">
    <h3 id="tplTitle">Neues Workout</h3>
    <div class="field"><label class="flabel" for="tplName">Name</label><input type="text" id="tplName" maxlength="30" placeholder="z.B. Push, Pull, Beine">
      <div class="chips" id="tplSug"></div></div>
    <div class="field"><span class="flabel">Übungen im Workout</span><div class="picks" id="tplPicks"></div></div>
    <p class="err" id="tplErr" hidden></p>
    <div class="sheet-actions"><button class="del" type="button" id="tplDel" hidden>Workout löschen</button>
      <div class="right"><button class="ghost" type="button" id="tplCancel">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></div>
  </form>
</div>

<div class="modal" id="sumModal" hidden><div class="sheet sum-sheet" role="dialog" aria-modal="true" aria-label="Zusammenfassung" id="sumBody"></div></div>

<div class="modal" id="dayModal" hidden>
  <form class="sheet" id="dayForm" role="dialog" aria-modal="true" aria-labelledby="dayTitle" autocomplete="off">
    <h3 id="dayTitle">In den Plan</h3>
    <div class="field"><span class="flabel">Welches Workout?</span><div class="tplpick" id="tplPick"></div></div>
    <div class="field"><span class="flabel">Wann gehst du ins Gym?</span>
      <div class="timerow"><input type="time" id="dayTime" value="18:00" aria-label="Uhrzeit"><div class="chips" id="dayDur"></div></div></div>
    <div class="field"><span class="flabel">Wiederholen</span>
      <div class="seg rep-seg" role="group" aria-label="Wiederholung"><button type="button" data-rep="once">Einmalig</button><button type="button" data-rep="weekly">Wöchentlich</button><button type="button" data-rep="every">Alle … Tage</button></div>
      <div id="repWeekly" class="chips wdays"></div>
      <div id="repEvery" class="timerow"><span>Alle</span><span class="stepper"><button type="button" data-repn="-1" aria-label="Weniger">−</button><b id="repN">2</b><button type="button" data-repn="1" aria-label="Mehr">+</button></span><span>Tage, ab</span><input type="date" id="repStart" aria-label="Startdatum"></div>
      <div id="repOnce" class="timerow"><span>Am</span><input type="date" id="repDate" aria-label="Datum"></div>
      <p class="rep-hint" id="repHint"></p></div>
    <div class="sheet-actions"><button class="del" type="button" id="dayRest" hidden>Aus dem Plan nehmen</button>
      <div class="right"><button class="ghost" type="button" id="dayCancel">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></div>
  </form>
</div>

  const CSS = `

    /* ---------- Profil, Einstellungen ---------- */
    function profileView(){
      const pb=pubCache.get(user.uid)||{}; let photo=okPhoto(pb.photo)?pb.photo:null;
      show("Mein Profil","Name, Bild und ein paar Worte über dich sehen deine Freunde.",`
        <div class="pf-photo"><span class="ours-av" id="pfPrev">${photo?`<img src="${photo}" alt="">`:esc(initial(profile.name))}</span>
          <div><button class="auth-btn alt" type="button" id="pfPick">${photo?"Bild ändern":"Profilbild wählen"}</button>

      $a("#pfDrop").onclick=()=>{ photo=null; $a("#pfPrev").textContent=initial($a("#pfIn").value||profile.name); $a("#pfDrop").hidden=true; $a("#pfPick").textContent="Profilbild wählen"; };
      $a("#pfFile").onchange=async e=>{
        const f=e.target.files[0]; e.target.value=""; if(!f) return;
        try{ // quadratisch zuschneiden, klein halten
          const bmp=await createImageBitmap(f), m=Math.min(bmp.width,bmp.height), c=document.createElement("canvas"); c.width=c.height=256;
          c.getContext("2d").drawImage(bmp,(bmp.width-m)/2,(bmp.height-m)/2,m,m,0,0,256,256);
          photo=c.toDataURL("image/jpeg",.82); $a("#pfPrev").innerHTML=`<img src="${photo}" alt="">`; $a("#pfDrop").hidden=false; $a("#pfPick").textContent="Bild ändern";
        }catch(err){ msg("Das Bild konnte nicht gelesen werden. Nimm ein JPG oder PNG.",true); }
      };
      $a("#pfSave").onclick=async()=>{
        const name=$a("#pfIn").value.trim().slice(0,30), bio=$a("#pfBio").value.trim().slice(0,140); if(!name) return msg("Gib einen Namen ein.",true);
        $a("#pfSave").disabled=true;

          await db.ref(`pub/${user.uid}`).set({name,bio:bio||null,photo:photo||null,at:Date.now()});
          pubSet({name,bio:bio||null,photo:photo||null});
          if(name!==profile.name){
            await db.ref(`users/${user.uid}/profile/name`).set(name); profile.name=name;
            const ptr=(await db.ref(`users/${user.uid}/spaces`).once("value")).val()||{};
            for(const s of Object.values(ptr)) await db.ref(`spaces/${s}/profiles/${user.uid}/name`).set(name).catch(()=>{});
          }
          updateMenu(); hide();
        }catch(err){ $a("#pfSave").disabled=false; msg("Speichern hat nicht geklappt. Prüf die Regeln in Firebase.",true); }
      };

    function settingsView(){

    /* ---------- Personen und Einladungen für diese Seite ---------- */

        ${type==="gym"?`<p class="auth-note">Dein Gymplan gehört nur dir. Deine Freunde können ihn im Gym unter „Freunde“ ansehen und Workouts kopieren, aber nichts ändern.</p>`:""}
        <div${type==="gym"?" hidden":""}>
        ${(()=>{ const fl=Object.entries(friends).filter(([id])=>!access[id]); return fl.length?`<p class="auth-sec">Freunde einladen</p>
          <ul class="auth-people">${fl.map(([id,f])=>`<li>${avatar(id,f.name,30)}<span class="nm"><b>${esc(f.name||"Freund")}</b><small>bekommt die Einladung unter „Freunde“</small></span>
          <button type="button" class="rm yes" data-fr-inv="${esc(id)}">Einladen</button></li>`).join("")}</ul>`:""; })()}
        <p class="auth-sec">Per Link einladen</p>
        <p class="auth-note">Der Link gilt nur für ${esc(PAGE.label)} und nur für eine Person. Wer ihn öffnet, tritt mit eigenem Konto bei. Deine anderen Seiten sieht die Person nicht.</p>

        <div class="auth-copy" id="invBox" hidden><input type="text" id="invLink" readonly aria-label="Einladungslink"><button class="auth-btn" type="button" id="invCopy">Kopieren</button></div>
        </div>
        <p class="auth-msg" id="authMsg" hidden></p>
        ${nInv?`<button class="auth-link" type="button" id="invRevoke">${nInv} offene${nInv===1?"r Link":" Links"} · alle zurückziehen</button>`:""}
        ${ids.length>1&&DATA[type]?`<button class="auth-link danger" type="button" id="leave">Austreten und alles mitnehmen</button>`:""}
        <button class="auth-btn alt" type="button" id="ppClose">Fertig</button>`,true);
      $a("#ppClose").onclick=()=>{ rmConfirm=null; hide(); };
      $a("#invNew").onclick=async()=>{
        const code=rand(20);
        try{
          await db.ref(`spaces/${sid}/invites/${code}`).set({by:user.uid,at:Date.now()});
          const base=location.href.split("#")[0].replace(/[^/]*$/,"");
          $a("#invLink").value=`${base}${PAGE.file}#join-${sid}-${code}`; $a("#invBox").hidden=false; msg("");

      };
      $a("#invCopy").onclick=async()=>{
        try{ await navigator.clipboard.writeText($a("#invLink").value); msg("Kopiert. Jetzt per WhatsApp oder Mail verschicken."); }
        catch(e){ $a("#invLink").select(); msg("Markiert. Jetzt kopieren und verschicken."); }
      };
      screen.querySelectorAll("[data-fr-inv]").forEach(b=>b.onclick=async()=>{
        b.disabled=true; b.textContent="…";
        try{ await inviteFriend(b.dataset.frInv); b.textContent="Eingeladen ✓"; b.classList.remove("yes"); b.classList.add("done"); }
        catch(err){ b.disabled=false; b.textContent="Einladen"; msg("Die Einladung hat nicht geklappt. Prüf die Regeln in Firebase.",true); }
      });
      const rv=$a("#invRevoke"); if(rv) rv.onclick=async()=>{ await db.ref(`spaces/${sid}/invites`).remove().catch(()=>{}); peopleView(); };
      screen.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
        const id=b.dataset.rm;
        if(rmConfirm!==id){ rmConfirm=id; peopleView(); return; }
        rmConfirm=null;
        await db.ref(`spaces/${sid}/access/${id}`).remove().catch(()=>{});
        await db.ref(`spaces/${sid}/profiles/${id}`).remove().catch(()=>{});
        peopleView();
      });
      const lv=$a("#leave"); if(lv) lv.onclick=async()=>{
        const w=(DATA[type]||{}).word||["Eintrag","Einträge"];
        if(lv.dataset.sure!=="1"){ lv.dataset.sure="1"; lv.textContent=`Wirklich austreten? Du nimmst alle ${w[1]} als eigene ${PAGE.noun} mit. Neue teilt ihr dann nicht mehr.`; return; }
        lv.textContent=`${w[1]} werden mitgenommen …`; lv.disabled=true;
        const nid=rand(20);
        try{
          await db.ref(`spaces/${nid}/access/${user.uid}`).set("owner");
          await db.ref(`spaces/${nid}/meta`).set({type,owner:user.uid,createdAt:Date.now()});
          await copyData(sid,nid);
          await db.ref(`users/${user.uid}/spaces/${type}`).set(nid);
          if(type==="recipes"){
            const rd=(await db.ref(`spaces/${sid}/readers`).once("value")).val()||{};
            for(const [k,v] of Object.entries(rd)) if(v&&v.by===user.uid) await db.ref(`spaces/${sid}/readers/${k}`).remove().catch(()=>{});
            await db.ref(`spaces/${sid}/share/${user.uid}`).remove().catch(()=>{});

          // die anderen behalten die Liste; wer übrig bleibt, darf sie weiter verwalten
          const acc=(await db.ref(`spaces/${sid}/access`).once("value")).val()||{};
          for(const id of Object.keys(acc)) if(id!==user.uid) await db.ref(`spaces/${sid}/meta/owners/${id}`).set(true).catch(()=>{});
          await db.ref(`spaces/${sid}/meta/owners/${user.uid}`).remove().catch(()=>{});
          await db.ref(`spaces/${sid}/profiles/${user.uid}`).remove().catch(()=>{});

    /* ---------- Freunde ---------- */
    let friends={}, requestsIn={}, inbox={}, friendCode=null, friendsOpen=false, frConfirm=null;
    const frBadge=()=>Object.keys(requestsIn).length+Object.keys(inbox).length;
    let chatUnread=0;
    function updateFriendBadge(){
      const n=frBadge(), b=document.getElementById("pfFriendBadge"), d=document.getElementById("pfDot"), c=document.getElementById("pfChatBadge");
      if(b){ b.textContent=n; b.hidden=!n; } if(c){ c.textContent=chatUnread; c.hidden=!chatUnread; } if(d) d.hidden=!(n||chatUnread);
      const cb=document.getElementById("oursChatN"); if(cb){ cb.textContent=chatUnread>99?"99+":chatUnread; cb.hidden=!chatUnread; }
    }
    function watchChats(){
      db.ref(`chatIndex/${user.uid}`).on("value",s=>{ const v=s.val()||{}; chatUnread=Object.values(v).reduce((a,x)=>a+(x&&+x.unread>0?+x.unread:0),0);
        updateFriendBadge(); document.dispatchEvent(new CustomEvent("ours-chat",{detail:{unread:chatUnread,index:v}})); },()=>{});
    }
    async function ensureFriendCode(){
      friendCode=(await db.ref(`users/${user.uid}/friendCode`).once("value")).val();
      if(friendCode) return;
      for(let i=0;i<5 && !friendCode;i++){
        const c=rand(8).toUpperCase().replace(/[^A-Z0-9]/g,"X");
        try{ await db.ref(`friendCodes/${c}`).set(user.uid); await db.ref(`users/${user.uid}/friendCode`).set(c); friendCode=c; }catch(e){}
      }
    }
    function watchFriends(){
      db.ref(`friends/${user.uid}`).on("value",s=>{ friends=s.val()||{}; if(friendsOpen) friendsView(); },()=>{});
      db.ref(`requests/${user.uid}`).on("value",s=>{ requestsIn=s.val()||{}; updateFriendBadge(); if(friendsOpen) friendsView(); },()=>{});
      db.ref(`inbox/${user.uid}`).on("value",s=>{ inbox=s.val()||{}; updateFriendBadge(); if(friendsOpen) friendsView(); },()=>{});
    }
    const myName=()=>profile.name||user.email.split("@")[0];
    async function sendRequest(code){
      code=String(code||"").trim().toUpperCase().replace(/^.*#FRIEND-/,"").replace(/[^A-Z0-9]/g,"");
      if(code.length<6) return {err:"Gib einen Freundescode ein. Er hat 8 Zeichen."};
      const uid=(await db.ref(`friendCodes/${code}`).once("value")).val();
      if(!uid) return {err:"Zu diesem Code gibt es niemanden. Prüf die Schreibweise."};
      if(uid===user.uid) return {err:"Das ist dein eigener Code."};
      if(friends[uid]) return {ok:`${friends[uid].name||"Diese Person"} ist schon dein Freund.`};
      if(requestsIn[uid]){ await acceptRequest(uid); return {ok:`Ihr seid jetzt befreundet.`}; }
      await db.ref(`requests/${uid}/${user.uid}`).set({name:myName(),at:Date.now()});
      return {ok:"Freundschaftsanfrage gesendet. Sobald sie angenommen ist, erscheint die Person hier."};
    }
    async function acceptRequest(from){
      const req=requestsIn[from]||{}, now=Date.now();
      await db.ref(`friends/${user.uid}/${from}`).set({name:req.name||"Freund",since:now});
      await db.ref(`friends/${from}/${user.uid}`).set({name:myName(),since:now});
      await db.ref(`requests/${user.uid}/${from}`).remove();
    }
    function friendsView(msgText,isErr){
      friendsOpen=true;
      const base=location.href.split("#")[0].replace(/[^/]*$/,"");
      const link=friendCode?`${base}index.html#friend-${friendCode}`:"";

      const pageOf=t=>PAGES.find(p=>p.type===(t==="swipe"?"recipes":t))||PAGES[0];
      show("Freunde",fl.length?`${fl.length} ${fl.length===1?"Freund":"Freunde"}`:"Füg Freunde hinzu, um sie schnell zu deinen Listen einzuladen.",`
        ${inv.length?`<p class="auth-sec">Einladungen</p><ul class="auth-people">${inv.map(([id,x])=>`<li>${avatar(x.from,x.fromName,30)}
          <span class="nm"><b>${esc(x.fromName||"Jemand")}</b><small>${x.type==="swipe"?"will mit dir Rezepte swipen":`lädt dich zu ${esc(pageOf(x.type).label)} ein`}</small></span>
          <button type="button" class="rm" data-inv-no="${esc(id)}">Nein</button><button type="button" class="rm yes" data-inv-yes="${esc(id)}">Annehmen</button></li>`).join("")}</ul>`:""}
        ${reqs.length?`<p class="auth-sec">Anfragen</p><ul class="auth-people">${reqs.map(([id,x])=>`<li>${avatar(id,x.name,30)}
          <span class="nm"><b>${esc(x.name||"Jemand")}</b><small>möchte mit dir befreundet sein</small></span>
          <button type="button" class="rm" data-req-no="${esc(id)}">Ablehnen</button><button type="button" class="rm yes" data-req-yes="${esc(id)}">Annehmen</button></li>`).join("")}</ul>`:""}
        <p class="auth-sec">Deine Freunde</p>
        ${fl.length?`<ul class="auth-people">${fl.map(([id,f])=>`<li>${avatar(id,f.name,30)}<span class="nm"><b>${esc(f.name||"Freund")}</b><small>befreundet seit ${new Date(f.since||Date.now()).toLocaleDateString("de-DE")}</small></span>
          <button type="button" class="rm${frConfirm===id?" sure":""}" data-fr-rm="${esc(id)}">${frConfirm===id?"Entfernen?":"Entfernen"}</button></li>`).join("")}</ul>`
          :`<p class="auth-note">Noch keine Freunde. Schick deinen Code oder Link, oder gib unten einen Code ein.</p>`}
        <p class="auth-sec">Dein Freundescode</p>
        <div class="fr-code">${esc(friendCode||"…")}</div>
        <div class="auth-copy"><input type="text" id="frLink" readonly value="${esc(link)}" aria-label="Dein Freundes-Link"><button class="auth-btn" type="button" id="frCopy">Link kopieren</button></div>
        <p class="auth-sec">Freund hinzufügen</p>
        <form class="auth-copy" id="frAdd" autocomplete="off"><input type="text" id="frIn" maxlength="40" placeholder="Code, z.B. K7M2QX9A" aria-label="Freundescode"><button class="auth-btn" type="submit">Senden</button></form>
        <p class="auth-msg${isErr?" err":""}" id="authMsg"${msgText?"":" hidden"}>${esc(msgText||"")}</p>
        <button class="auth-btn alt" type="button" id="frClose">Fertig</button>`,true);
      $a("#frClose").onclick=()=>{ friendsOpen=false; frConfirm=null; hide(); };
      $a("#frCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(link); msg("Kopiert. Schick den Link an deine Freunde."); }catch(e){ $a("#frLink").select(); msg("Markiert. Jetzt kopieren und verschicken."); } };
      $a("#frAdd").onsubmit=async e=>{ e.preventDefault(); try{ const r=await sendRequest($a("#frIn").value); friendsView(r.err||r.ok,!!r.err); }catch(err){ friendsView("Das hat nicht geklappt. Prüf die Regeln in Firebase.",true); } };
      screen.querySelectorAll("[data-req-yes]").forEach(b=>b.onclick=async()=>{ try{ await acceptRequest(b.dataset.reqYes); }catch(e){ friendsView("Annehmen hat nicht geklappt.",true); } });
      screen.querySelectorAll("[data-req-no]").forEach(b=>b.onclick=()=>db.ref(`requests/${user.uid}/${b.dataset.reqNo}`).remove().catch(()=>{}));
      screen.querySelectorAll("[data-inv-no]").forEach(b=>b.onclick=()=>db.ref(`inbox/${user.uid}/${b.dataset.invNo}`).remove().catch(()=>{}));
      screen.querySelectorAll("[data-inv-yes]").forEach(b=>b.onclick=async()=>{

        await db.ref(`inbox/${user.uid}/${b.dataset.invYes}`).remove().catch(()=>{});
        const target=`${p.file}#join-${x.sid}-${x.code}`;
        if(p.type===type){ history.replaceState(null,"",target); location.reload(); } else location.href=target;
      });
      screen.querySelectorAll("[data-fr-rm]").forEach(b=>b.onclick=async()=>{
        const id=b.dataset.frRm; if(frConfirm!==id){ frConfirm=id; friendsView(); return; }
        frConfirm=null;
        await db.ref(`friends/${user.uid}/${id}`).remove().catch(()=>{});
        await db.ref(`friends/${id}/${user.uid}`).remove().catch(()=>{});
      });
    }
    // Freund direkt zu dieser Liste einladen (landet bei ihm unter "Freunde")
    async function inviteFriend(fid){
      const code=rand(20);
      await db.ref(`spaces/${sid}/invites/${code}`).set({by:user.uid,at:Date.now(),for:fid});
      await db.ref(`inbox/${fid}`).push().set({type,sid,code,from:user.uid,fromName:myName(),at:Date.now()});

    /* ---------- Seite ohne Bereich: neu anlegen ---------- */
    function setupView(problem){
      hide();
      const wrap=document.querySelector(".wrap"), head=document.querySelector("header");
      if(!setupEl){ setupEl=document.createElement("div"); setupEl.className="auth-setup"; wrap.style.position="relative"; wrap.appendChild(setupEl); }
      setupEl.style.top=(head.offsetTop+head.offsetHeight)+"px";
      const cnt=document.getElementById("count"); if(cnt) cnt.textContent="";
      let oldCode=null; try{ oldCode=localStorage.getItem("dateideen.code"); }catch(e){}
      setupEl.innerHTML=`<div class="box">
        <h3>${esc(PAGE.empty)}</h3>
        ${problem?`<p class="auth-msg err">${esc(problem)}</p>`:""}
        <p class="auth-note">${esc(PAGE.hint)}</p>
        ${oldCode?`<label class="auth-check"><input type="checkbox" id="setMig" checked> Bisherige ${esc(PAGE.label)} von diesem Gerät übernehmen</label>`:""}
        <p class="auth-msg" id="authMsg" hidden></p>
        <button class="auth-btn" type="button" id="setNew">${PAGE.type==="chores"?"Neuen Haushalt anlegen":PAGE.type==="budget"?"Budget anlegen":`${esc(PAGE.noun)} anlegen`}</button>
        <p class="auth-note">Hat dich jemand eingeladen? Dann öffne einfach den Einladungslink.</p>
      </div>`;
      setupEl.hidden=false;
      setupEl.querySelector("#setNew").onclick=async()=>{
        const btn=setupEl.querySelector("#setNew"); btn.disabled=true; msg("Wird angelegt …",false,setupEl);
        const id=rand(20);
        try{
          await db.ref(`spaces/${id}/access/${user.uid}`).set("owner");
          await db.ref(`spaces/${id}/meta`).set({type,owner:user.uid,createdAt:Date.now()});
          const mig=setupEl.querySelector("#setMig");
          if(mig && mig.checked && oldCode){ msg("Bisherige Daten werden übernommen …",false,setupEl); await migrate(oldCode,id); }
          await db.ref(`users/${user.uid}/spaces/${type}`).set(id);
          ready(id);
        }catch(err){ msg("Das Anlegen hat nicht geklappt. Prüf die Internetverbindung und die Regeln in Firebase.",true,setupEl); btn.disabled=false; }
      };
    }
    // alte Daten vom geheimen Link übernehmen, nur was zu dieser Seite gehört
    async function migrate(code,id){
      if(type==="budget"){
        const b=(await db.ref(`lists/${code}/budget`).once("value")).val();
        if(b) await db.ref(`spaces/${id}`).update(b);
        return;
      }
      const out={};
      for(const k of PAGE.keys){ const v=(await db.ref(`lists/${code}/${k}`).once("value")).val(); if(v!=null) out[k]=v; }
      const ids=new Set();
      if(out.ideas) Object.values(out.ideas).forEach(i=>(Array.isArray(i.photos)?i.photos:[]).forEach(p=>ids.add(p)));
      if(out.recipes) Object.values(out.recipes).forEach(r=>{ if(r.cover) ids.add(r.cover); });
      if(ids.size){ out.photos={}; for(const p of ids){ const v=(await db.ref(`lists/${code}/photos/${p}`).once("value")).val(); if(v) out.photos[p]=v; } }
      if(Object.keys(out).length) await db.ref(`spaces/${id}`).update(out);
    }

    /* ---------- Einladung annehmen ---------- */
    // wie viele Einträge eine Liste hat (für die Frage beim Beitreten)
    async function countData(id){
      const d=DATA[type]; if(!d) return 0;
      try{ return Object.keys((await db.ref(`spaces/${id}/${d.keys[0]}`).once("value")).val()||{}).length; }catch(e){ return 0; }
    }
    async function join(j,current,mode){
      if(current && current!==j.sid && !mode){
        const n=await countData(current), d=DATA[type], w=d?d.word:["Eintrag","Einträge"];
        if(n>0){
          show(`Einladung zu ${PAGE.label}`,"",`<p class="auth-note">Du hast schon eine eigene ${esc(PAGE.noun)} mit <b>${n} ${n===1?w[0]:w[1]}</b>. Was soll damit passieren?</p>
            <button class="auth-btn" type="button" id="jYes">Mitnehmen und zusammenlegen</button>
            <p class="auth-note">Deine ${w[1]} kommen in die gemeinsame ${esc(PAGE.noun)}. Sie gehört dann euch beiden. Wenn du später austrittst, nimmst du alles mit.</p>
            <button class="auth-btn alt" type="button" id="jDrop">Nicht mitnehmen und löschen</button>
            <p class="auth-note">Du trittst ohne deine ${w[1]} bei. Deine bisherige ${esc(PAGE.noun)} wird gelöscht.</p>
            <button class="auth-link" type="button" id="jNo">Abbrechen, bei meiner bleiben</button>`);
          $a("#jYes").onclick=()=>{ $a("#jYes").disabled=true; $a("#jYes").textContent="Wird zusammengelegt …"; join(j,current,"merge"); };
          $a("#jDrop").onclick=()=>{ const b=$a("#jDrop"); if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent=`Wirklich löschen? ${n} ${n===1?w[0]:w[1]} gehen verloren.`; return; }
            b.disabled=true; join(j,current,"drop"); };
          $a("#jNo").onclick=()=>{ clearHash(); hide(); open(current); };
          return;
        }
        mode="drop";   // eigene Liste ist leer: einfach wechseln
      }
      try{
        await db.ref(`spaces/${j.sid}/access/${user.uid}`).set(j.code);
        await db.ref(`spaces/${j.sid}/meta/owners/${user.uid}`).set(true).catch(()=>{});   // gehört dann allen gemeinsam
        if(current && current!==j.sid){
          if(mode==="merge") await copyData(current,j.sid);
          // alte Liste aufräumen: löschen, wenn sonst niemand drin war, sonst nur selbst austreten
          try{ const acc=(await db.ref(`spaces/${current}/access`).once("value")).val()||{};
            if(Object.keys(acc).length<=1) await db.ref(`spaces/${current}`).remove();
            else { await db.ref(`spaces/${current}/profiles/${user.uid}`).remove(); await db.ref(`spaces/${current}/meta/owners/${user.uid}`).remove().catch(()=>{}); await db.ref(`spaces/${current}/access/${user.uid}`).remove(); } }catch(e){}
        }
        await db.ref(`users/${user.uid}/spaces/${type}`).set(j.sid);
        await db.ref(`spaces/${j.sid}/invites/${j.code}`).remove().catch(()=>{});   // Link gilt nur einmal
        clearHash(); ready(j.sid);
      }catch(err){ clearHash(); if(current) open(current); else setupView("Der Einladungslink ist ungültig oder wurde zurückgezogen."); }
    }
    let confirm_=false;
    // Alle Daten dieser Seite samt Fotos von einer Liste in eine andere kopieren (Vorhandenes bleibt)
    async function copyData(from,to){
      const d=DATA[type]; if(!d) return;
      const photos=new Set();
      for(const key of d.keys){
        const src=(await db.ref(`spaces/${from}/${key}`).once("value")).val(); if(!src) continue;
        const dst=(await db.ref(`spaces/${to}/${key}`).once("value")).val()||{};
        const out={};
        if(key==="week"){   // Gym-Wochenplan: Übungen je Tag zusammenführen
          const A=Array.isArray(src)?Object.assign({},src):src, B=Array.isArray(dst)?Object.assign({},dst):dst;
          for(const [day,v] of Object.entries(A)){ if(!v) continue; const b=B[day];
            if(!b) out[day]=v; else out[day]={title:b.title||v.title||null,ex:[...new Set([...(b.ex||[]),...(v.ex||[])])]}; }
        }else if(key==="log"){   // abgehakte Übungen je Datum zusammenführen
          for(const [day,v] of Object.entries(src)) out[day]={...(v||{}),...(dst[day]||{})};
        }else if(key==="rooms"||key==="cats"){   // eigene Namen: doppelte weglassen
          const have=new Set(Object.values(dst));
          for(const [k,v] of Object.entries(src)) if(!have.has(v) && !dst[k]) out[k]=v;
        }else{
          for(const [k,v] of Object.entries(src)){ if(dst[k] || !v) continue; out[k]=v;
            if(v.cover && /^[0-9a-f]{32}$/.test(v.cover)) photos.add(v.cover);
            if(Array.isArray(v.photos)) v.photos.forEach(p=>{ if(/^[0-9a-f]{32}$/.test(p)) photos.add(p); }); }
        }
        if(Object.keys(out).length) await db.ref(`spaces/${to}/${key}`).update(out);
      }
      for(const p of photos){ const ph=(await db.ref(`spaces/${from}/photos/${p}`).once("value")).val(); if(ph) await db.ref(`spaces/${to}/photos/${p}`).set(ph); }
    }

    async function open(id){
      try{ await db.ref(`spaces/${id}/meta`).once("value"); ready(id); }
      catch(err){ await db.ref(`users/${user.uid}/spaces/${type}`).remove().catch(()=>{}); setupView("Du hast keinen Zugriff mehr auf diese Liste. Leg eine neue an oder lass dich wieder einladen."); }
    }
    function ready(id){
      sid=id; hide(); if(setupEl) setupEl.hidden=true; updateMenu();
      db.ref(`spaces/${id}/profiles/${user.uid}`).update({name:profile.name||user.email.split("@")[0],email:user.email}).catch(()=>{});
      if(started) return; started=true;
      cb(db.ref("spaces/"+id),{uid:user.uid,sid:id,email:user.email,name:profile.name});
    }

    auth.onAuthStateChanged(async u=>{
      if(!u){ if(user){ location.reload(); return; } loginView(parseJoin()||/^#friend-/.test(location.hash)?"register":"login"); return; }
      user=u;
      show(PAGE.label,"",`<p class="auth-note">Lädt …</p>`);
      try{
        pubDb=db;
        profile=(await db.ref(`users/${u.uid}/profile`).once("value")).val()||{};
        if(!profile.name){
          let n=""; try{ n=sessionStorage.getItem("auth.newName")||""; sessionStorage.removeItem("auth.newName"); }catch(e){}
          profile.name=n||u.displayName||u.email.split("@")[0];
          await db.ref(`users/${u.uid}/profile/name`).set(profile.name);
        }
        try{ const pb=(await db.ref(`pub/${u.uid}`).once("value")).val()||{}; pubCache.set(u.uid,pb);
          if(pb.name!==profile.name) await db.ref(`pub/${u.uid}/name`).set(profile.name); pubCache.get(u.uid).name=profile.name; }catch(e){}
        window.Auth._profileView=profileView; window.Auth.me=u.uid;
        installMenu();
        try{ await ensureFriendCode(); watchFriends(); watchChats(); }catch(e){}
        const fr=location.hash.match(/^#friend-([A-Za-z0-9]{6,12})$/);
        if(fr){ clearHash(); setTimeout(async()=>{ let r; try{ r=await sendRequest(fr[1]); }catch(e){ r={err:"Die Anfrage hat nicht geklappt."}; } friendsView(r.err||r.ok,!!r.err); },400); }
        if(PAGE.noSpace){ hide(); updateMenu(); if(!started){ started=true; cb(null,{uid:u.uid,email:u.email,name:profile.name,db}); } return; }
        const current=(await db.ref(`users/${u.uid}/spaces/${type}`).once("value")).val();
        const j=parseJoin();
        if(j){ await join(j,current); return; }
        if(current){ await open(current); return; }
        setupView();
      }catch(err){
        show(PAGE.label,"",`<p class="auth-msg err">Die Daten konnten nicht geladen werden. Prüf die Internetverbindung und die Regeln in Firebase.</p>
          <button class="auth-btn" type="button" onclick="location.reload()">Neu laden</button>
          <button class="auth-link" type="button" id="authOut">Abmelden</button>`);
        $a("#authOut").onclick=()=>auth.signOut();
      }
    });
  }};
})();

function streakOf(plan,ses,uidX){

  const today=iso(new Date()); let n=0; const d=new Date(); d.setHours(12,0,0,0);

    const di=iso(d), occ=entries.filter(([,w])=>occurs(w,di)&&di>=iso(new Date(w.at||0)));
    for(const [wid,w] of occ){ if(isDone(di,wid,w)) n++; else if(di<today) return n; }
    d.setDate(d.getDate()-1);
  }

}

async function endTraining(){
  const a=activeSession(); if(!a) return;
  const end=Date.now(), dur=Math.round((end-a.start)/1000), t=templates[a.tpl]||{}, ex=tEx(t);
  let vol=0; ex.forEach(x=>{ const b=best(setsOf(a,x.id)); if(b) vol+=b.vol; });
  const upd={end,dur,vol:Math.round(vol)}; upd.kcal=kcalFor({dur},ex);
  const anyDone=ex.some(x=>doneSets(setsOf(a,x.id)).length);
  if(!anyDone){ const b=$("#endTrain"); if(b&&b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent="Noch kein Satz abgehakt – trotzdem beenden?"; return; } }
  Object.assign(sessions[a.id],upd); await root.child("sessions/"+a.id).update(upd).catch(showErr);
  clearInterval(tick); render(); showSummary(a.id);
}
function recalc(id){
  const se={id,...sessions[id]}, ex=tEx(templates[se.tpl]||{}); let vol=0; ex.forEach(x=>{ const b=best(setsOf(se,x.id)); if(b) vol+=b.vol; });
  return {vol:Math.round(vol),kcal:kcalFor({dur:se.dur||0},ex)};
}
async function saveEdit(){
  const id=editId; if(!id||!sessions[id]) return;
  const m=num($("#editDur")&&$("#editDur").value); if(m!=null) sessions[id].dur=Math.round(m*60);
  Object.keys(setTimers).forEach(k=>clearTimeout(setTimers[k]));
  const upd={dur:sessions[id].dur||0,sets:sessions[id].sets||null,n:sessions[id].n||null,...(()=>{ const r=recalc(id); return r; })()};
  Object.assign(sessions[id],upd); await root.child("sessions/"+id).update(upd).catch(showErr);
  editId=null; render(); showSummary(id);
}
function delSession(id,btn){

}
function showSummary(id){
  const se={id,...sessions[id]}, t=templates[se.tpl]||{title:"Training"}, ex=tEx(t);
  const prev=mySessions().filter(x=>x.end&&x.tpl===se.tpl&&x.start<se.start).sort((a,b)=>b.start-a.start)[0];
  const rows=ex.map(x=>{ const b=best(setsOf(se,x.id)); if(!b) return null; const l=lastFor(x.id,se.start), lb=l?best(setsOf(l,x.id)):null, cardio=x.group==="cardio";
    let diff="neu", cls="new";
    if(lb){ if(cardio){ const d=b.tot-lb.tot; diff=d>0?`+${d} min`:d<0?`${d} min`:"gleich"; cls=d>0?"up":d<0?"down":"same"; }
      else if(b.kg!==lb.kg){ const d=Math.round((b.kg-lb.kg)*10)/10; diff=`${d>0?"+":""}${fmtKg(d)} kg`; cls=d>0?"up":"down"; }
      else { const d=b.reps-lb.reps; diff=d?`${d>0?"+":""}${d} Wdh.`:"gleich"; cls=d>0?"up":d<0?"down":"same"; } }
    return `<li><span class="exn"><b>${esc(x.name)}</b><small>${cardio?`${b.tot} min`:`bester Satz ${b.reps}×${fmtKg(b.kg)} kg · ${(n=>`${n} ${n===1?"Satz":"Sätze"}`)(doneSets(setsOf(se,x.id)).length)}`}</small></span><span class="dif ${cls}">${cls==="up"?"▲ ":cls==="down"?"▼ ":""}${diff}</span></li>`; }).filter(Boolean);
  const dv=prev&&prev.vol?Math.round((se.vol-prev.vol)/prev.vol*100):null;

      <p class="card-note">${new Date(se.start).toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}</p></div>
    <div class="sum-stats"><div><b>${fmtDur(se.dur||0)}</b><small>Dauer</small></div><div><b>ca. ${se.kcal||0}</b><small>kcal</small></div>
      <div><b>${fmtKg((se.vol||0)/1000)} t</b><small>bewegt${dv!=null?` · <span class="${dv>=0?"up":"down"}">${dv>0?"+":""}${dv} %</span>`:""}</small></div></div>
    ${rows.length?`<p class="sec-l">Im Vergleich zum letzten Mal${ups?` · ${ups}× gesteigert`:""}</p><ul class="sum-list">${rows.join("")}</ul>`:`<p class="card-note">Du hast keine Sätze eingetragen.</p>`}

      <small>${se.hrAvg&&ageOf()?`Kalorien aus deinem Puls berechnet${hrMaxOf()?` · Intensität ca. ${Math.round(num(se.hrAvg)/hrMaxOf()*100)} % vom Maximalpuls`:""}.`:se.hrAvg?"Für die Berechnung aus dem Puls fehlen Geburtsjahr und Geschlecht unter „Ich“.":`Geschätzt aus Dauer und ${num(body.weight)?"deinem Gewicht":"75 kg (dein Gewicht trägst du unter „Ich“ ein)"}. Mit Ø-Puls wird es genauer.`}</small></div>
    <div class="sheet-actions"><button class="btn" type="button" data-edit-sess="${esc(id)}">Bearbeiten</button><button class="del" type="button" data-del-sess="${esc(id)}">Löschen</button>

function kw(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }

// Fortschritt einer Übung: bestes Gewicht (Cardio: Minuten) je Training als kleine Kurve
function histHtml(id,x){
  const cardio=x.group==="cardio";
  const pts=mySessions().filter(se=>se.end).sort((a,b)=>a.start-b.start).map(se=>({se,b:best(setsOf(se,id))})).filter(p=>p.b);
  if(!pts.length) return `<p class="sec-l">Fortschritt</p><p class="card-note">Noch keine Trainings mit dieser Übung. Sobald du sie im Training einträgst, siehst du hier deine Entwicklung.</p>`;
  const val=p=>cardio?p.b.tot:(p.b.kg||p.b.reps), vs=pts.map(val), mx=Math.max(...vs), mn=Math.min(...vs), W=300, H=70, pad=8;
  const xy=pts.map((p,i)=>[pts.length===1?W/2:pad+i*(W-2*pad)/(pts.length-1), H-pad-(mx===mn?0.5:(val(p)-mn)/(mx-mn))*(H-2*pad)]);
  const first=vs[0], lastV=vs[vs.length-1], d=Math.round((lastV-first)*10)/10, unit=cardio?"min":(pts[0].b.kg?"kg":"Wdh.");
  return `<div class="hist"><p class="sec-l">Fortschritt${pts.length>1?` · <span class="${d>=0?"up":"down"}">${d>0?"+":""}${fmtKg(d)} ${unit} seit dem ersten Mal</span>`:""}</p>
    <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="var(--band)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${xy.map(p=>p.join(",")).join(" ")}"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--band)"/>`).join("")}</svg>
    <ul>${pts.slice(-5).reverse().map(p=>`<li><span>${new Date(p.se.start).toLocaleDateString("de-DE",{day:"numeric",month:"short"})}</span><b>${cardio?`${p.b.tot} min`:`${p.b.reps} × ${fmtKg(p.b.kg)} kg`}</b></li>`).join("")}</ul></div>`;
}

  workouts[id]=data; root.child("workouts/"+id).set(data).catch(showErr);
  const show=rep.type==="once"?rep.date:rep.type==="every"?rep.start:dayEdit.onDi; openKey=occurs(data,dayEdit.onDi)?`${dayEdit.onDi}|${id}`:null;
  closeDay(); render();
});

/* ---------- Workouts erstellen (Name + Übungen) ---------- */
let tplEdit=null;
function openTpl(id){
  const t=id?templates[id]:null; tplEdit={id:id||null,sel:new Set(t&&Array.isArray(t.ex)?t.ex:[])};
  $("#tplTitle").textContent=t?"Workout bearbeiten":"Neues Workout"; $("#tplName").value=t?t.title:""; $("#tplErr").hidden=true;
  $("#tplDel").hidden=!t; $("#tplDel").textContent="Workout löschen"; delete $("#tplDel").dataset.sure;
  $("#tplSug").innerHTML=DAY_SUG.map(s=>`<button type="button" class="chip sug" data-ts="${esc(s)}">${esc(s)}</button>`).join("");
  const list=exList();
  $("#tplPicks").innerHTML=list.length?GROUPS.map(g=>{ const it=list.filter(x=>x.group===g.id).sort((a,b)=>a.name.localeCompare(b.name,"de")); if(!it.length) return "";
      return `<div class="pg"><b><span class="gdot" style="background:${g.col}"></span>${esc(g.name)}</b>${it.map(x=>`<label class="pick"><input type="checkbox" data-tpick="${esc(x.id)}"${tplEdit.sel.has(x.id)?" checked":""}>${thumb(imgOf(x))}<span class="exn"><b>${esc(x.name)}</b><small>${esc(fmtEx(x))}</small></span></label>`).join("")}</div>`; }).join("")
    :`<p class="err" style="color:var(--muted)">Du hast noch keine Übungen. Füg sie zuerst unten bei den Muskelgruppen hinzu.</p>`;
  $("#tplModal").hidden=false; if(!t) setTimeout(()=>$("#tplName").focus(),30);
}
const closeTpl=()=>{ $("#tplModal").hidden=true; tplEdit=null; };
$("#tplCancel").addEventListener("click",closeTpl);
$("#tplModal").addEventListener("click",e=>{ if(e.target.id==="tplModal") return closeTpl(); const s=e.target.closest("[data-ts]"); if(s) $("#tplName").value=s.dataset.ts; });
$("#tplModal").addEventListener("change",e=>{ const c=e.target.closest("[data-tpick]"); if(!c||!tplEdit) return; if(c.checked) tplEdit.sel.add(c.dataset.tpick); else tplEdit.sel.delete(c.dataset.tpick); });
$("#tplForm").addEventListener("submit",e=>{
  e.preventDefault(); if(!tplEdit||!root) return;
  const title=$("#tplName").value.trim().slice(0,30), err=t=>{ $("#tplErr").textContent=t; $("#tplErr").hidden=false; };
  if(!title) return err("Gib dem Workout einen Namen, z.B. Push.");
  const ex=exList().filter(x=>tplEdit.sel.has(x.id)).sort((a,b)=>GROUPS.findIndex(g=>g.id===a.group)-GROUPS.findIndex(g=>g.id===b.group)||a.name.localeCompare(b.name,"de")).map(x=>x.id);
  if(!ex.length) return err("Wähl mindestens eine Übung aus.");
  const id=tplEdit.id||uid(), data={title,ex,at:(tplEdit.id&&templates[id].at)||Date.now()};
  templates[id]=data; root.child("templates/"+id).set(data).catch(showErr); closeTpl(); render();
  if(!tplEdit){ $("#status").textContent=`Workout „${title}“ gespeichert. Leg es jetzt im Wochenplan auf deine Tage.`; setTimeout(()=>{ $("#status").textContent=""; },5000); }

$("#tplDel").addEventListener("click",()=>{
  if(!tplEdit||!tplEdit.id) return; const b=$("#tplDel");
  if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent="Wirklich löschen? Es fliegt auch aus dem Plan."; return; }

$("#sumModal").addEventListener("click",e=>{

  const ed=e.target.closest("[data-edit-sess]"); if(ed){ if(activeSession()){ $("#status").textContent="Beende zuerst dein laufendes Training."; return; }
    editId=ed.dataset.editSess; $("#sumModal").hidden=true; view="week"; render(); setTimeout(()=>{ const t=$("#train"); if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); },60); return; }

$("#sumModal").addEventListener("change",e=>{

});

/* ---------- Kalender: Termine als .ics (wiederkehrend wie im Plan, mit Erinnerung) ---------- */
function exportCal(onlyKey){
  const p2=n=>String(n).padStart(2,"0"), stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z", BY=["MO","TU","WE","TH","FR","SA","SU"];
  const escI=t=>String(t).replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  const f=x=>`${x.getFullYear()}${p2(x.getMonth()+1)}${p2(x.getDate())}T${p2(x.getHours())}${p2(x.getMinutes())}00`;
  const at=(di,t)=>{ const [y,m,d]=di.split("-").map(Number), [h,mi]=(t||"18:00").split(":").map(Number); return new Date(y,m-1,d,h,mi); };
  let items;
  if(onlyKey){ const [di,wid]=onlyKey.split("|"); items=workouts[wid]?[[wid,workouts[wid],di]]:[]; }
  else items=Object.entries(workouts).filter(([,w])=>wEx(w).length).map(([wid,w])=>{
    const r=w.rep||{}; let first=r.type==="once"?r.date:r.type==="every"?r.start:null;
    if(r.type==="weekly"){ const mon=monday(0); for(let k=0;k<7;k++){ const d=new Date(mon); d.setDate(mon.getDate()+k); if(occurs(w,iso(d))){ first=iso(d); break; } } }
    return first?[wid,w,first]:null; }).filter(Boolean);
  if(!items.length){ $("#status").textContent="Plan zuerst ein Workout, dann kannst du es in den Kalender übernehmen."; return; }
  const ev=items.map(([wid,w,di])=>{ const s=at(di,timeOfW(w)), e=new Date(s.getTime()+durOfW(w)*60000), r=w.rep||{}, ty=typeOf(w);
    const rr=onlyKey?null:r.type==="weekly"?`RRULE:FREQ=WEEKLY;BYDAY=${r.days.map(i=>BY[i]).join(",")}`:r.type==="every"?`RRULE:FREQ=DAILY;INTERVAL=${r.n}`:null;
    return ["BEGIN:VEVENT",`UID:ours-gym-${wid}${onlyKey?"-"+di:""}@ours`,`DTSTAMP:${stamp}`,`DTSTART:${f(s)}`,`DTEND:${f(e)}`,rr,
      `SUMMARY:${escI("Gym: "+wTitle(w))}`,`DESCRIPTION:${escI(wEx(w).map(x=>`${x.name} (${fmtEx(x)})`).join("\n"))}`,
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Gym","TRIGGER:-PT30M","END:VALARM","END:VEVENT"].filter(Boolean).join("\r\n"); });
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ours//Gym//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH",...ev,"END:VCALENDAR"].join("\r\n");
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"}), url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=onlyKey?"gym-termin.ics":"gym-plan.ics"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  $("#status").textContent=onlyKey?"Termin erstellt. Öffne die Datei, um ihn in deinen Kalender zu übernehmen."
    :`${items.length} ${items.length===1?"Workout":"Workouts"} mit Wiederholung und Erinnerung 30 Minuten vorher erstellt. Öffne die Datei, um sie in deinen Kalender zu übernehmen.`;
  setTimeout(()=>{ $("#status").textContent=""; },9000);
}

  const v=e.target.closest("[data-view]"); if(v){ view=v.dataset.view; try{ localStorage.setItem("gym.view",view); }catch(err){} if(view==="fr"){ frOpen=null; loadFriends(); } render(); return; }

  const ow=e.target.closest("[data-open-w]"); if(ow){ const k=ow.dataset.openW; openKey=openKey===k?null:k; showEx=false; render(); return; }
  const nw=e.target.closest("[data-new-on]"); if(nw) return openWEdit(null,nw.dataset.newOn);

  const cpt=e.target.closest("[data-copy-tpl]"); if(cpt){ const [fid,tid]=cpt.dataset.copyTpl.split("|"); cpt.disabled=true; cpt.textContent="Kopiert ✓"; return doCopy(fid,tid); }
  const cpa=e.target.closest("[data-copy-all]"); if(cpa){ if(cpa.dataset.sure!=="1"){ cpa.dataset.sure="1"; cpa.textContent="Wirklich kopieren? Es kommt zu deinem Plan dazu."; return; } cpa.disabled=true; cpa.textContent="Wird kopiert …"; return doCopy(cpa.dataset.copyAll,null).then(()=>{ cpa.textContent="Kopiert ✓"; }); }
  const tp=e.target.closest("[data-tpl]"); if(tp) return openTpl(tp.dataset.tpl);

  if(e.target.closest("#saveEdit")) return saveEdit();
  const ds=e.target.closest("#train [data-del-sess]"); if(ds) return delSession(ds.dataset.delSess,ds);
  const ct=e.target.closest("#cancelTrain"); if(ct){ if(ct.dataset.sure!=="1"){ ct.dataset.sure="1"; ct.textContent="Wirklich abbrechen? Die Einträge gehen verloren."; return; }
    const a=activeSession(); if(a){ delete sessions[a.id]; root.child("sessions/"+a.id).remove().catch(showErr); clearInterval(tick); render(); } return; }
  const as=e.target.closest("[data-addset]"); if(as){ const a=workSession(); if(!a) return; const n=+as.dataset.n+1; a.n=a.n||{}; a.n[as.dataset.addset]=n; sessions[a.id].n=a.n; root.child(`sessions/${a.id}/n/${as.dataset.addset}`).set(n).catch(()=>{}); render(); return; }
  const sm=e.target.closest("[data-sum]"); if(sm) return showSummary(sm.dataset.sum);
  const g=e.target.closest("[data-grp]"); if(g){ const id=g.dataset.grp; if(openGrp.has(id)) openGrp.delete(id); else openGrp.add(id); render(); return; }

});
// Beim Runterscrollen schiebt sich der helle Bereich über den Kopf
(()=>{ const wrap=$(".wrap"), head=$("#head"), sc=$("#list");
  const measure=()=>{ if(!wrap.classList.contains("compact")) wrap.style.setProperty("--headH",head.offsetHeight+"px"); };
  sc.addEventListener("scroll",()=>{ measure(); if(sc.scrollTop>24) wrap.classList.add("compact"); else if(sc.scrollTop<=2) wrap.classList.remove("compact"); },{passive:true});
  addEventListener("resize",measure); measure(); })();

// früherer Wochenplan (fester Tag je Training) → Workouts mit wöchentlicher Wiederholung; gleiche Trainings werden zusammengefasst
let migrated=false;
function migrateWeek(){
  if(migrated||!wLoaded||!weekLoaded||!root) return;
  const days=Object.entries(week).filter(([,d])=>d&&Array.isArray(d.ex)&&d.ex.length); migrated=true; if(!days.length) return;
  const groups={};
  days.forEach(([i,d])=>{ const k=JSON.stringify([d.title||"",d.ex,d.time||"",d.dur||60]); (groups[k]=groups[k]||{d,days:[]}).days.push(+i); });
  const upd={}; Object.values(groups).forEach(g=>{ upd[uid()]={title:g.d.title||"Workout",ex:g.d.ex,time:g.d.time||null,dur:g.d.dur||60,rep:{type:"weekly",days:g.days.sort()},at:Date.now()}; });
  Object.assign(workouts,upd); root.child("workouts").update(upd).then(()=>root.child("week").remove()).catch(showErr); render();
}

// ältere Plan-Einträge mit eigenem Namen und Übungen → eigenes Workout, Plan zeigt darauf
let planMigrated=false;
function migratePlan(){
  if(planMigrated||!wLoaded||!tLoaded||!root) return; planMigrated=true;
  const tu={}, wu={};
  Object.entries(workouts).forEach(([wid,w])=>{ if(!w||w.tpl||!Array.isArray(w.ex)) return;
    const same=Object.entries({...templates,...tu}).find(([,t])=>t.title===(w.title||"Workout")&&JSON.stringify(t.ex)===JSON.stringify(w.ex));
    const tid=same?same[0]:uid(); if(!same) tu[tid]={title:w.title||"Workout",ex:w.ex,at:w.at||Date.now()};
    wu[wid+"/tpl"]=tid; wu[wid+"/title"]=null; wu[wid+"/ex"]=null; });
  if(!Object.keys(wu).length) return;
  Object.assign(templates,tu); Object.keys(wu).filter(k=>k.endsWith("/tpl")).forEach(k=>{ const wid=k.split("/")[0]; workouts[wid].tpl=wu[k]; delete workouts[wid].title; delete workouts[wid].ex; });
  (Object.keys(tu).length?root.child("templates").update(tu):Promise.resolve()).then(()=>root.child("workouts").update(wu)).catch(showErr); render();
}

  root=r; if(info){ myUid=info.uid; mySid=info.sid; myName=info.name||"Ich"; }
  if(root&&info){ initShare(); if(view==="fr") loadFriends();
    fdb().ref(`users/${myUid}/body`).on("value",s=>{ body=s.val()||{}; if(view==="me"&&!(document.activeElement&&document.activeElement.matches("[data-bodyin]"))) render(); },()=>{}); } history.replaceState(null,"",location.pathname); render();
  if(!root){ $("#status").textContent="Die Datenbank konnte nicht geladen werden. Prüf die Internetverbindung und lade die Seite neu."; return; }
  root.child("exercises").on("value",s=>{ exercises=s.val()||{}; render(); },showErr);
  root.child("workouts").on("value",s=>{ workouts=s.val()||{}; wLoaded=true; migrateWeek(); migratePlan(); render(); });
  root.child("templates").on("value",s=>{ templates=s.val()||{}; tLoaded=true; migratePlan(); render(); });
  root.child("sessions").on("value",s=>{ sessions=s.val()||{}; render(); });
  root.child("bw").on("value",s=>{ bw=s.val()||{}; });
  root.child("week").on("value",s=>{ const v=s.val()||{}; week=Array.isArray(v)?Object.fromEntries(v.map((x,i)=>[i,x]).filter(([,x])=>x)):v; weekLoaded=true; migrateWeek(); });

});
