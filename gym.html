  if(dv!=null&&Math.abs(dv)>=3) list.push(`Insgesamt ${dv>0?`${dv} % mehr`:`${-dv} % weniger`} Gewicht bewegt als beim letzten „${(templates[se.tpl]||{}).title||"Training"}“.`);
  if(planMin&&min) list.push(min<planMin*.7?`${min} Minuten – kürzer als geplant (${planMin}).`:min>planMin*1.3?`${min} Minuten – länger als geplant (${planMin}).`:`${min} Minuten – passt zu deinem Plan.`);

  let tip="";

function showSummary(id){

function histHtml(id,x){

let tplEdit=null;
function openTpl(id){
  const t=id?templates[id]:null; tplEdit={id:id||null,sel:new Set(t&&Array.isArray(t.ex)?t.ex:[]),col:(t&&t.col)||""};
  $("#tplCols").innerHTML=colPicker(tplEdit.col,"data-tcol");
  $("#tplTitle").textContent=t?"Workout bearbeiten":"Neues Workout"; $("#tplName").value=t?t.title:""; $("#tplErr").hidden=true;
  $("#tplDel").hidden=!t; $("#tplDel").textContent="Workout löschen"; delete $("#tplDel").dataset.sure;
  $("#tplSug").innerHTML=DAY_SUG.map(s=>`<button type="button" class="chip sug" data-ts="${esc(s)}">${esc(s)}</button>`).join("");
  const list=exList();
  $("#tplPicks").innerHTML=list.length?GROUPS.map(g=>{ const it=list.filter(x=>x.group===g.id).sort((a,b)=>a.name.localeCompare(b.name,"de")); if(!it.length) return "";
      return `<div class="pg"><b><span class="gdot" style="background:${g.col}"></span>${esc(g.name)}</b>${it.map(x=>`<label class="pick"><input type="checkbox" data-tpick="${esc(x.id)}"${tplEdit.sel.has(x.id)?" checked":""}>${thumb(imgOf(x))}<span class="exn"><b>${esc(x.name)}</b><small>${esc(fmtEx(x))}</small></span></label>`).join("")}</div>`; }).join("")
    :`<p class="err" style="color:var(--muted)">Du hast noch keine Übungen. Füg sie zuerst unten bei den Muskelgruppen hinzu.</p>`;
  $("#tplModal").hidden=false; if(!t) setTimeout(()=>$("#tplName").focus(),30);
}

/* ---------- Kalender: Termine als .ics (wiederkehrend wie im Plan, mit Erinnerung) ---------- */
function exportCal(onlyKey){
  const p2=n=>String(n).padStart(2,"0"), stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z", BY=["MO","TU","WE","TH","FR","SA","SU"];
  const escI=t=>String(t).replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  const f=x=>`${x.getFullYear()}${p2(x.getMonth()+1)}${p2(x.getDate())}T${p2(x.getHours())}${p2(x.getMinutes())}00`;
  const at=(di,t)=>{ const [y,m,d]=di.split("-").map(Number), [h,mi]=(t||"18:00").split(":").map(Number); return new Date(y,m-1,d,h,mi); };
  let items;
  if(onlyKey){ const [di,wid]=onlyKey.split("|"); items=workouts[wid]?[[wid,workouts[wid],di]]:[]; }
  else items=Object.entries(workouts).filter(([,w])=>wEx(w).length).map(([wid,w])=>{
    const r=w.rep||{}; let first=r.type==="once"?r.date:r.type==="every"?r.start:null;
    if(r.type==="weekly"){ const mon=monday(0); for(let k=0;k<7;k++){ const d=new Date(mon); d.setDate(mon.getDate()+k); if(occurs(w,iso(d))){ first=iso(d); break; } } }
    return first?[wid,w,first]:null; }).filter(Boolean);
  if(!items.length){ $("#status").textContent="Plan zuerst ein Workout, dann kannst du es in den Kalender übernehmen."; return; }
  const ev=items.map(([wid,w,di])=>{ const s=at(di,timeOfW(w)), e=new Date(s.getTime()+durOfW(w)*60000), r=w.rep||{}, ty=typeOf(w);
    const rr=onlyKey?null:r.type==="weekly"?`RRULE:FREQ=WEEKLY;BYDAY=${r.days.map(i=>BY[i]).join(",")}`:r.type==="every"?`RRULE:FREQ=DAILY;INTERVAL=${r.n}`:null;
    return ["BEGIN:VEVENT",`UID:ours-gym-${wid}${onlyKey?"-"+di:""}@ours`,`DTSTAMP:${stamp}`,`DTSTART:${f(s)}`,`DTEND:${f(e)}`,rr,
      `SUMMARY:${escI("Gym: "+wTitle(w))}`,`DESCRIPTION:${escI(wEx(w).map(x=>`${x.name} (${fmtEx(x)})`).join("\n"))}`,
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Gym","TRIGGER:-PT30M","END:VALARM","END:VEVENT"].filter(Boolean).join("\r\n"); });
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ours//Gym//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH",...ev,"END:VCALENDAR"].join("\r\n");
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"}), url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=onlyKey?"gym-termin.ics":"gym-plan.ics"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  $("#status").textContent=onlyKey?"Termin erstellt. Öffne die Datei, um ihn in deinen Kalender zu übernehmen."
    :`${items.length} ${items.length===1?"Workout":"Workouts"} mit Wiederholung und Erinnerung 30 Minuten vorher erstellt. Öffne die Datei, um sie in deinen Kalender zu übernehmen.`;
  setTimeout(()=>{ $("#status").textContent=""; },9000);
}

// früherer Wochenplan (fester Tag je Training) → Workouts mit wöchentlicher Wiederholung; gleiche Trainings werden zusammengefasst
let migrated=false;
function migrateWeek(){
  if(migrated||!wLoaded||!weekLoaded||!root) return;
  const days=Object.entries(week).filter(([,d])=>d&&Array.isArray(d.ex)&&d.ex.length); migrated=true; if(!days.length) return;
  const groups={};
  days.forEach(([i,d])=>{ const k=JSON.stringify([d.title||"",d.ex,d.time||"",d.dur||60]); (groups[k]=groups[k]||{d,days:[]}).days.push(+i); });
  const upd={}; Object.values(groups).forEach(g=>{ upd[uid()]={title:g.d.title||"Workout",ex:g.d.ex,time:g.d.time||null,dur:g.d.dur||60,rep:{type:"weekly",days:g.days.sort()},at:Date.now()}; });
  Object.assign(workouts,upd); root.child("workouts").update(upd).then(()=>root.child("week").remove()).catch(showErr); render();
}

// ältere Plan-Einträge mit eigenem Namen und Übungen → eigenes Workout, Plan zeigt darauf
let planMigrated=false;
function migratePlan(){
  if(planMigrated||!wLoaded||!tLoaded||!root) return; planMigrated=true;
  const tu={}, wu={};
  Object.entries(workouts).forEach(([wid,w])=>{ if(!w||w.tpl||!Array.isArray(w.ex)) return;
    const same=Object.entries({...templates,...tu}).find(([,t])=>t.title===(w.title||"Workout")&&JSON.stringify(t.ex)===JSON.stringify(w.ex));
    const tid=same?same[0]:uid(); if(!same) tu[tid]={title:w.title||"Workout",ex:w.ex,at:w.at||Date.now()};
    wu[wid+"/tpl"]=tid; wu[wid+"/title"]=null; wu[wid+"/ex"]=null; });
  if(!Object.keys(wu).length) return;
  Object.assign(templates,tu); Object.keys(wu).filter(k=>k.endsWith("/tpl")).forEach(k=>{ const wid=k.split("/")[0]; workouts[wid].tpl=wu[k]; delete workouts[wid].title; delete workouts[wid].ex; });
  (Object.keys(tu).length?root.child("templates").update(tu):Promise.resolve()).then(()=>root.child("workouts").update(wu)).catch(showErr); render();
}

/* ---------- Spotify (Anmeldung mit PKCE direkt im Browser, Token bleibt auf diesem Gerät) ---------- */
// Client-ID aus dem Spotify Developer Dashboard (developer.spotify.com → Dashboard → deine App)
const SPOTIFY_CLIENT_ID = "a10cfde81bfd4c32a36ea9c691dc3c2b";
const SP_SCOPES="user-read-playback-state user-modify-playback-state user-read-currently-playing";
const spRedirect=()=>location.origin+location.pathname;
let spTok=null; try{ spTok=JSON.parse(localStorage.getItem("spotify.tok")||"null"); }catch(e){}
let spMe=null, spState=null, spAt=0, spOpen=false, spPoll=null, spTick=null, spMsg="", spErr=false, spBusy=false;
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const spSave=t=>{ spTok=t; try{ t?localStorage.setItem("spotify.tok",JSON.stringify(t)):localStorage.removeItem("spotify.tok"); }catch(e){} };
async function spConnect(){
  if(!SPOTIFY_CLIENT_ID) throw new Error("Spotify ist für diese App noch nicht eingerichtet.");
  const rnd=crypto.getRandomValues(new Uint8Array(48)), verifier=b64url(rnd), state=b64url(crypto.getRandomValues(new Uint8Array(12)));
  const challenge=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
  try{ sessionStorage.setItem("spotify.pkce",JSON.stringify({verifier,state})); }catch(e){}
  location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({client_id:SPOTIFY_CLIENT_ID,response_type:"code",redirect_uri:spRedirect(),
    code_challenge_method:"S256",code_challenge:challenge,scope:SP_SCOPES,state}).toString();
}
async function spTokenReq(params){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:SPOTIFY_CLIENT_ID,...params})});
  const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error_description||d.error||"Spotify-Anmeldung fehlgeschlagen.");
  return {at:d.access_token,rt:d.refresh_token||(spTok&&spTok.rt),exp:Date.now()+(d.expires_in||3600)*1000-60000};
}
// Rückkehr von Spotify: ?code=…&state=… gleich beim Laden abholen
const spBack=(()=>{ const q=new URLSearchParams(location.search); if(!q.has("code")&&!q.has("error")) return null;
  const o={code:q.get("code"),state:q.get("state"),error:q.get("error")}; history.replaceState(null,"",location.pathname+location.hash); return o; })();
const spReady=(async()=>{
  if(!spBack) return; let p=null; try{ p=JSON.parse(sessionStorage.getItem("spotify.pkce")||"null"); sessionStorage.removeItem("spotify.pkce"); }catch(e){}
  if(spBack.error){ spMsg=spBack.error==="access_denied"?"Spotify-Verbindung abgebrochen.":"Spotify hat die Verbindung abgelehnt."; spErr=true; return; }
  if(!p||p.state!==spBack.state){ spMsg="Die Spotify-Anmeldung konnte nicht bestätigt werden. Versuch es nochmal."; spErr=true; return; }
  try{ spSave(await spTokenReq({grant_type:"authorization_code",code:spBack.code,redirect_uri:spRedirect(),code_verifier:p.verifier})); $("#status").textContent="Spotify ist verbunden. Tippe auf den grünen Knopf unten."; }
  catch(e){ spMsg=e.message; spErr=true; }
})();
async function spApi(path,opt={}){
  if(!spTok) throw new Error("Nicht mit Spotify verbunden.");
  if(Date.now()>spTok.exp){ try{ spSave(await spTokenReq({grant_type:"refresh_token",refresh_token:spTok.rt})); }catch(e){ spSave(null); spUpd(); throw new Error("Die Spotify-Verbindung ist abgelaufen. Verbinde sie in den Einstellungen neu."); } }
  const r=await fetch("https://api.spotify.com/v1"+path,{...opt,headers:{Authorization:"Bearer "+spTok.at,...(opt.body?{"Content-Type":"application/json"}:{})}});
  if(r.status===401){ spTok.exp=0; return spApi(path,opt); }
  if(r.status===204||r.status===202) return null;
  const d=await r.json().catch(()=>null);
  if(!r.ok){ const reason=d&&d.error&&d.error.reason;
    if(reason==="PREMIUM_REQUIRED"||r.status===403&&/premium/i.test(JSON.stringify(d||""))) throw new Error("Steuern geht nur mit Spotify Premium.");
    if(reason==="NO_ACTIVE_DEVICE"||r.status===404) throw new Error("Kein aktives Gerät. Starte Spotify kurz auf deinem Handy.");
    if(r.status===403) throw new Error("Dein Spotify-Konto ist für diese App noch nicht freigeschaltet.");
    throw new Error((d&&d.error&&d.error.message)||"Spotify hat nicht geantwortet."); }
  return d;
}
const spFmt=ms=>{ const s=Math.max(0,Math.floor(ms/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const spPos=()=>!spState||!spState.item?0:Math.min(spState.item.duration_ms,spState.progress_ms+(spState.is_playing?Date.now()-spAt:0));
async function spFetch(){
  try{ spState=await spApi("/me/player"); spAt=Date.now(); if(spMsg&&!spBusy&&!spErr) spMsg=""; }
  catch(e){ spMsg=e.message; spErr=true; }
  spPaint();
}
const SP_IC={prev:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6v12M18 6l-8.5 6L18 18z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>',
  next:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6v12M6 6l8.5 6L6 18z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>',
  play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>',
  pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5.5h3v13h-3zM13.5 5.5h3v13h-3z" fill="currentColor"/></svg>'};
function spPaint(){
  const fab=$("#spFab"); if(!fab) return; fab.classList.toggle("playing",!!(spState&&spState.is_playing));
  if(!spOpen) return;
  const it=spState&&spState.item, img=it&&it.album&&it.album.images&&it.album.images.length?it.album.images[it.album.images.length>1?1:0].url:"";
  const who=it?(it.artists?it.artists.map(a=>a.name).join(", "):(it.show&&it.show.name)||""):"";
  $("#spCard").innerHTML=`<div class="sp-top">${img?`<img src="${esc(img)}" alt="">`:`<span class="sp-ph">♪</span>`}
      <span class="sp-t"><b>${it?esc(it.name):"Gerade läuft nichts"}</b><small>${it?esc(who):"Starte Musik in Spotify, dann siehst du sie hier."}${spState&&spState.device&&it?` · ${esc(spState.device.name)}`:""}</small></span>
      <button class="sp-x" type="button" id="spClose" aria-label="Schließen">×</button></div>
    ${it?`<div class="sp-bar" id="spBar" role="slider" aria-label="Position im Lied" aria-valuemin="0" aria-valuemax="${Math.round(it.duration_ms/1000)}"><i><b id="spFill"></b></i></div>
    <div class="sp-time"><span id="spCur">0:00</span><span>${spFmt(it.duration_ms)}</span></div>`:""}
    <div class="sp-ctl"><button type="button" data-sp="prev" aria-label="Vorheriges Lied"${spBusy?" disabled":""}>${SP_IC.prev}</button>
      <button type="button" class="sp-pp" data-sp="${spState&&spState.is_playing?"pause":"play"}" aria-label="${spState&&spState.is_playing?"Pause":"Abspielen"}"${spBusy?" disabled":""}>${spState&&spState.is_playing?SP_IC.pause:SP_IC.play}</button>
      <button type="button" data-sp="next" aria-label="Nächstes Lied"${spBusy?" disabled":""}>${SP_IC.next}</button></div>
    ${spMsg?`<p class="sp-msg${spErr?" err":""}">${esc(spMsg)}</p>`:""}`;
  spProg();
}
function spProg(){ const it=spState&&spState.item, fl=$("#spFill"), c=$("#spCur"); if(!it||!fl) return; const p=spPos(); fl.style.width=(p/it.duration_ms*100)+"%"; if(c) c.textContent=spFmt(p); }
function spUpd(){ const fab=$("#spFab"); if(fab) fab.hidden=!spTok; if(!spTok&&spOpen) spToggle(false); }
function spToggle(open){
  spOpen=open; $("#spCard").hidden=!open; $("#spFab").setAttribute("aria-expanded",open);
  clearInterval(spPoll); clearInterval(spTick);
  if(open){ spMsg=spErr?spMsg:""; spErr=false; spPaint(); spFetch(); spPoll=setInterval(()=>{ if(!document.hidden) spFetch(); },4000); spTick=setInterval(spProg,500); }
}
async function spDo(act){
  spBusy=true; spMsg=""; spErr=false; spPaint();
  try{
    if(act==="play") await spApi("/me/player/play",{method:"PUT"});
    else if(act==="pause") await spApi("/me/player/pause",{method:"PUT"});
    else await spApi("/me/player/"+act,{method:"POST"});
    if(spState&&(act==="play"||act==="pause")){ spState.progress_ms=spPos(); spAt=Date.now(); spState.is_playing=act==="play"; }
  }catch(e){ spMsg=e.message; spErr=true; }
  spBusy=false; spPaint(); setTimeout(spFetch,act==="next"||act==="prev"?450:250);
}
$("#spFab").addEventListener("click",e=>{ e.stopPropagation(); setGFab&&$("#gFab").getAttribute("aria-expanded")==="true"&&setGFab(false); spToggle(!spOpen); });
$("#spCard").addEventListener("click",e=>{
  e.stopPropagation();
  if(e.target.closest("#spClose")) return spToggle(false);
  const b=e.target.closest("[data-sp]"); if(b&&!spBusy) return spDo(b.dataset.sp==="prev"?"previous":b.dataset.sp);
  const bar=e.target.closest("#spBar"); if(bar&&spState&&spState.item){ const r=bar.getBoundingClientRect(), pos=Math.round(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*spState.item.duration_ms);
    spState.progress_ms=pos; spAt=Date.now(); spProg(); spApi("/me/player/seek?position_ms="+pos,{method:"PUT"}).catch(err=>{ spMsg=err.message; spErr=true; spPaint(); }); }
});
document.addEventListener("click",e=>{ if(spOpen&&!e.target.closest("#spCard,#spFab")) spToggle(false); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&spOpen) spFetch(); });
// Eintrag in den Einstellungen
Auth.pageSettings.push({sec:"Musik",label:"Spotify",button:()=>spTok?"Trennen":"Verbinden",alt:()=>!!spTok,
  noteHtml:()=>!SPOTIFY_CLIENT_ID?`Noch nicht eingerichtet. Weiterleitungs-Adresse für Spotify: <span class="sel">${esc(spRedirect())}</span>`
    :spTok?`Verbunden${spMe&&spMe.display_name?` als ${esc(spMe.display_name)}`:""}. Unten in der Mitte steuerst du deine Musik.`
    :spErr&&spMsg?esc(spMsg):"Verbinde dein Spotify, dann kannst du im Gym Lieder sehen und steuern (Steuern braucht Premium).",
  disabled:()=>!SPOTIFY_CLIENT_ID,
  action:async()=>{ if(spTok){ spSave(null); spMe=null; spState=null; spUpd(); return; } await spConnect(); }});
spReady.then(async()=>{ spUpd(); if(spTok){ try{ spMe=await spApi("/me"); }catch(e){} } if(spErr&&spMsg) $("#status").textContent=spMsg; });

// Knopf unten rechts: Meine Angaben / Freunde
const setGFab=open=>{ $("#gFabMenu").classList.toggle("open",open); $("#gFabMenu").setAttribute("aria-hidden",!open); $("#gFab").setAttribute("aria-expanded",open);
  document.querySelectorAll("[data-fabview]").forEach(b=>{ b.tabIndex=open?0:-1; b.setAttribute("aria-current",b.dataset.fabview===view); }); };
$("#gFab").addEventListener("click",e=>{ e.stopPropagation(); setGFab($("#gFab").getAttribute("aria-expanded")!=="true"); });
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-fabview]");
  if(o){ setGFab(false); const v=o.dataset.fabview; if(v==="me"&&view!=="me"){ meDraft=null; meMsg=""; } if(v==="fr"){ frOpen=null; loadFriends(); }
    view=v; try{ localStorage.setItem("gym.view",view); }catch(err){} render(); $("#list").scrollTop=0; return; }
  if(!e.target.closest("#gFabMenu,#gFab") && $("#gFab").getAttribute("aria-expanded")==="true") setGFab(false);
});

/* ---------- Start ---------- */
Auth.start(firebaseConfig,"gym",(r,info)=>{
  root=r; if(info){ myUid=info.uid; mySid=info.sid; myName=info.name||"Ich"; }
  if(root&&info){ initShare(); setTimeout(()=>{ loadFriends(); loadReacts(); },600);
    fdb().ref(`users/${myUid}/gymInv`).on("value",s=>{ invState=s.val()||{}; render(); },()=>{});
    loadRecipes();
    fdb().ref(`users/${myUid}/meals`).on("value",s=>{ meals=s.val()||{}; if(view==="food") render(); },()=>{});
    fdb().ref(`users/${myUid}/foods`).on("value",s=>{ foods=s.val()||{}; if(mealPick&&mealPick.tab==="food") renderSug(); },()=>{});
    fdb().ref(`users/${myUid}/bodylog`).on("value",s=>{ bodylog=s.val()||{}; if(view==="prog"&&!(document.activeElement&&document.activeElement.matches("[data-bl],#blTarget"))) render(); },()=>{});
    fdb().ref(`users/${myUid}/body`).on("value",s=>{ body=s.val()||{}; setTimeout(syncKcal,800); if(!meDraft||sameBody()){ meDraft=null; if(view==="me"&&!(document.activeElement&&document.activeElement.matches("[data-mdin]"))) render(); } },()=>{}); } history.replaceState(null,"",location.pathname); render();
  if(!root){ $("#status").textContent="Die Datenbank konnte nicht geladen werden. Prüf die Internetverbindung und lade die Seite neu."; return; }
  root.child("exercises").on("value",s=>{ exercises=s.val()||{}; render(); },showErr);
  root.child("workouts").on("value",s=>{ workouts=s.val()||{}; wLoaded=true; migrateWeek(); migratePlan(); render(); });
  root.child("templates").on("value",s=>{ templates=s.val()||{}; tLoaded=true; migratePlan(); render(); });
  root.child("sessions").on("value",s=>{ sessions=s.val()||{}; render(); });
  root.child("bw").on("value",s=>{ bw=s.val()||{}; });
  root.child("week").on("value",s=>{ const v=s.val()||{}; week=Array.isArray(v)?Object.fromEntries(v.map((x,i)=>[i,x]).filter(([,x])=>x)):v; weekLoaded=true; migrateWeek(); });

});
