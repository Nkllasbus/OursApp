<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ours · Gym</title>
<link rel="icon" href="ours-logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=Playfair+Display:wght@800;900&display=swap">
<style>
/* Gym: eigene Übungen nach Muskelgruppen und ein Wochenplan */
:root{
  --page:#191b2b; --dots:rgba(255,255,255,.035); --frame-line:#12131f; --shadow:rgba(10,11,22,.45);
  --band:#3c4270; --on-band:#eef0fa; --on-band-muted:#b8bcdc;
  --bg:#f2f2f6; --surface:#fcfcfe; --ink:#1e2030; --muted:#6c6f82; --line:#e1e2ea;
  --accent:#3c4270; --accent-soft:#e6e8f3; --btn:#e7e8f0; --ok:#4f8a5b;
  --display:"Gloock", Georgia, serif; --body:"Figtree", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;background-color:var(--page);
  background-image:radial-gradient(var(--dots) 1.2px,transparent 1.2px);background-size:18px 18px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:620px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;gap:12px;background:var(--bg);overflow:hidden;position:relative;
  padding:0 22px max(12px,env(safe-area-inset-bottom,0px))}
@media (max-width:660px){.wrap{padding-left:16px;padding-right:16px}}
@media (min-width:661px){.wrap{border-left:1px solid var(--frame-line);border-right:1px solid var(--frame-line)}}
header{flex:none;margin:0 -22px;background:var(--band);color:var(--on-band);position:relative;transition:margin-top .3s ease}
@media (max-width:660px){header{margin:0 -16px}}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;background:var(--bg);border-radius:14px 14px 0 0}
header.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(12px + env(safe-area-inset-top,0px)) 64px 25px!important}
header.brand .wordmark{font-family:"Playfair Display",var(--display);font-weight:900;font-size:clamp(2.1rem,9.5vw,2.7rem);line-height:1;color:var(--on-band);white-space:nowrap}
header.brand .pf-btn{top:calc(50% - 27px + env(safe-area-inset-top,0px) / 2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap.compact header{margin-top:calc(24px - var(--headH,110px))}
.count{display:none}
.status{flex:none;font-size:.82rem;color:var(--muted)}
.status:empty{display:none}

.panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.topbar{flex:none;display:flex;align-items:center;gap:8px}
.seg{flex:1;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 10px;font-size:.9rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--band);color:var(--on-band)}
.btn{background:var(--btn);color:var(--ink);border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--band);color:var(--on-band)}
.ghost{background:none;border:0;color:var(--muted);padding:8px 4px}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;font-size:.88rem}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 2px 90px;margin:0 -2px;display:flex;flex-direction:column;gap:10px}
.scroll>*{flex:none}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:18px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.empty strong{color:var(--ink);font-family:var(--display);font-weight:400;font-size:1.3rem}

/* Woche */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav b{font-weight:600}
.weeknav small{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.weeknav .arr{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.weeknav .arr svg{width:16px;height:16px}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0 7px;font-size:.72rem;color:var(--muted)}
.wd b{font-size:1rem;color:var(--ink);font-weight:600}
.wd i{width:7px;height:7px;border-radius:50%;background:transparent}
.wd.train i{background:var(--accent)}
.wd.done i{background:var(--ok)}
.wd.today{border-color:var(--band);box-shadow:0 0 0 1px var(--band) inset}
.wd[aria-pressed="true"]{background:var(--band);border-color:var(--band);color:var(--on-band-muted)}
.wd[aria-pressed="true"] b{color:var(--on-band)}
.wd[aria-pressed="true"].train i{background:var(--on-band)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;color:var(--ink)}
.day-head .dn{flex:none;width:42px;text-align:center;line-height:1.1}
.day-head .dn b{display:block;font-size:1.15rem;font-weight:700}
.day-head .dn small{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day-head .dt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.day-head .dt b{font-weight:600}
.day-head .dt small{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-head .prog{flex:none;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--accent-soft);color:var(--accent)}
.day-head .prog.ok{background:#e1efe3;color:var(--ok)}
.day.today{border-color:var(--band)}
.day.rest .dt b{color:var(--muted);font-weight:500}
.day-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.exl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.exl li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-top:1px solid var(--line)}
.exl li:first-child{border-top:0}
.ck{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:transparent;display:grid;place-items:center;padding:0}
.ck svg{width:16px;height:16px}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.exn{flex:1;min-width:0;display:flex;flex-direction:column}
.exn b{font-weight:600;font-size:.95rem}
.exn small{font-size:.78rem;color:var(--muted)}
li.done .exn b{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.gdot{flex:none;width:9px;height:9px;border-radius:50%}
.day-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* Übungen */
.grp{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.grp-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;color:var(--ink)}
.grp-head .gi{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem}
.grp-head b{flex:1;font-weight:600}
.grp-head .n{font-size:.8rem;color:var(--muted);font-weight:600}
.grp-head svg{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.grp.open .grp-head svg{transform:rotate(180deg)}
.grp-body{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.exrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;color:var(--ink);border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exrow svg{flex:none;width:16px;height:16px;color:var(--muted)}
.add-in{border:1px dashed var(--line);background:none;color:var(--accent);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem;text-align:left}

/* Bögen */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(15,16,32,.5);padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:420px;max-height:100%;overflow-y:auto;background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px -20px rgba(15,16,32,.6)}
.sheet h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.5rem}
.field{display:flex;flex-direction:column;gap:6px}
.flabel{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sheet input[type=text],.sheet input[inputmode]{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.sheet input:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:.85rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--band);border-color:var(--band);color:var(--on-band)}
.chip.sug{border-style:dashed}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted)}
.picks{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow-y:auto}
.picks .pg>b{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.pick{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:.95rem}
.pick input{width:20px;height:20px;accent-color:var(--band)}
.sheet-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-actions .right{display:flex;gap:8px;margin-left:auto}
.del{background:none;border:0;color:var(--muted);font-size:.85rem;text-decoration:underline;padding:4px 0}
.del.sure{color:#b0412e;font-weight:600}
.err{color:#b0412e;font-size:.85rem;margin:0}

/* Kopf wie auf den anderen Seiten */
.foot-count{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand" id="head">
    <div class="wordmark" aria-hidden="true">Gym</div>
    <h1 class="sr-only">Gym</h1>
  </header>
  <div class="count" id="count"></div>

  <section class="panel">
    <div class="topbar">
      <div class="seg" role="group" aria-label="Ansicht"><button type="button" data-view="week" aria-pressed="true">Wochenplan</button><button type="button" data-view="ex" aria-pressed="false">Übungen</button></div>
      <button class="btn primary" type="button" id="addEx">+ Übung</button>
    </div>
    <div class="scroll" id="list"></div>
  </section>
  <div class="status" id="status" aria-live="polite"></div>
</div>

<div class="modal" id="exModal" hidden>
  <form class="sheet" id="exForm" role="dialog" aria-modal="true" aria-labelledby="exTitle" autocomplete="off">
    <h3 id="exTitle">Neue Übung</h3>
    <div class="field"><span class="flabel">Muskelgruppe</span><div class="chips" id="exGroups"></div></div>
    <div class="field"><label class="flabel" for="exName">Übung</label><input type="text" id="exName" maxlength="60" placeholder="z.B. Bankdrücken"><div class="chips" id="exSug"></div></div>
    <div class="nums">
      <label>Sätze<input inputmode="numeric" id="exSets" maxlength="2" placeholder="3"></label>
      <label>Wdh.<input inputmode="text" id="exReps" maxlength="7" placeholder="10"></label>
      <label>Gewicht kg<input inputmode="decimal" id="exKg" maxlength="6" placeholder="–"></label>
    </div>
    <p class="err" id="exErr" hidden></p>
    <div class="sheet-actions"><button class="del" type="button" id="exDel" hidden>Löschen</button>
      <div class="right"><button class="ghost" type="button" id="exCancel">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></div>
  </form>
</div>

<div class="modal" id="dayModal" hidden>
  <form class="sheet" id="dayForm" role="dialog" aria-modal="true" aria-labelledby="dayTitle" autocomplete="off">
    <h3 id="dayTitle">Montag</h3>
    <div class="field"><label class="flabel" for="dayName">Name des Trainings</label><input type="text" id="dayName" maxlength="30" placeholder="z.B. Push, Beine, Oberkörper">
      <div class="chips" id="daySug"></div></div>
    <div class="field"><span class="flabel">Übungen an diesem Tag</span><div class="picks" id="dayPicks"></div></div>
    <div class="sheet-actions"><button class="del" type="button" id="dayRest">Ruhetag</button>
      <div class="right"><button class="ghost" type="button" id="dayCancel">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></div>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* Anmeldung, Profil und Bereiche für alle Seiten
   - E-Mail und Passwort über Firebase Authentication
   - Jede Seite hat ihren eigenen Bereich unter spaces/<id> mit eigenen Personen (access/<uid>)
   - users/<uid>/spaces/<typ> merkt sich, welcher Bereich zu welcher Seite gehört
   Seiten rufen Auth.start(firebaseConfig, "dates" | "recipes" | "chores" | "budget" | "gym", (ref, info) => { ... }) auf. */
(function(){
  const PAGES = [
    {type:"dates",   file:"index.html",    label:"Dateideen", color:"#8c7559", noun:"Dateideen-Liste",
     empty:"Noch keine Dateideen-Liste", hint:"Leg eine Liste an und lad danach deine Freundin oder deinen Freund ein. Nur eingeladene Personen sehen sie.",
     keys:["ideas"]},
    {type:"recipes", file:"rezepte.html",  label:"Rezepte",   color:"#7a2434", noun:"Rezeptsammlung",
     empty:"Noch keine Rezeptsammlung", hint:"Leg eine Sammlung an und lad Freunde oder Familie ein. Nur eingeladene Personen sehen sie.",
     keys:["recipes","people","swipe"]},
    {type:"chores",  file:"haushalt.html", label:"Haushalt",  color:"#3f6f8c", noun:"Haushalt",
     empty:"Noch kein Haushalt", hint:"Leg einen Haushalt an und lad deine Mitbewohner ein.",
     keys:["chores","choreLog","members","rooms","people"]},
    {type:"budget",  file:"budget.html",   label:"Budget",    color:"#1b1b1d", noun:"Budget",
     empty:"Noch kein Budget", hint:"Dein Budget ist privat. Später kannst du jemanden dazuholen, zum Beispiel deine Freundin oder deinen Freund.",
     keys:null},
    {type:"gym",     file:"gym.html",      label:"Gym", color:"#3c4270", noun:"Trainingsplan",
     empty:"Noch kein Trainingsplan", hint:"Leg deinen Plan an: Übungen nach Muskelgruppen und ein Wochenplan. Später kannst du deinen Trainingspartner dazuholen.",
     keys:[]},
    {type:"chat",    file:"chat.html",     label:"Chats", color:"#5f6e54", noSpace:true},
  ];
  const CSS = `
  .auth-screen{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow-y:auto;background:var(--page);
    padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .auth-screen.dim{background:rgba(10,12,14,.55)}
  .auth-card{width:100%;max-width:390px;background:var(--bg);color:var(--ink);border:1px solid var(--frame-line,var(--line));border-radius:24px;overflow:hidden;
    box-shadow:0 18px 40px -18px var(--shadow,rgba(0,0,0,.4))}
  .auth-head{background:var(--band);color:var(--on-band);padding:18px 22px 22px;position:relative}
  .auth-head::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;background:var(--bg);border-radius:14px 14px 0 0}
  .auth-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.8rem;line-height:1.1}
  .auth-head p{margin:4px 0 0;font-size:.88rem;opacity:.8}
  .auth-body{padding:10px 22px 22px;display:flex;flex-direction:column;gap:12px}
  .auth-tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
  .auth-tabs button{flex:1;border:0;background:none;border-radius:8px;padding:7px 10px;font:inherit;font-size:.9rem;font-weight:600;color:var(--muted);cursor:pointer}
  .auth-tabs button[aria-pressed="true"]{background:var(--band);color:var(--on-band)}
  .auth-body label{display:flex;flex-direction:column;gap:5px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .auth-body input[type=email],.auth-body input[type=password],.auth-body input[type=text]{font:inherit;font-size:1rem;text-transform:none;letter-spacing:0;padding:11px 12px;
    border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0}
  .auth-body input:focus{outline:none;border-color:var(--accent)}
  .auth-btn{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--band);color:var(--on-band)}
  .auth-btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .auth-btn:disabled{opacity:.6;cursor:progress}
  .auth-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem;margin:2px 0}
  .auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}
  .auth-google{display:flex;align-items:center;justify-content:center;gap:10px}
  .auth-link{align-self:center;background:none;border:0;padding:4px;font:inherit;font-size:.85rem;color:var(--muted);text-decoration:underline;cursor:pointer}
  .auth-link.danger{color:#c0533f}
  .auth-msg{margin:0;font-size:.88rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .auth-msg.err{border-color:#c0533f;color:#c0533f}
  .auth-note{margin:0;font-size:.88rem;color:var(--muted)}
  .auth-check{flex-direction:row!important;align-items:center;gap:8px!important;text-transform:none!important;letter-spacing:0!important;font-size:.9rem!important;color:var(--ink)!important;font-weight:500!important}
  .auth-check input{accent-color:var(--band);width:18px;height:18px}
  .auth-copy{display:flex;gap:6px}
  .auth-copy input{flex:1;font-size:.82rem!important;padding:9px 10px!important}
  .auth-people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .auth-people li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .auth-people .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--band);color:var(--on-band);flex:none}
  .auth-people .nm{flex:1;min-width:0;display:flex;flex-direction:column}
  .auth-people .nm b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .auth-people .nm small{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .auth-people .rm{border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:3px 10px;font:inherit;font-size:.8rem;cursor:pointer}
  .auth-people .rm.sure{color:#c0533f;border-color:#c0533f;font-weight:600}
  .auth-sec{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 0 -4px}

  /* Profilbilder */
  .ours-av{flex:none;display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;background:var(--band);color:var(--on-band);font-weight:700;line-height:1}
  .ours-av img{width:100%;height:100%;object-fit:cover;display:block}
  .pf-btn{padding:0;overflow:visible}
  #pfInit{position:absolute;inset:0;display:block;border-radius:50%;overflow:hidden}
  .pf-btn .ours-av{width:100%!important;height:100%!important;font-size:1rem!important;background:none;color:inherit;display:grid}
  .pf-photo{display:flex;align-items:center;gap:14px}
  .pf-photo .ours-av{width:72px;height:72px;font-size:1.6rem}
  .pf-photo div{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .auth-card textarea{font:inherit;font-size:1rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface,#fff);color:var(--ink);resize:vertical;min-height:64px;width:100%;box-sizing:border-box}

  /* Profil-Knopf und Menü */
  header{padding-right:64px!important}

    return [...crypto.getRandomValues(new Uint8Array(n))].map(x=>a[x%a.length]).join(""); };
  const esc = t => String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const parseJoin = () => { const m=location.hash.match(/^#join-([A-Za-z0-9]{12,40})-([A-Za-z0-9]{12,40})$/); return m?{sid:m[1],code:m[2]}:null; };

  // Öffentliches Profil (Name, Bild, Über mich) unter pub/<uid>; Bilder werden nachgeladen und überall ausgetauscht

  // Versionsprüfung: Hat der Browser eine alte Seite aus dem Zwischenspeicher geholt, einmal neu laden

        </nav>`);

    /* ---------- Freunde ---------- */
    let friends={}, requestsIn={}, inbox={}, friendCode=null, friendsOpen=false, frConfirm=null;

    let chatUnread=0;
    function updateFriendBadge(){

      if(b){ b.textContent=n; b.hidden=!n; } if(c){ c.textContent=chatUnread; c.hidden=!chatUnread; } if(d) d.hidden=!(n||chatUnread);

    async function ensureFriendCode(){
      friendCode=(await db.ref(`users/${user.uid}/friendCode`).once("value")).val();

        const c=rand(8).toUpperCase().replace(/[^A-Z0-9]/g,"X");

    function watchFriends(){
      db.ref(`friends/${user.uid}`).on("value",s=>{ friends=s.val()||{}; if(friendsOpen) friendsView(); },()=>{});
      db.ref(`requests/${user.uid}`).on("value",s=>{ requestsIn=s.val()||{}; updateFriendBadge(); if(friendsOpen) friendsView(); },()=>{});
      db.ref(`inbox/${user.uid}`).on("value",s=>{ inbox=s.val()||{}; updateFriendBadge(); if(friendsOpen) friendsView(); },()=>{});
    }
    const myName=()=>profile.name||user.email.split("@")[0];
    async function sendRequest(code){
      code=String(code||"").trim().toUpperCase().replace(/^.*#FRIEND-/,"").replace(/[^A-Z0-9]/g,"");
      if(code.length<6) return {err:"Gib einen Freundescode ein. Er hat 8 Zeichen."};
      const uid=(await db.ref(`friendCodes/${code}`).once("value")).val();
      if(!uid) return {err:"Zu diesem Code gibt es niemanden. Prüf die Schreibweise."};
      if(uid===user.uid) return {err:"Das ist dein eigener Code."};
      if(friends[uid]) return {ok:`${friends[uid].name||"Diese Person"} ist schon dein Freund.`};
      if(requestsIn[uid]){ await acceptRequest(uid); return {ok:`Ihr seid jetzt befreundet.`}; }
      await db.ref(`requests/${uid}/${user.uid}`).set({name:myName(),at:Date.now()});
      return {ok:"Freundschaftsanfrage gesendet. Sobald sie angenommen ist, erscheint die Person hier."};
    }
    async function acceptRequest(from){
      const req=requestsIn[from]||{}, now=Date.now();
      await db.ref(`friends/${user.uid}/${from}`).set({name:req.name||"Freund",since:now});
      await db.ref(`friends/${from}/${user.uid}`).set({name:myName(),since:now});
      await db.ref(`requests/${user.uid}/${from}`).remove();
    }

        <p class="auth-sec">Dein Freundescode</p>

        await db.ref(`friends/${user.uid}/${id}`).remove().catch(()=>{});
        await db.ref(`friends/${id}/${user.uid}`).remove().catch(()=>{});
      });

    // Freund direkt zu dieser Liste einladen (landet bei ihm unter "Freunde")
    async function inviteFriend(fid){

    /* ---------- Seite ohne Bereich: neu anlegen ---------- */
    function setupView(problem){

      setupEl.innerHTML=`<div class="box">

        <button class="auth-btn" type="button" id="setNew">${PAGE.type==="chores"?"Neuen Haushalt anlegen":PAGE.type==="budget"?"Budget anlegen":`${esc(PAGE.noun)} anlegen`}</button>

          await db.ref(`spaces/${id}/access/${user.uid}`).set("owner");
          await db.ref(`spaces/${id}/meta`).set({type,owner:user.uid,createdAt:Date.now()});
          const mig=setupEl.querySelector("#setMig");
          if(mig && mig.checked && oldCode){ msg("Bisherige Daten werden übernommen …",false,setupEl); await migrate(oldCode,id); }
          await db.ref(`users/${user.uid}/spaces/${type}`).set(id);
          ready(id);
        }catch(err){ msg("Das Anlegen hat nicht geklappt. Prüf die Internetverbindung und die Regeln in Firebase.",true,setupEl); btn.disabled=false; }

    // alte Daten vom geheimen Link übernehmen, nur was zu dieser Seite gehört
    async function migrate(code,id){
      if(type==="budget"){
        const b=(await db.ref(`lists/${code}/budget`).once("value")).val();
        if(b) await db.ref(`spaces/${id}`).update(b);
        return;
      }
      const out={};
      for(const k of PAGE.keys){ const v=(await db.ref(`lists/${code}/${k}`).once("value")).val(); if(v!=null) out[k]=v; }
      const ids=new Set();
      if(out.ideas) Object.values(out.ideas).forEach(i=>(Array.isArray(i.photos)?i.photos:[]).forEach(p=>ids.add(p)));
      if(out.recipes) Object.values(out.recipes).forEach(r=>{ if(r.cover) ids.add(r.cover); });
      if(ids.size){ out.photos={}; for(const p of ids){ const v=(await db.ref(`lists/${code}/photos/${p}`).once("value")).val(); if(v) out.photos[p]=v; } }
      if(Object.keys(out).length) await db.ref(`spaces/${id}`).update(out);
    }

    /* ---------- Einladung annehmen ---------- */
    async function join(j,current){
      if(current && current!==j.sid && !confirm_ && type==="recipes"){
        let n=0; try{ n=Object.keys((await db.ref(`spaces/${current}/recipes`).once("value")).val()||{}).length; }catch(e){}
        show("Sammlungen zusammenlegen?","",`<p class="auth-note">Du hast schon eine eigene Rezeptsammlung${n?` mit ${n} ${n===1?"Rezept":"Rezepten"}`:""}. Beim Beitreten werden deine Rezepte in die gemeinsame Sammlung übernommen. Die Sammlung gehört dann euch beiden.</p>
          <p class="auth-note">Wenn du später austrittst, behältst du alle Rezepte.</p>
          <button class="auth-btn" type="button" id="jYes">Zusammenlegen</button>
          <button class="auth-btn alt" type="button" id="jNo">Abbrechen</button>`);
        $a("#jYes").onclick=()=>{ confirm_=true; $a("#jYes").disabled=true; $a("#jYes").textContent="Wird zusammengelegt …"; join(j,current); };
        $a("#jNo").onclick=()=>{ clearHash(); hide(); open(current); };
        return;
      }
      if(current && current!==j.sid && !confirm_){
        show(`Einladung zu ${PAGE.label}`,"",`<p class="auth-note">Du bist schon in einer anderen ${esc(PAGE.noun)}. Möchtest du zur neuen wechseln? Die alte bleibt bestehen, du siehst sie dann aber nicht mehr.</p>
          <button class="auth-btn" type="button" id="jYes">Zur neuen wechseln</button>
          <button class="auth-btn alt" type="button" id="jNo">Bei meiner bleiben</button>`);
        $a("#jYes").onclick=()=>{ confirm_=true; join(j,current); };
        $a("#jNo").onclick=()=>{ clearHash(); hide(); open(current); };
        return;
      }
      try{
        await db.ref(`spaces/${j.sid}/access/${user.uid}`).set(j.code);
        if(type==="recipes"){
          await db.ref(`spaces/${j.sid}/meta/owners/${user.uid}`).set(true);   // gehört dann allen gemeinsam
          if(current && current!==j.sid){
            await copyRecipes(current,j.sid);
            // alte Sammlung aufräumen, wenn sonst niemand drin war
            try{ const acc=(await db.ref(`spaces/${current}/access`).once("value")).val()||{};
              if(Object.keys(acc).length<=1) await db.ref(`spaces/${current}`).remove();
              else { await db.ref(`spaces/${current}/profiles/${user.uid}`).remove(); await db.ref(`spaces/${current}/access/${user.uid}`).remove(); } }catch(e){}
          }
        }
        await db.ref(`users/${user.uid}/spaces/${type}`).set(j.sid);
        await db.ref(`spaces/${j.sid}/invites/${j.code}`).remove().catch(()=>{});   // Link gilt nur einmal
        clearHash(); ready(j.sid);
      }catch(err){ clearHash(); if(current) open(current); else setupView("Der Einladungslink ist ungültig oder wurde zurückgezogen."); }
    }
    let confirm_=false;
    // Rezepte samt Titelbildern von einer Sammlung in eine andere kopieren (vorhandene bleiben)
    async function copyRecipes(from,to){
      const rs=(await db.ref(`spaces/${from}/recipes`).once("value")).val()||{};
      const have=(await db.ref(`spaces/${to}/recipes`).once("value")).val()||{};
      const out={};
      for(const [id,r] of Object.entries(rs)){
        if(have[id] || !r) continue;
        if(r.cover && /^[0-9a-f]{32}$/.test(r.cover)){
          const ph=(await db.ref(`spaces/${from}/photos/${r.cover}`).once("value")).val();
          if(ph) await db.ref(`spaces/${to}/photos/${r.cover}`).set(ph);
        }
        out[id]=r;
      }
      if(Object.keys(out).length) await db.ref(`spaces/${to}/recipes`).update(out);
    }

    async function open(id){
      try{ await db.ref(`spaces/${id}/meta`).once("value"); ready(id); }
      catch(err){ await db.ref(`users/${user.uid}/spaces/${type}`).remove().catch(()=>{}); setupView("Du hast keinen Zugriff mehr auf diese Liste. Leg eine neue an oder lass dich wieder einladen."); }
    }
    function ready(id){
      sid=id; hide(); if(setupEl) setupEl.hidden=true; updateMenu();
      db.ref(`spaces/${id}/profiles/${user.uid}`).update({name:profile.name||user.email.split("@")[0],email:user.email}).catch(()=>{});
      if(started) return; started=true;
      cb(db.ref("spaces/"+id),{uid:user.uid,sid:id,email:user.email,name:profile.name});
    }

    auth.onAuthStateChanged(async u=>{
      if(!u){ if(user){ location.reload(); return; } loginView(parseJoin()||/^#friend-/.test(location.hash)?"register":"login"); return; }
      user=u;
      show(PAGE.label,"",`<p class="auth-note">Lädt …</p>`);
      try{
        pubDb=db;
        profile=(await db.ref(`users/${u.uid}/profile`).once("value")).val()||{};
        if(!profile.name){
          let n=""; try{ n=sessionStorage.getItem("auth.newName")||""; sessionStorage.removeItem("auth.newName"); }catch(e){}
          profile.name=n||u.displayName||u.email.split("@")[0];
          await db.ref(`users/${u.uid}/profile/name`).set(profile.name);
        }
        try{ const pb=(await db.ref(`pub/${u.uid}`).once("value")).val()||{}; pubCache.set(u.uid,pb);
          if(pb.name!==profile.name) await db.ref(`pub/${u.uid}/name`).set(profile.name); pubCache.get(u.uid).name=profile.name; }catch(e){}
        window.Auth._profileView=profileView; window.Auth.me=u.uid;
        installMenu();
        try{ await ensureFriendCode(); watchFriends(); watchChats(); }catch(e){}
        const fr=location.hash.match(/^#friend-([A-Za-z0-9]{6,12})$/);
        if(fr){ clearHash(); setTimeout(async()=>{ let r; try{ r=await sendRequest(fr[1]); }catch(e){ r={err:"Die Anfrage hat nicht geklappt."}; } friendsView(r.err||r.ok,!!r.err); },400); }
        if(PAGE.noSpace){ hide(); updateMenu(); if(!started){ started=true; cb(null,{uid:u.uid,email:u.email,name:profile.name,db}); } return; }
        const current=(await db.ref(`users/${u.uid}/spaces/${type}`).once("value")).val();
        const j=parseJoin();
        if(j){ await join(j,current); return; }
        if(current){ await open(current); return; }
        setupView();
      }catch(err){
        show(PAGE.label,"",`<p class="auth-msg err">Die Daten konnten nicht geladen werden. Prüf die Internetverbindung und die Regeln in Firebase.</p>
          <button class="auth-btn" type="button" onclick="location.reload()">Neu laden</button>
          <button class="auth-link" type="button" id="authOut">Abmelden</button>`);
        $a("#authOut").onclick=()=>auth.signOut();
      }
    });
  }};
})();

</script>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const firebaseConfig = {
  apiKey: "AIzaSyD6JNwGczfmHYTqHp9qI5bnutz-JLphgGI",
  authDomain: "oursapp-ff4cf.firebaseapp.com",
  databaseURL: "https://oursapp-ff4cf-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "oursapp-ff4cf",
  storageBucket: "oursapp-ff4cf.firebasestorage.app",
  messagingSenderId: "509984933255",
  appId: "1:509984933255:web:1f2e8b0850c94056f87f22"
};

/* ---------- Muskelgruppen ---------- */
const GROUPS=[
  {id:"brust",     name:"Brust",           emo:"🏋️", col:"#c8574a", sug:["Bankdrücken","Schrägbankdrücken","Kurzhantel-Flys","Butterfly","Dips","Liegestütze"]},
  {id:"ruecken",   name:"Rücken",          emo:"🧗", col:"#3f7a8c", sug:["Klimmzüge","Latziehen","Rudern am Kabel","Langhantelrudern","Kreuzheben","Hyperextensions"]},
  {id:"schulter",  name:"Schultern",       emo:"🙆", col:"#8a6bbf", sug:["Schulterdrücken","Seitheben","Frontheben","Face Pulls","Reverse Flys","Arnold Press"]},
  {id:"bizeps",    name:"Bizeps",          emo:"💪", col:"#d08a2c", sug:["Langhantelcurls","Kurzhantelcurls","Hammercurls","Konzentrationscurls","Kabelcurls"]},
  {id:"trizeps",   name:"Trizeps",         emo:"🦾", col:"#b8642f", sug:["Trizepsdrücken am Kabel","French Press","Dips","Überkopf-Trizeps","Enges Bankdrücken"]},
  {id:"bauch",     name:"Bauch",           emo:"🔥", col:"#5d8f5a", sug:["Crunches","Plank","Beinheben","Russian Twists","Ab-Roller","Kabel-Crunches"]},
  {id:"quads",     name:"Oberschenkel vorne", emo:"🦵", col:"#2f6f9f", sug:["Kniebeugen","Beinpresse","Beinstrecker","Ausfallschritte","Bulgarian Split Squats"]},
  {id:"hams",      name:"Oberschenkel hinten", emo:"🦵", col:"#2e5b7a", sug:["Beinbeuger liegend","Beinbeuger sitzend","Rumänisches Kreuzheben"]},
  {id:"po",        name:"Po",              emo:"🍑", col:"#c0607d", sug:["Hip Thrusts","Abduktoren-Maschine","Glute Kickbacks","Sumo-Kniebeugen"]},
  {id:"waden",     name:"Waden",           emo:"🦶", col:"#6f7d3a", sug:["Wadenheben stehend","Wadenheben sitzend","Wadenheben an der Beinpresse"]},
  {id:"unterarme", name:"Unterarme",       emo:"✊", col:"#8a7350", sug:["Handgelenk-Curls","Farmer's Walk","Reverse Curls"]},
  {id:"cardio",    name:"Cardio",          emo:"🏃", col:"#4a7f7a", sug:["Laufband","Fahrrad","Crosstrainer","Rudergerät","Treppensteiger","Seilspringen"]},
];
const grpOf=id=>GROUPS.find(g=>g.id===id)||GROUPS[0];
const DAYS=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"], DSHORT=["Mo","Di","Mi","Do","Fr","Sa","So"];
const DAY_SUG=["Push","Pull","Beine","Oberkörper","Unterkörper","Ganzkörper","Brust & Trizeps","Rücken & Bizeps","Schultern & Arme","Cardio"];
const CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHEV='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const NEXT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PREV='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- Zustand ---------- */
let root=null, exercises={}, week={}, log={}, view="week", weekOff=0, openDay=null, openGrp=new Set(), exForm=null, delSure=false;
try{ view=localStorage.getItem("gym.view")==="ex"?"ex":"week"; }catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function showErr(e){ $("#status").textContent=/permission/i.test(String(e&&(e.code||e.message)))?"Keine Berechtigung. Prüf die Regeln in Firebase.":"Speichern hat nicht geklappt. Prüf die Internetverbindung."; }
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const monday=off=>{ const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7); return d; };
const exList=()=>Object.entries(exercises).map(([id,x])=>({id,...x})).filter(x=>x&&x.name);
const dayEx=i=>{ const d=week[i]||{}; return (Array.isArray(d.ex)?d.ex:[]).map(id=>exercises[id]?{id,...exercises[id]}:null).filter(Boolean); };
const fmtEx=x=>{ const p=[]; if(x.sets||x.reps) p.push(`${x.sets||"?"} × ${x.reps||"?"}`); if(x.kg) p.push(`${String(x.kg).replace(".",",")} kg`); return p.join(" · ")||grpOf(x.group).name; };

/* ---------- Anzeige ---------- */
function render(){
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===view));
  if(view==="week") renderWeek(); else renderEx();
}
function renderWeek(){
  const mon=monday(weekOff), todayIso=iso(new Date()), dates=DAYS.map((_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
  const sun=dates[6], label=weekOff===0?"Diese Woche":weekOff===1?"Nächste Woche":weekOff===-1?"Letzte Woche":`KW ${kw(mon)}`;
  if(openDay==null){ const ti=dates.findIndex(d=>iso(d)===todayIso); openDay=ti>=0?ti:0; }
  if(!exList().length && !Object.keys(week).length){
    $("#list").innerHTML=`<div class="empty"><strong>Dein Gymplan</strong><span>So fängst du an:</span>
      <span>1. Tipp auf <b>„+ Übung“</b> und leg deine Übungen an, sortiert nach Muskelgruppen.</span>
      <span>2. Tipp hier im <b>Wochenplan</b> auf einen Tag und wähl aus, was du an dem Tag trainierst.</span>
      <span>3. Im Gym hakst du die Übungen ab.</span></div>`+daysHtml(dates,todayIso);
    return;
  }
  $("#list").innerHTML=`<div class="weeknav"><button class="arr" type="button" data-wk="-1" aria-label="Woche zurück">${PREV}</button>
      <span style="text-align:center"><b>${label}</b><small>${dates[0].toLocaleDateString("de-DE",{day:"numeric",month:"short"})} – ${sun.toLocaleDateString("de-DE",{day:"numeric",month:"short"})}${weekOff?` · <button class="linkish" type="button" data-wk="0">heute</button>`:""}</small></span>
      <button class="arr" type="button" data-wk="1" aria-label="Woche vor">${NEXT}</button></div>
    <div class="wstrip">${dates.map((d,i)=>{ const ex=dayEx(i), done=ex.length&&ex.every(x=>(log[iso(d)]||{})[x.id]);
      return `<button type="button" class="wd${ex.length?" train":""}${done?" done":""}${iso(d)===todayIso?" today":""}" data-day="${i}" aria-pressed="${openDay===i}">${DSHORT[i]}<b>${d.getDate()}</b><i></i></button>`; }).join("")}</div>`
    +daysHtml(dates,todayIso);
}
function daysHtml(dates,todayIso){
  return dates.map((d,i)=>{ const w=week[i]||{}, ex=dayEx(i), di=iso(d), lg=log[di]||{}, n=ex.filter(x=>lg[x.id]).length, open=openDay===i;
    const groups=[...new Set(ex.map(x=>x.group))].map(g=>grpOf(g).name);
    return `<section class="day${di===todayIso?" today":""}${ex.length?"":" rest"}" id="day-${i}">
      <button type="button" class="day-head" data-open-day="${i}" aria-expanded="${open}">
        <span class="dn"><small>${DSHORT[i]}</small><b>${d.getDate()}</b></span>
        <span class="dt"><b>${esc(w.title||(ex.length?"Training":"Ruhetag"))}</b><small>${ex.length?esc(groups.join(" · ")):"Tippen, um Übungen auszuwählen"}</small></span>
        ${ex.length?`<span class="prog${n===ex.length?" ok":""}">${n}/${ex.length}</span>`:""}</button>
      ${open?`<div class="day-body">
        ${ex.length?`<ul class="exl">${ex.map(x=>`<li${lg[x.id]?' class="done"':""}><button type="button" class="ck${lg[x.id]?" on":""}" data-ck="${di}|${esc(x.id)}" aria-pressed="${!!lg[x.id]}" aria-label="${esc(x.name)} erledigt">${CHECK}</button>
            <span class="gdot" style="background:${grpOf(x.group).col}"></span><span class="exn"><b>${esc(x.name)}</b><small>${esc(fmtEx(x))}</small></span></li>`).join("")}</ul>`
          :`<p class="note" style="margin:0;color:var(--muted);font-size:.88rem">Kein Training geplant.</p>`}
        <div class="day-actions"><button class="btn" type="button" data-edit-day="${i}">${ex.length?"Tag bearbeiten":"Übungen auswählen"}</button>
          ${ex.length&&n?`<button class="linkish" type="button" data-reset-day="${di}">Haken zurücksetzen</button>`:""}</div>
      </div>`:""}
    </section>`; }).join("");
}
function kw(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
function renderEx(){
  const list=exList();
  if(!list.length){ $("#list").innerHTML=`<div class="empty"><strong>Noch keine Übungen</strong><span>Tipp auf „+ Übung“. Du wählst eine Muskelgruppe und bekommst passende Vorschläge.</span></div>`+GROUPS.map(g=>grpHtml(g,[])).join(""); return; }
  $("#list").innerHTML=GROUPS.map(g=>grpHtml(g,list.filter(x=>x.group===g.id).sort((a,b)=>a.name.localeCompare(b.name,"de")))).join("");
}
function grpHtml(g,items){
  const open=openGrp.has(g.id);
  return `<section class="grp${open?" open":""}"><button type="button" class="grp-head" data-grp="${g.id}" aria-expanded="${open}">
      <span class="gi" style="background:${g.col}22">${g.emo}</span><b>${esc(g.name)}</b><span class="n">${items.length||""}</span>${CHEV}</button>
    ${open?`<div class="grp-body">${items.length?`<div class="exl">${items.map(x=>`<button type="button" class="exrow" data-ex="${esc(x.id)}"><span class="exn"><b>${esc(x.name)}</b><small>${esc(fmtEx(x))}</small></span>${NEXT}</button>`).join("")}</div>`:""}
      <button type="button" class="add-in" data-add-in="${g.id}">+ Übung für ${esc(g.name)}</button></div>`:""}
  </section>`;
}

/* ---------- Übung anlegen/ändern ---------- */
function openEx(id,group){
  const x=id?exercises[id]:null; delSure=false;
  exForm={id:id||null,group:(x&&x.group)||group||GROUPS[0].id};
  $("#exTitle").textContent=x?"Übung ändern":"Neue Übung";
  $("#exName").value=x?x.name:""; $("#exSets").value=x&&x.sets||""; $("#exReps").value=x&&x.reps||""; $("#exKg").value=x&&x.kg?String(x.kg).replace(".",","):"";
  $("#exDel").hidden=!x; $("#exDel").textContent="Löschen"; $("#exDel").classList.remove("sure"); $("#exErr").hidden=true;
  renderExChips(); $("#exModal").hidden=false; if(!x) setTimeout(()=>$("#exName").focus(),30);
}
function renderExChips(){
  $("#exGroups").innerHTML=GROUPS.map(g=>`<button type="button" class="chip" data-eg="${g.id}" aria-pressed="${exForm.group===g.id}">${g.emo} ${esc(g.name)}</button>`).join("");
  const have=new Set(exList().map(x=>x.name.toLowerCase()));
  $("#exSug").innerHTML=exForm.id?"":grpOf(exForm.group).sug.filter(s=>!have.has(s.toLowerCase())).map(s=>`<button type="button" class="chip sug" data-sug="${esc(s)}">${esc(s)}</button>`).join("");
}
const closeEx=()=>{ $("#exModal").hidden=true; exForm=null; };
$("#addEx").addEventListener("click",()=>openEx(null,openGrp.size===1?[...openGrp][0]:null));
$("#exCancel").addEventListener("click",closeEx);
$("#exModal").addEventListener("click",e=>{
  if(e.target.id==="exModal") return closeEx();
  const g=e.target.closest("[data-eg]"); if(g){ exForm.group=g.dataset.eg; renderExChips(); return; }
  const s=e.target.closest("[data-sug]"); if(s){ $("#exName").value=s.dataset.sug; if(!$("#exSets").value) $("#exSets").value=exForm.group==="cardio"?"":"3"; if(!$("#exReps").value) $("#exReps").value=exForm.group==="cardio"?"20 min":"10"; }
});
$("#exForm").addEventListener("submit",e=>{
  e.preventDefault(); if(!root||!exForm) return;
  const name=$("#exName").value.trim().slice(0,60); if(!name){ $("#exErr").textContent="Gib der Übung einen Namen."; $("#exErr").hidden=false; return; }
  const sets=parseInt($("#exSets").value,10), kg=parseFloat(String($("#exKg").value).replace(",","."));
  const data={name,group:exForm.group,sets:sets>0&&sets<100?sets:null,reps:$("#exReps").value.trim().slice(0,7)||null,kg:kg>0&&kg<1000?Math.round(kg*10)/10:null,at:(exForm.id&&exercises[exForm.id].at)||Date.now()};
  const id=exForm.id||uid(); exercises[id]=data; root.child("exercises/"+id).set(data).catch(showErr);
  openGrp.add(data.group); closeEx(); render();
});
$("#exDel").addEventListener("click",()=>{
  if(!delSure){ delSure=true; $("#exDel").textContent="Wirklich löschen?"; $("#exDel").classList.add("sure"); return; }
  const id=exForm.id; delete exercises[id]; root.child("exercises/"+id).remove().catch(showErr);
  // aus dem Wochenplan nehmen
  Object.entries(week).forEach(([i,d])=>{ if(d&&Array.isArray(d.ex)&&d.ex.includes(id)) root.child(`week/${i}/ex`).set(d.ex.filter(x=>x!==id)).catch(()=>{}); });
  closeEx(); render();
});

/* ---------- Tag bearbeiten ---------- */
let dayEdit=null;
function openDayEdit(i){
  dayEdit={i,sel:new Set((week[i]&&Array.isArray(week[i].ex))?week[i].ex:[])};
  $("#dayTitle").textContent=DAYS[i]; $("#dayName").value=(week[i]&&week[i].title)||"";
  $("#daySug").innerHTML=DAY_SUG.map(s=>`<button type="button" class="chip sug" data-ds="${esc(s)}">${esc(s)}</button>`).join("");
  const list=exList();
  $("#dayPicks").innerHTML=list.length?GROUPS.map(g=>{ const it=list.filter(x=>x.group===g.id).sort((a,b)=>a.name.localeCompare(b.name,"de")); if(!it.length) return "";
      return `<div class="pg"><b><span class="gdot" style="background:${g.col}"></span>${esc(g.name)}</b>${it.map(x=>`<label class="pick"><input type="checkbox" data-pick="${esc(x.id)}"${dayEdit.sel.has(x.id)?" checked":""}><span class="exn"><b>${esc(x.name)}</b><small>${esc(fmtEx(x))}</small></span></label>`).join("")}</div>`; }).join("")
    :`<p class="err" style="color:var(--muted)">Du hast noch keine Übungen. Leg sie zuerst unter „Übungen“ an.</p>`;
  $("#dayModal").hidden=false;
}
const closeDay=()=>{ $("#dayModal").hidden=true; dayEdit=null; };
$("#dayCancel").addEventListener("click",closeDay);
$("#dayModal").addEventListener("click",e=>{ if(e.target.id==="dayModal") return closeDay(); const s=e.target.closest("[data-ds]"); if(s) $("#dayName").value=s.dataset.ds; });
$("#dayModal").addEventListener("change",e=>{ const c=e.target.closest("[data-pick]"); if(!c||!dayEdit) return; if(c.checked) dayEdit.sel.add(c.dataset.pick); else dayEdit.sel.delete(c.dataset.pick); });
$("#dayForm").addEventListener("submit",e=>{
  e.preventDefault(); if(!dayEdit||!root) return;
  const order=exList().filter(x=>dayEdit.sel.has(x.id)).sort((a,b)=>GROUPS.findIndex(g=>g.id===a.group)-GROUPS.findIndex(g=>g.id===b.group)||a.name.localeCompare(b.name,"de")).map(x=>x.id);
  const data=order.length?{title:$("#dayName").value.trim().slice(0,30)||null,ex:order}:null;
  week[dayEdit.i]=data; root.child("week/"+dayEdit.i).set(data).catch(showErr); openDay=dayEdit.i; closeDay(); render();
});
$("#dayRest").addEventListener("click",()=>{ if(!dayEdit||!root) return; week[dayEdit.i]=null; root.child("week/"+dayEdit.i).remove().catch(showErr); closeDay(); render(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(!$("#exModal").hidden) closeEx(); if(!$("#dayModal").hidden) closeDay(); } });

/* ---------- Klicks ---------- */
document.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]"); if(v){ view=v.dataset.view; try{ localStorage.setItem("gym.view",view); }catch(err){} render(); return; }
  const wk=e.target.closest("[data-wk]"); if(wk){ weekOff=wk.dataset.wk==="0"?0:weekOff+(+wk.dataset.wk); openDay=null; render(); return; }
  const d=e.target.closest("[data-day]"); if(d){ openDay=+d.dataset.day; render(); const el=$("#day-"+openDay); if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"}); return; }
  const od=e.target.closest("[data-open-day]"); if(od){ const i=+od.dataset.openDay; openDay=openDay===i?-1:i; render(); return; }
  const ed=e.target.closest("[data-edit-day]"); if(ed) return openDayEdit(+ed.dataset.editDay);
  const ck=e.target.closest("[data-ck]"); if(ck){ const [di,id]=ck.dataset.ck.split("|"); log[di]=log[di]||{}; const on=!log[di][id];
    if(on) log[di][id]=true; else delete log[di][id]; root.child(`log/${di}/${id}`).set(on||null).catch(showErr); render(); return; }
  const rd=e.target.closest("[data-reset-day]"); if(rd){ const di=rd.dataset.resetDay; log[di]={}; root.child("log/"+di).remove().catch(showErr); render(); return; }
  const g=e.target.closest("[data-grp]"); if(g){ const id=g.dataset.grp; if(openGrp.has(id)) openGrp.delete(id); else openGrp.add(id); render(); return; }
  const ai=e.target.closest("[data-add-in]"); if(ai) return openEx(null,ai.dataset.addIn);
  const x=e.target.closest("[data-ex]"); if(x) return openEx(x.dataset.ex);
});
// Beim Runterscrollen schiebt sich der helle Bereich über den Kopf
(()=>{ const wrap=$(".wrap"), head=$("#head"), sc=$("#list");
  const measure=()=>{ if(!wrap.classList.contains("compact")) wrap.style.setProperty("--headH",head.offsetHeight+"px"); };
  sc.addEventListener("scroll",()=>{ measure(); if(sc.scrollTop>24) wrap.classList.add("compact"); else if(sc.scrollTop<=2) wrap.classList.remove("compact"); },{passive:true});
  addEventListener("resize",measure); measure(); })();

/* ---------- Start ---------- */
Auth.start(firebaseConfig,"gym",r=>{
  root=r; history.replaceState(null,"",location.pathname); render();
  if(!root){ $("#status").textContent="Die Datenbank konnte nicht geladen werden. Prüf die Internetverbindung und lade die Seite neu."; return; }
  root.child("exercises").on("value",s=>{ exercises=s.val()||{}; render(); },showErr);
  root.child("week").on("value",s=>{ const v=s.val()||{}; week=Array.isArray(v)?Object.fromEntries(v.map((x,i)=>[i,x]).filter(([,x])=>x)):v; render(); });
  root.child("log").on("value",s=>{ log=s.val()||{}; render(); });
});
</script>
