<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ours · Gym</title>
<link rel="icon" href="ours-logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ours">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=Playfair+Display:wght@800;900&display=swap">
<style>
/* Gym: eigene Übungen nach Muskelgruppen und ein Wochenplan */
:root{
  --page:#191b2b; --dots:rgba(255,255,255,.035); --frame-line:#12131f; --shadow:rgba(10,11,22,.45);
  --band:#3c4270; --on-band:#eef0fa; --on-band-muted:#b8bcdc;
  --bg:#f2f2f6; --surface:#fcfcfe; --ink:#1e2030; --muted:#6c6f82; --line:#e1e2ea;
  --accent:#3c4270; --accent-soft:#e6e8f3; --btn:#e7e8f0; --ok:#4f8a5b;
  --display:"Gloock", Georgia, serif; --body:"Figtree", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;background-color:var(--page);
  background-image:radial-gradient(var(--dots) 1.2px,transparent 1.2px);background-size:18px 18px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:620px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;gap:12px;background:var(--bg);overflow:hidden;position:relative;
  padding:0 22px max(12px,env(safe-area-inset-bottom,0px))}
@media (max-width:660px){.wrap{padding-left:16px;padding-right:16px}}
@media (min-width:661px){.wrap{border-left:1px solid var(--frame-line);border-right:1px solid var(--frame-line)}}
header{flex:none;margin:0 -22px;background:var(--band);color:var(--on-band);position:relative;transition:margin-top .3s ease}
@media (max-width:660px){header{margin:0 -16px}}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;background:var(--bg);border-radius:14px 14px 0 0}
header.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(12px + env(safe-area-inset-top,0px)) 64px 25px!important}
header.brand .wordmark{font-family:"Playfair Display",var(--display);font-weight:900;font-size:clamp(2.1rem,9.5vw,2.7rem);line-height:1;color:var(--on-band);white-space:nowrap}
header.brand .pf-btn{top:calc(50% - 27px + env(safe-area-inset-top,0px) / 2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap.compact header{margin-top:calc(24px - var(--headH,110px))}
.count{display:none}
.status{flex:none;font-size:.82rem;color:var(--muted)}
.status:empty{display:none}

.panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.topbar{flex:none;display:flex;align-items:center;gap:8px}
.seg{flex:1;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;font-size:.88rem;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--band);color:var(--on-band)}
.btn{background:var(--btn);color:var(--ink);border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--band);color:var(--on-band)}
#addEx{white-space:nowrap;flex:none}
@media (max-width:430px){.wide{display:none} #addEx{width:42px;padding:9px 0;font-size:1.2rem}}
.ghost{background:none;border:0;color:var(--muted);padding:8px 4px}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;font-size:.88rem}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 2px 90px;margin:0 -2px;display:flex;flex-direction:column;gap:10px}
.scroll>*{flex:none}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:18px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.empty strong{color:var(--ink);font-family:var(--display);font-weight:400;font-size:1.3rem}

/* Woche */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav b{font-weight:600}
.weeknav small{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.weeknav .arr{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.weeknav .arr svg{width:16px;height:16px}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0 7px;font-size:.72rem;color:var(--muted)}
.wd b{font-size:1rem;color:var(--ink);font-weight:600}
.wd i{width:7px;height:7px;border-radius:50%;background:transparent}
.wd.train i{background:var(--accent)}
.wd.done i{background:var(--ok)}
.wd.today{border-color:var(--band);box-shadow:0 0 0 1px var(--band) inset}
.wd[aria-pressed="true"]{background:var(--band);border-color:var(--band);color:var(--on-band-muted)}
.wd[aria-pressed="true"] b{color:var(--on-band)}
.wd[aria-pressed="true"].train i{background:var(--on-band)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;color:var(--ink)}
.day-head .dn{flex:none;width:42px;text-align:center;line-height:1.1}
.day-head .dn b{display:block;font-size:1.15rem;font-weight:700}
.day-head .dn small{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day-head .dt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.day-head .dt b{font-weight:600}
.day-head .dt small{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-head .prog{flex:none;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--accent-soft);color:var(--accent)}
.day-head .prog.ok{background:#e1efe3;color:var(--ok)}
.day.today{border-color:var(--band)}
.day.rest .dt b{color:var(--muted);font-weight:500}
.day-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.exl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.exl li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-top:1px solid var(--line)}
.exl li:first-child{border-top:0}
.ck{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:transparent;display:grid;place-items:center;padding:0}
.ck svg{width:16px;height:16px}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.exn{flex:1;min-width:0;display:flex;flex-direction:column}
.exn b{font-weight:600;font-size:.95rem}
.exn small{font-size:.78rem;color:var(--muted)}
li.done .exn b{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.gdot{flex:none;width:9px;height:9px;border-radius:50%}
.day-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* Wochenplan als Kalender */
.wsum{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--muted)}
.wsum b{color:var(--ink)}
.cal-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:.86rem;white-space:nowrap}
.wsum{flex-wrap:wrap}
.cal-btn svg{width:17px;height:17px}
.plan{display:flex;flex-direction:column;gap:8px}
/* Muskel-Ansicht */
.mus-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.mus-figs{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:380px;margin:0 auto;width:100%}
.mus-figs figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.mus-figs figcaption{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mus-figs svg{width:100%;max-width:170px;height:auto;display:block}
.mus-figs .base{fill:color-mix(in srgb,var(--ink) 9%,var(--surface))}
.mus-figs .m{stroke:var(--surface);stroke-width:1.2}
.mus-figs .m.l0{fill:color-mix(in srgb,var(--ink) 16%,var(--surface))}
.mus-figs .m.l1{fill:rgba(214,69,65,.38)}
.mus-figs .m.l2{fill:#d64541}
.mus-figs .m.l3{fill:#7a1212}
.mus-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:.76rem;color:var(--muted)}
.mus-leg span{display:inline-flex;align-items:center;gap:5px}
.mus-leg i{width:12px;height:12px;border-radius:4px;display:inline-block}
.mus-list{display:flex;flex-wrap:wrap;gap:6px}
.mus-list span{font-size:.78rem;border-radius:999px;padding:4px 10px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.mus-list span.l1{background:rgba(214,69,65,.14);border-color:rgba(214,69,65,.35)}
.mus-list span.l2{background:#d64541;border-color:#d64541;color:#fff}
.mus-list span.l3{background:#7a1212;border-color:#7a1212;color:#fff}
.mus-list b{font-weight:700}
.mus-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;color:var(--ink);text-align:left;font:inherit}
.mus-h b{font-family:var(--display);font-weight:400;font-size:1.3rem}
.mus-h small{flex:1;font-size:.8rem;color:var(--muted);text-align:right}
.mus-h svg{flex:none;width:20px;height:20px;color:var(--muted);transition:transform .2s}
.mus-h[aria-expanded="true"] svg{transform:rotate(180deg)}
/* Pausen-Timer, Vorschlag, Tauschen */
.rest-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 92px);z-index:9;display:flex;align-items:center;gap:8px;
  background:var(--ink);color:var(--surface);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);white-space:nowrap}
.rest-bar[hidden]{display:none}
.rest-bar b{font-size:1.15rem;font-variant-numeric:tabular-nums;min-width:3.2em}
.rest-bar small{font-size:.75rem;opacity:.75}
.rest-bar button{border:0;border-radius:999px;background:rgba(255,255,255,.14);color:inherit;font:inherit;font-size:.8rem;font-weight:700;padding:7px 10px}
.rest-bar.done{background:#3f8a4f}
.rest-set{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.rest-set button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px;font:inherit;font-size:.8rem}
.rest-set button[aria-pressed="true"]{background:var(--band);color:var(--on-band);border-color:var(--band)}
.sug-set{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:color-mix(in srgb,var(--band) 8%,var(--surface));border:1px dashed color-mix(in srgb,var(--band) 40%,var(--line));border-radius:10px;padding:6px 10px;font-size:.82rem}
.sug-set b{font-weight:700}
.sug-set button{margin-left:auto;border:0;background:var(--band);color:var(--on-band);border-radius:999px;padding:5px 10px;font:inherit;font-size:.78rem;font-weight:700}
.swap-btn{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 9px;font:inherit;font-size:.75rem;font-weight:600}
.swap-list{display:flex;flex-direction:column;max-height:50vh;overflow-y:auto}
/* Fortschritt */
.pg-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pg-card h4{margin:0;font-family:var(--display);font-weight:400;font-size:1.25rem;display:flex;align-items:center;gap:8px}
.pg-card h4 small{margin-left:auto;font-family:inherit;font-size:.8rem;color:var(--muted)}
.mon-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mon-nav b{font-weight:700}
.mon-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mon-grid div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.mon-grid b{font-size:1.2rem;font-variant-numeric:tabular-nums}
.mon-grid small{font-size:.76rem;color:var(--muted)}
.mon-hi{margin:0;padding-left:18px;font-size:.88rem;display:flex;flex-direction:column;gap:3px}
.pr-list,.pe-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pr-list li,.pe-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pr-list li:first-child,.pe-list li:first-child{border-top:0}
.pr-list .exn small,.pe-list .exn small{font-size:.76rem}
.pr-kg{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;font-size:.95rem}
.pr-kg small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.pe-list button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left;color:var(--ink);font:inherit}
.pe-list svg{flex:none;width:70px;height:28px}
.bl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bl-grid label{display:flex;flex-direction:column;gap:4px;font-size:.74rem;color:var(--muted)}
.bl-grid input{font:inherit;font-size:1rem;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;min-width:0;width:100%}
.bl-tab{width:100%;border-collapse:collapse;font-size:.84rem}
.bl-tab td{padding:5px 0;border-top:1px solid var(--line)}
.bl-tab td:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}
.chart{width:100%;height:110px;display:block}
.pr-badge{display:inline-block;background:#f6e3a8;color:#6b4e00;border-radius:999px;padding:1px 8px;font-size:.72rem;font-weight:700;margin-left:6px}
/* Planung: Deload, fertige Pläne, Muskel-Auswahl */
.deload{background:#fbefe0;border:1px solid #ecc99a;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.deload b{font-size:.98rem}
.deload .row{display:flex;gap:8px;flex-wrap:wrap}
.presets{display:flex;flex-direction:column;gap:8px}
.preset{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.preset-h{display:flex;align-items:center;gap:10px}
.preset-h b{flex:1;font-weight:700}
.preset-h small{color:var(--muted);font-size:.78rem}
.preset p{margin:0;font-size:.84rem;color:var(--muted)}
.preset ul{margin:0;padding-left:18px;font-size:.82rem;display:flex;flex-direction:column;gap:2px}
.mus-figs .m{cursor:pointer}
.mus-figs .m.sel{stroke:var(--ink);stroke-width:2}
.mus-pick{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.mus-pick b{font-weight:700}
/* Freunde: gemeinsam trainieren, Challenge, Reaktionen */
.inv-card{background:color-mix(in srgb,var(--band) 9%,var(--surface));border:1.5px solid var(--band);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.inv-card .row{display:flex;gap:8px;flex-wrap:wrap}
.inv-card b{font-weight:700}
.chal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.chal h4{margin:0;font-family:var(--display);font-weight:400;font-size:1.2rem}
.chal ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.chal li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px}
.chal li.me{background:var(--accent-soft)}
.chal li .pl{width:24px;text-align:center;font-weight:700}
.chal li .nm{flex:1;font-weight:600}
.chal li .sc{font-variant-numeric:tabular-nums;font-weight:700}
.chal li .sc small{font-weight:400;color:var(--muted);font-size:.74rem;margin-left:4px}
.reacts{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 0 52px}
.reacts span{font-size:.76rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.rx-btns{display:flex;gap:4px;margin-left:auto}
.hlist .rx-btns button,.rx-btns button{flex:none;width:auto;border:1px solid var(--line)!important;background:var(--surface);border-radius:999px;padding:3px 7px;font-size:.9rem;box-shadow:none;min-height:0}
.rx-btns button[aria-pressed="true"]{background:var(--band);border-color:var(--band)}
.with-l{font-size:.76rem;color:var(--muted)}
.cmp{list-style:none;margin:0;padding:0;font-size:.84rem;display:flex;flex-direction:column;gap:3px}
.cmp li{display:grid;grid-template-columns:1fr auto auto;gap:10px}
.cmp li b{font-weight:600}
.cmp .h{color:var(--muted);font-size:.74rem}
.prot-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.prot-card .nbar{font-size:.84rem}
.prot-card .pickrow{padding:8px 2px}
/* Feedback nach dem Training */
.fb-card{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1px solid var(--line)}
.fb-card.great{background:#e2f2e4;border-color:#9fd0a8}
.fb-card.ok{background:var(--accent-soft);border-color:var(--line)}
.fb-card.low{background:#fbefe0;border-color:#ecc99a}
.fb-card b.fb-t{font-size:1rem}
.fb-card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:.86rem}
.fb-card .fb-tip{margin:0;font-size:.84rem;color:var(--muted)}
.feel{display:flex;gap:6px}
.feel button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 4px;font:inherit;font-size:.82rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.feel button span{font-size:1.25rem}
.feel button[aria-pressed="true"]{border-color:var(--band);box-shadow:0 0 0 1.5px var(--band) inset;font-weight:700}
/* Farbe eines Workouts */
.cols{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.csw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--c);padding:0}
.csw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.csw.auto{background:conic-gradient(#c8574a,#d08a2c,#4f8a5b,#2f6f9f,#8a6bbf,#c8574a);position:relative}
.csw.auto::after{content:"A";position:absolute;inset:0;display:grid;place-items:center;font-size:.7rem;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pb-cols{display:flex;flex-direction:column;gap:6px}
.pb-cols small{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pb-cols .csw{width:26px;height:26px}
/* Wochenplan waagerecht: 7 Tage nebeneinander */
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wcol{display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 3px 5px;min-height:150px}
.wcol.today{border-color:var(--band);box-shadow:0 0 0 1.5px var(--band) inset}
.wcol.past .wch{opacity:.55}
.wch{display:flex;flex-direction:column;align-items:center;line-height:1.1;padding:2px 0 3px}
.wch small{font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.wch b{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.wcol.today .wch small,.wcol.today .wch b{color:var(--band)}
.wcb{flex:1;display:flex;flex-direction:column;gap:4px}
.wb{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;min-width:0;border:0;border-top:3px solid var(--tc);border-radius:8px;padding:5px 2px 4px;
  background:color-mix(in srgb,var(--tc) 14%,var(--surface));color:var(--ink);text-align:center;font:inherit}

.wb small{font-size:.6rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wb.open{box-shadow:0 0 0 2px var(--tc)}
.wb.is-done{--tc:#3f8a4f;background:#3f8a4f;color:#fff}
.wb.is-miss{--tc:#c0453a;background:#c0453a;color:#fff}
.wb.is-done small,.wb.is-miss small{color:rgba(255,255,255,.85)}
.wb .wmk{position:absolute;top:1px;right:3px;font-size:.62rem;font-weight:800}
.wadd{margin-top:auto;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:8px;min-height:30px;font-size:1rem;font-weight:600}
.wcb .wadd:only-child{flex:1;font-size:.62rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.wdet-h{margin:2px 0 -4px;font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
@media (min-width:700px){.wb b{font-size:.74rem}.wb small{font-size:.66rem}.wcol{min-height:190px;padding:6px 5px}}
.prow{display:flex;gap:10px;align-items:stretch}
.pdate{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;line-height:1.1}
.pdate small{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pdate b{font-size:1.25rem;font-weight:700}
.tdy{margin-top:3px;font-size:.62rem;font-weight:700;color:#fff;background:var(--band);border-radius:999px;padding:1px 6px}
.prow.past .pdate{opacity:.55}
.pblock{flex:1;min-width:0;background:color-mix(in srgb,var(--tc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--tc) 28%,var(--line));border-left:5px solid var(--tc);border-radius:14px;overflow:hidden}
.prow.today .pblock{box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 35%,transparent)}
.pblock.is-done .pb-groups span,.pblock.is-miss .pb-groups span{--gc:var(--tc)}
.pb-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px 4px;text-align:left;color:var(--ink)}
.pb-emo{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 18%,#fff);font-size:1.1rem}
.pb-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.pb-txt b{font-weight:700;font-size:1.02rem}
.pb-txt small{font-size:.8rem;color:var(--muted)}
.pb-prog{flex:none;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 9px;background:#fff;color:var(--tc)}
.pb-prog.ok{background:var(--ok);color:#fff}
.pb-groups{display:flex;flex-wrap:wrap;gap:4px;padding:2px 12px 10px 56px}
.pb-groups span{font-size:.7rem;font-weight:600;color:color-mix(in srgb,var(--gc) 80%,#000);background:color-mix(in srgb,var(--gc) 14%,#fff);border-radius:999px;padding:2px 8px}
.pb-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;border-top:1px dashed color-mix(in srgb,var(--tc) 30%,var(--line));padding-top:10px}
.pb-title{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:1px solid color-mix(in srgb,var(--tc) 30%,var(--line));background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:600;color:var(--ink);text-align:left}
.pb-title svg{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.pb-title[aria-expanded="true"] svg{transform:rotate(180deg)}
.prest{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1.5px dashed var(--line);background:none;border-radius:14px;padding:12px 14px;color:var(--muted);text-align:left}
.prest span{font-weight:500}
.prest small{color:var(--accent);font-weight:600;font-size:.82rem}
.prow.today .prest{border-color:var(--band)}
.timerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.92rem}
.timerow input[type=date]{font:inherit;padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.rep-seg{flex:none}
.rep-seg button{font-size:.84rem;padding:7px 6px}
.wdays .chip{min-width:42px;text-align:center}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0;line-height:1}
.stepper b{min-width:1.6em;text-align:center;font-size:1.05rem}
.rep-hint{margin:0;font-size:.8rem;color:var(--muted)}
.pcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.wsum-btns{display:flex;gap:6px}
.timerow input[type=time]{font:inherit;font-size:1.05rem;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
/* Workouts & Training */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.sec-h b{font-family:var(--display);font-weight:400;font-size:1.3rem}
.tpls{display:flex;flex-direction:column;gap:8px}
.tpl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:color-mix(in srgb,var(--tc) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--tc) 25%,var(--line));border-left:5px solid var(--tc);border-radius:14px;padding:10px 12px;color:var(--ink)}
.tpl>svg{flex:none;width:18px;height:18px;color:var(--muted)}
.tpl .pb-emo{background:color-mix(in srgb,var(--tc) 18%,#fff)}
.train{background:var(--surface);border:1.5px solid var(--band);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.train-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-2px;z-index:3;background:var(--surface);margin:-14px -14px 0;padding:12px 14px;border-radius:18px 18px 0 0}
.train-head small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.train-head b{font-family:var(--display);font-weight:400;font-size:1.35rem}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.5rem;color:var(--band);background:var(--accent-soft);border-radius:12px;padding:4px 12px}
.btn.big{padding:13px 16px;font-size:1rem;border-radius:12px}
.done-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:#e1efe3;color:var(--ok);border-radius:10px;padding:9px 12px;font-weight:600;font-size:.88rem;text-align:left}
.done-row span{text-decoration:underline;font-weight:500}
.exset{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.exset-h{display:flex;align-items:center;gap:10px}
.sets{display:flex;flex-direction:column;gap:6px}
.set-h,.set{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:center}
.set.cardio,.set-h:has(+.set.cardio){grid-template-columns:34px 1fr}
.stp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.stp input{border:0!important;border-radius:0!important;padding:8px 2px!important;flex:1;min-width:0}
.stp input.up-in{color:var(--ok);font-weight:700}
.sb{flex:none;width:32px;height:38px;border:0;background:var(--accent-soft);color:var(--accent);font-size:1.15rem;font-weight:700;padding:0;line-height:1}
.sb:active{background:var(--band);color:var(--on-band)}
.set button.sn{cursor:pointer;padding:0}
.set button.sn svg{width:16px;height:16px}
.set-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.set-foot small{font-size:.74rem;color:var(--muted)}
.sdone{flex:none;font-size:.78rem;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.exset.all{border-color:var(--ok)}
.exset.all .sdone{background:var(--ok);border-color:var(--ok);color:#fff}
.mark{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.95rem;color:#fff}
.mark.ok{background:var(--ok)}
.mark.miss{background:#c0453a}
.pblock.is-done{--tc:#3f8a4f;background:#e2f2e4;border-color:#9fd0a8;border-left-color:#3f8a4f}
.pblock.is-done .pb-emo{background:#c8e8cd}
.pblock.is-done .pb-txt b{color:#1f5a2c}
.pblock.is-done .pb-groups span{background:#cfeAd3;color:#2c6a39}
.pblock.is-miss{--tc:#c0453a;background:#f9e0dd;border-color:#eba59d;border-left-color:#c0453a}
.pblock.is-miss .pb-emo{background:#f2c4be}
.pblock.is-miss .pb-txt b{color:#8a2318}
.pblock.is-miss .pb-txt small{color:#9a4a42}
.pblock.is-miss .pb-groups span{background:#f3cdc8;color:#8a2318}
.train.edit{border-color:#d0a03c}
.edit-dur label{display:flex;align-items:center;gap:8px;font-size:.9rem}
.edit-dur input{width:80px;font:inherit;text-align:center;padding:7px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.danger-l{color:#b0412e;align-self:center}
.hist-sec{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hlist button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:12px;padding:8px 12px;color:var(--ink)}
.hd{flex:none;width:38px;text-align:center;line-height:1.05}
.hd b{display:block;font-size:1.15rem}
.hd small{font-size:.7rem;color:var(--muted);text-transform:uppercase}
.set-h{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.set-h span:first-child{text-align:center}
.set .sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:.82rem;font-weight:700;justify-self:center}
.set.on .sn{background:var(--ok);border-color:var(--ok);color:#fff}
.set input{font:inherit;font-size:1rem;text-align:center;padding:8px 6px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.set input:focus{outline:none;border-color:var(--accent)}
.set input::placeholder{color:#a3a6b8}

.add-set{align-self:flex-start;border:1px dashed var(--line);background:none;color:var(--accent);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.85rem}
.sum-sheet{gap:14px}
.sum-top{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.sum-emo{font-size:2.4rem;line-height:1}
.sum-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum-stats div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.sum-stats b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.sum-stats small{font-size:.72rem;color:var(--muted)}
.up{color:var(--ok)} .down{color:#b0412e}
.sec-l{margin:0;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sum-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum-list li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.sum-list li:first-child{border-top:0}
.dif{flex:none;font-weight:700;font-size:.86rem;border-radius:999px;padding:3px 9px;background:var(--bg)}
.dif.up{background:#e1efe3;color:var(--ok)} .dif.down{background:#f6e3df;color:#b0412e} .dif.new{background:var(--accent-soft);color:var(--accent)} .dif.same{color:var(--muted)}
.kcal-row{display:flex;flex-direction:column;gap:2px;font-size:.88rem}
.kcal-row label{display:flex;align-items:center;gap:8px}
.kcal-row input{width:80px!important;font:inherit;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;text-align:center;background:var(--bg)}
.kcal-row small{color:var(--muted);font-size:.76rem}
.hist{display:flex;flex-direction:column;gap:6px}
.spark{width:100%;height:70px}
.hist ul{list-style:none;margin:0;padding:0;font-size:.86rem;display:flex;flex-direction:column;gap:3px}
.hist li{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.hist li b{color:var(--ink);font-weight:600}
/* Essen */
.kcal-card{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative}
.ring{width:110px;height:110px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.rbg{stroke:var(--accent-soft)}
.rfg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .4s}
.rfg.over{stroke:#c0453a}
.kc-mid{position:absolute;left:14px;top:14px;width:110px;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.kc-mid b{font-size:1.3rem;font-variant-numeric:tabular-nums}
.kc-mid small{font-size:.7rem;color:var(--muted)}
.kc-side{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.kc-side li{display:flex;justify-content:space-between;gap:8px}
.kc-side span{color:var(--muted)}
.nut-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.nbar{display:grid;grid-template-columns:1fr auto;gap:3px 6px;font-size:.78rem}
.nbar span:first-child{color:var(--muted)}
.nbar .nv{font-weight:600;font-variant-numeric:tabular-nums}
.nbar i{grid-column:1/-1;height:6px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.nbar i b{display:block;height:100%;background:var(--band);border-radius:999px}
.nbar.over i b{background:#c0453a}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.meal-h{display:flex;align-items:center;gap:8px}
.meal-h b{font-weight:600;flex:1}
.me-emo{font-size:1.2rem}
.mk{font-size:.82rem;color:var(--muted);font-weight:600}
.mrow2{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.stp.sm{flex:none;width:96px}
.stp.sm .sb{width:28px;height:30px;font-size:1rem}
.stp.sm input{font-size:.9rem;padding:4px 0!important;text-align:center;background:none}
.th.food{display:grid;place-items:center;font-size:1.3rem;width:40px;height:40px;border-radius:10px}
.x-del{flex:none;border:0;background:none;color:var(--muted);font-size:1.2rem;padding:2px 4px}
.mfb{margin:0;font-size:.8rem;border-radius:10px;padding:6px 10px}
.mfb.good{background:#e1efe3;color:#2c6a39} .mfb.ok{background:var(--accent-soft);color:var(--ink)} .mfb.bad{background:#f8e1de;color:#8a2318}
.review{background:var(--surface);border:1.5px solid var(--band);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.review p{margin:0}
.review .good{color:var(--ok);font-weight:600}
.review .warn{color:#8a2318}
.tips{margin:0;padding-left:18px;color:var(--muted);font-size:.84rem}
#mealQ{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.pickrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;color:var(--ink)}
.pickrow .plus{pointer-events:none}
.pk-emo{flex:none;font-size:1.2rem;width:28px;text-align:center}
.fr-tpl-t{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.fr-tpl-t>svg{flex:none;width:18px;height:18px;color:var(--muted);transition:transform .2s}
.fr-tpl.open .fr-tpl-t>svg{transform:rotate(180deg)}
.seg button{padding:7px 4px;font-size:.84rem}
.seg button[hidden]{display:none}
/* Einzelne Lebensmittel im Essen-Tagebuch */
.pick-seg{margin:0}
.fd-row{display:flex;gap:8px}
.fd-row input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.fd-row input:focus,#mealQ:focus{outline:none;border-color:var(--accent)}
.fd-acts{display:flex;flex-wrap:wrap;gap:8px}
.fd-acts .btn{display:inline-flex;align-items:center;gap:6px}
.fd-acts svg{width:18px;height:18px}
.fd-msg{margin:0;font-size:.84rem;color:var(--muted)}
.fd-msg.err{color:#8a2318}
.fd-form{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface)}
.fd-form .me-grid.four{grid-template-columns:repeat(4,1fr)}
.fd-form .me-grid label{font-size:.72rem}
.fd-form .nm{text-align:left}
.fd-sum{margin:0;font-weight:600;font-size:.92rem}
.fd-sum small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.fd-sug{display:flex;flex-direction:column;gap:0;max-height:40vh;overflow-y:auto}
.fd-sug:empty{display:none}
.fd-sug .pickrow{padding:9px 2px}
.fd-sug mark{background:none;color:inherit;font-weight:800;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:2px}
.sug-x{flex:none;border:0;background:none;color:var(--muted);font-size:1.1rem;padding:6px 8px}
.sug-row{display:flex;align-items:center}
.sug-row .pickrow{flex:1;min-width:0;border-bottom:0}
.sug-row{border-bottom:1px solid var(--line)}
.mrow2 .exn.tap{border:0;background:none;padding:0;text-align:left;color:var(--ink);cursor:pointer}
/* Spotify: Knopf unten in der Mitte und kleiner Player */
.fab.sp-fab{left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 22px);background:#1db954;color:#fff}
.fab.sp-fab:active{transform:translateX(-50%) scale(.94)}
.fab.sp-fab svg{width:30px;height:30px}
.fab.sp-fab.playing::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #1db954;opacity:.5;animation:spPulse 1.6s ease-out infinite}
@keyframes spPulse{from{transform:scale(1);opacity:.55}to{transform:scale(1.25);opacity:0}}
.sp-card{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 90px);z-index:8;width:min(360px,calc(100% - 32px));
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 18px 40px -16px var(--shadow);display:flex;flex-direction:column;gap:12px}
.sp-card[hidden]{display:none}
.sp-top{display:flex;align-items:center;gap:12px}
.sp-top img,.sp-top .sp-ph{flex:none;width:58px;height:58px;border-radius:10px;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;color:var(--muted)}
.sp-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sp-t b{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-t small{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-x{flex:none;align-self:flex-start;border:0;background:none;color:var(--muted);font-size:1.3rem;padding:0 4px;line-height:1}
.sp-bar{position:relative;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.sp-bar i{position:absolute;left:0;right:0;height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.sp-bar i b{display:block;height:100%;width:0;background:#1db954;border-radius:999px}
.sp-time{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-6px}
.sp-ctl{display:flex;justify-content:center;align-items:center;gap:22px}
.sp-ctl button{border:0;background:none;color:var(--ink);display:grid;place-items:center;width:44px;height:44px;border-radius:50%}
.sp-ctl button svg{width:26px;height:26px}
.sp-ctl .sp-pp{width:56px;height:56px;background:var(--ink);color:var(--surface)}
.sp-ctl button:disabled{opacity:.4}
.sp-msg{margin:0;font-size:.82rem;color:var(--muted);text-align:center}
.sp-msg.err{color:#8a2318}
/* Knopf unten rechts mit zwei Optionen (wie bei Rezepte) */
.fab{position:absolute;z-index:6;width:56px;height:56px;border-radius:50%;border:0;background:var(--band);color:var(--on-band);display:grid;place-items:center;
  box-shadow:0 6px 16px -8px var(--shadow),0 0 0 1px color-mix(in srgb,var(--on-band) 14%,transparent)}
.g-fab{right:var(--chat-x,16px);bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 22px)}
.fab svg{width:26px;height:26px;transition:transform .25s ease}
.fab:active{transform:scale(.94)}
.fab[aria-expanded="true"] svg{transform:rotate(45deg)}
.fab.on{box-shadow:0 0 0 3px var(--accent-soft),0 6px 16px -8px var(--shadow)}
.fab-menu{position:absolute;right:calc(var(--chat-x,16px) + 4px);bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 88px);z-index:7;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
.fab-opt{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;color:var(--ink);font-weight:600;font-size:.92rem;
  opacity:0;transform:translateY(46px) scale(.6);transition:opacity .18s ease,transform .25s cubic-bezier(.3,1.4,.5,1)}
.fab-opt span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;box-shadow:0 6px 16px -8px var(--shadow)}
.fab-opt i{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--band);color:var(--on-band);box-shadow:0 8px 18px -8px var(--shadow)}
.fab-opt i svg{width:22px;height:22px}
.fab-opt[aria-current="true"] span{background:var(--band);color:var(--on-band);border-color:var(--band)}
.fab-menu.open{pointer-events:auto}
.fab-menu.open .fab-opt{opacity:1;transform:none}
.fab-menu.open .fab-opt:nth-child(1){transition-delay:.05s}
@media (prefers-reduced-motion:reduce){.fab-opt,.fab svg{transition:none}}
.view-head{display:flex;align-items:center;gap:8px}
.view-head b{font-family:var(--display);font-weight:400;font-size:1.4rem;flex:1}
/* Ich */
.me-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.me-t{font-family:var(--display);font-weight:400;font-size:1.25rem}
.me-t small{font-family:var(--body);font-size:.78rem;color:var(--muted)}
.me-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.me-grid.two{grid-template-columns:repeat(2,1fr)}
.me-grid label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted)}
.me-grid input{font:inherit;font-size:1rem;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0;width:100%;text-align:center}
.me-grid input:focus{outline:none;border-color:var(--accent)}
.me-card.res{border-color:var(--band)}
.chips.col{flex-direction:column;align-items:stretch}
.chip.big{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-align:left;padding:9px 14px;border-radius:12px;font-weight:600}
.chip.big small{font-weight:400;font-size:.76rem;color:var(--muted);text-align:right}
.chip.big[aria-pressed="true"] small{color:var(--on-band-muted)}
.opt-in{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--ink)}
.opt-in small{font-size:.74rem;color:var(--muted)}
.opt-in input{width:110px;font:inherit;font-size:1rem;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);text-align:center}
.save-bar{display:flex;flex-direction:column;gap:6px}
.save-bar .btn:disabled{opacity:.55;cursor:default}
.save-msg{color:var(--ok);font-weight:600}
.me-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.me-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.me-list li span{color:var(--muted)}
.hr-row{display:flex;flex-direction:column;gap:6px}
.hr-row small{font-size:.76rem;color:var(--muted)}
.hr-row .flabel small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted)}
/* Streak */
.streak-card{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--accent-soft);border:1px solid var(--line)}
.streak-card .sc-emo{font-size:1.4rem;letter-spacing:-4px}
.streak-card.t1{background:#fff3e0;border-color:#f3c98b}
.streak-card.t2{background:linear-gradient(100deg,#ffe3c2,#fff3e0);border-color:#f0a95a}
.streak-card.t3{background:linear-gradient(100deg,#ffcf9e,#ffe9cf);border-color:#e9822d}
.streak-card.t4{background:linear-gradient(100deg,#ffd36b,#ffb067,#ff8a5b);border-color:#d9661f}
.streak-card.t3 b,.streak-card.t4 b{color:#7a2e05}
.streak-head{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;position:relative;z-index:1}
.sb-pill{font-size:.72rem;font-weight:700;letter-spacing:.04em;color:#3a1600;background:linear-gradient(90deg,#ffd36b,#ff9a4d);border-radius:999px;padding:2px 10px;box-shadow:0 0 12px rgba(255,140,40,.55)}
.fl{display:inline-flex;gap:0}
.fl i{font-style:normal;font-size:1rem;display:inline-block;animation:flick 1.2s ease-in-out infinite;animation-delay:var(--d);transform-origin:50% 90%}
header.fire.t2 .fl i{font-size:1.15rem}
header.fire.t3 .fl i,header.fire.t4 .fl i{font-size:1.3rem}
header.fire{box-shadow:inset 0 -26px 40px -24px rgba(255,120,30,.55)}
header.fire.t3,header.fire.t4{box-shadow:inset 0 -34px 50px -24px rgba(255,120,30,.75)}
header.fire .wordmark{text-shadow:0 0 18px rgba(255,150,60,.55)}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg);filter:brightness(1)}50%{transform:scale(1.18) rotate(3deg) translateY(-2px);filter:brightness(1.25)}}
@media (prefers-reduced-motion:reduce){.fl i{animation:none}}
.fr-streak{flex:none;font-size:.8rem;font-weight:700;color:#7a2e05;background:#ffe3c2;border-radius:999px;padding:2px 8px}
.pb-head.ro{cursor:default}
.prest.ro{cursor:default}
.hrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:12px;padding:8px 12px}
/* Freunde */
.share-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.share-row span:first-child{flex:1;display:flex;flex-direction:column;gap:2px}
.share-row b{font-weight:600;font-size:.94rem}
.share-row small{font-size:.8rem;color:var(--muted)}
.sw{position:relative;flex:none;width:46px;height:28px}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;pointer-events:none}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.fr-row-g{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink)}
.fr-row-g:disabled{opacity:.6;cursor:default}
.fr-row-g>svg{flex:none;width:18px;height:18px;color:var(--muted)}
.back-l{align-self:flex-start;text-decoration:none}
.fr-head{display:flex;align-items:center;gap:12px}
.fr-head b{display:block;font-family:var(--display);font-weight:400;font-size:1.4rem}
.fr-head small{color:var(--muted);font-size:.84rem}
.tpl.ro{cursor:default}
.fr-tpl{background:color-mix(in srgb,var(--tc) 6%,var(--surface));border:1px solid color-mix(in srgb,var(--tc) 25%,var(--line));border-left:5px solid var(--tc);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.fr-tpl-h{display:flex;align-items:center;gap:10px}
.fr-tpl .pb-emo{background:color-mix(in srgb,var(--tc) 18%,#fff)}
/* Übungen */
.grp{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.grp-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;color:var(--ink)}
.grp-head .gi{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem}
.grp-head b{flex:1;font-weight:600}
.grp-head .n{font-size:.8rem;color:var(--muted);font-weight:600}
.grp-head svg{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.grp.open .grp-head svg{transform:rotate(180deg)}
.grp-body{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.exrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;color:var(--ink);border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exrow svg{flex:none;width:16px;height:16px;color:var(--muted)}
.add-in{border:1px dashed var(--line);background:none;color:var(--accent);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem;text-align:left}

.th{flex:none;width:52px;height:40px;border-radius:8px;overflow:hidden;background:var(--accent-soft);display:block}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.none{background:repeating-linear-gradient(45deg,var(--accent-soft),var(--accent-soft) 6px,var(--surface) 6px,var(--surface) 12px)}
.th-btn{border:0;background:none;padding:0;flex:none;line-height:0;border-radius:8px}
.sub-l{margin:4px 0 -2px;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sub-l small{text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400}
.sugrow{padding:0 6px 0 0;gap:4px}
.sug-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;text-align:left;color:var(--ink)}
.plus{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:1.2rem;font-weight:700;line-height:1;padding:0}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pics figure{margin:0;display:flex;flex-direction:column;gap:4px}
.pics img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;background:var(--accent-soft)}
.pics figcaption{font-size:.76rem;color:var(--muted);text-align:center;font-weight:600}
@media (max-width:420px){.pics{grid-template-columns:1fr}}
.info-g{margin:-6px 0 0;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.88rem}
.card-note{color:var(--muted);font-size:.88rem;margin:0}
/* Bögen */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(15,16,32,.5);padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:420px;max-height:100%;overflow-y:auto;background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px -20px rgba(15,16,32,.6)}
.sheet h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.5rem}
.sheet>*{flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px}
.flabel{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sheet input[type=text],.sheet input[inputmode]{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.sheet input:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:.85rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--band);border-color:var(--band);color:var(--on-band)}
.chip.sug{border-style:dashed}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted)}
.picks{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow-y:auto}
.picks .pg>b{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.pick{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:.95rem}
.pick input{width:20px;height:20px;accent-color:var(--band)}
.sheet-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-actions .right{display:flex;gap:8px;margin-left:auto}
.del{background:none;border:0;color:var(--muted);font-size:.85rem;text-decoration:underline;padding:4px 0}
.del.sure{color:#b0412e;font-weight:600}
.err{color:#b0412e;font-size:.85rem;margin:0}

/* Kopf wie auf den anderen Seiten */
.foot-count{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand" id="head">
    <div class="wordmark" aria-hidden="true">Gym</div>
    <h1 class="sr-only">Gym</h1>
  </header>
  <div class="count" id="count"></div>

  <section class="panel">
    <div class="topbar">
      <div class="seg" role="group" aria-label="Ansicht"><button type="button" data-view="week" aria-pressed="true">Plan</button><button type="button" data-view="ex" aria-pressed="false">Übungen</button><button type="button" data-view="food" aria-pressed="false" hidden>Essen</button></div>
    </div>
    <div class="scroll" id="list"></div>
  </section>
  <div class="status" id="status" aria-live="polite"></div>
  <button class="fab sp-fab" id="spFab" type="button" hidden aria-expanded="false" aria-controls="spCard" aria-label="Spotify-Player"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.3c3.8-1.1 8-.8 11.2 1M7.2 12.6c3.1-.9 6.4-.6 9 .9M7.9 15.7c2.4-.6 4.8-.4 6.8.7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>
  <div class="sp-card" id="spCard" hidden role="dialog" aria-label="Spotify"></div>
  <div class="rest-bar" id="restBar" hidden role="timer" aria-live="polite"></div>
  <div class="fab-menu" id="gFabMenu" aria-hidden="true">
    <button class="fab-opt" type="button" data-fabview="me" tabindex="-1"><span>Meine Angaben</span><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c.8-3.8 3.6-6 7-6s6.2 2.2 7 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></i></button>
    <button class="fab-opt" type="button" data-fabview="prog" tabindex="-1"><span>Fortschritt & Rekorde</span><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-4 3 3 5-6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 8h3v3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></i></button>
    <button class="fab-opt" type="button" data-fabview="fr" tabindex="-1"><span>Freunde & ihre Pläne</span><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M16.5 6.2a2.8 2.8 0 0 1 0 5.4M17 14.3c2 .5 3.2 2.1 3.6 4.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></i></button>
  </div>
  <button class="fab g-fab" id="gFab" type="button" aria-expanded="false" aria-controls="gFabMenu" aria-label="Meine Angaben und Freunde"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
</div>

<div class="modal" id="exModal" hidden>
  <form class="sheet" id="exForm" role="dialog" aria-modal="true" aria-labelledby="exTitle" autocomplete="off">
    <h3 id="exTitle">Neue Übung</h3>
    <div class="field"><span class="flabel">Muskelgruppe</span><div class="chips" id="exGroups"></div></div>
    <div class="field"><label class="flabel" for="exName">Übung</label><input type="text" id="exName" maxlength="60" placeholder="z.B. Bankdrücken"><div class="chips" id="exSug"></div></div>
    <div class="nums">
      <label>Sätze<input inputmode="numeric" id="exSets" maxlength="2" placeholder="3"></label>
      <label>Wdh.<input inputmode="text" id="exReps" maxlength="7" placeholder="10"></label>
      <label>Gewicht kg<input inputmode="decimal" id="exKg" maxlength="6" placeholder="–"></label>
    </div>
    <p class="err" id="exErr" hidden></p>
    <div class="sheet-actions"><button class="del" type="button" id="exDel" hidden>Löschen</button>
      <div class="right"><button class="ghost" type="button" id="exCancel">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></div>
  </form>
</div>

<div class="modal" id="infoModal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="Übung" id="infoBody"></div></div>

<div class="modal" id="tplModal" hidden>
  <form class="sheet" id="tplForm" role="dialog" aria-modal="true" aria-labelledby="tplTitle" autocomplete="off">
    <h3 id="tplTitle">Neues Workout</h3>
    <div class="field"><label class="flabel" for="tplName">Name</label><input type="text" id="tplName" maxlength="30" placeholder="z.B. Push, Pull, Beine">
      <div class="chips" id="tplSug"></div></div>
    <div class="field"><span class="flabel">Farbe im Plan</span><div id="tplCols"></div></div>
    <div class="field"><span class="flabel">Übungen im Workout</span><div class="picks" id="tplPicks"></div></div>
    <p class="err" id="tplErr" hidden></p>
    <div class="sheet-actions"><button class="del" type="button" id="tplDel" hidden>Workout löschen</button>
      <div class="right"><button class="ghost" type="button" id="tplCancel">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></div>
  </form>
</div>

<div class="modal" id="mealModal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="Essen eintragen" id="mealBody"></div></div>

<div class="modal" id="invModal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="Freund einladen" id="invBody"></div></div>
<div class="modal" id="swapModal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="Übung tauschen" id="swapBody"></div></div>
<div class="modal" id="sumModal" hidden><div class="sheet sum-sheet" role="dialog" aria-modal="true" aria-label="Zusammenfassung" id="sumBody"></div></div>

<div class="modal" id="dayModal" hidden>
  <form class="sheet" id="dayForm" role="dialog" aria-modal="true" aria-labelledby="dayTitle" autocomplete="off">
    <h3 id="dayTitle">In den Plan</h3>
    <div class="field"><span class="flabel">Welches Workout?</span><div class="tplpick" id="tplPick"></div></div>
    <div class="field"><span class="flabel">Wann gehst du ins Gym?</span>
      <div class="timerow"><input type="time" id="dayTime" value="18:00" aria-label="Uhrzeit"><div class="chips" id="dayDur"></div></div></div>
    <div class="field"><span class="flabel">Wiederholen</span>
      <div class="seg rep-seg" role="group" aria-label="Wiederholung"><button type="button" data-rep="once">Einmalig</button><button type="button" data-rep="weekly">Wöchentlich</button><button type="button" data-rep="every">Alle … Tage</button></div>
      <div id="repWeekly" class="chips wdays"></div>
      <div id="repEvery" class="timerow"><span>Alle</span><span class="stepper"><button type="button" data-repn="-1" aria-label="Weniger">−</button><b id="repN">2</b><button type="button" data-repn="1" aria-label="Mehr">+</button></span><span>Tage, ab</span><input type="date" id="repStart" aria-label="Startdatum"></div>
      <div id="repOnce" class="timerow"><span>Am</span><input type="date" id="repDate" aria-label="Datum"></div>
      <p class="rep-hint" id="repHint"></p></div>
    <div class="sheet-actions"><button class="del" type="button" id="dayRest" hidden>Aus dem Plan nehmen</button>
      <div class="right"><button class="ghost" type="button" id="dayCancel">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></div>
  </form>
</div>

/* Anmeldung, Profil und Bereiche für alle Seiten
   - E-Mail und Passwort über Firebase Authentication
   - Jede Seite hat ihren eigenen Bereich unter spaces/<id> mit eigenen Personen (access/<uid>)
   - users/<uid>/spaces/<typ> merkt sich, welcher Bereich zu welcher Seite gehört
   Seiten rufen Auth.start(firebaseConfig, "dates" | "recipes" | "chores" | "budget" | "gym", (ref, info) => { ... }) auf. */
/* ---------- Offline: Seiten über den Service Worker, Daten über einen Zwischenspeicher ----------
   Gelesene Daten (on/once "value") werden im localStorage gemerkt und ohne Netz von dort geliefert.
   Schreibvorgänge kommen in eine Warteschlange und werden nachgereicht, sobald wieder Netz da ist. */
(function(){

  const oOn=Q.on, oOff=Q.off, oOnce=Q.once, oSet=R.set, oUpdate=R.update, oRemove=R.remove;
  const PRE="ofl:c:", OUT="ofl:outbox", t0=Date.now(), PAGE=t0.toString(36)+Math.random().toString(36).slice(2,6);
  let conn=null, watching=false;
  const pathOf=ref=>{ try{ return decodeURIComponent(String(ref.toString()).replace(/^[a-z]+:\/\/[^/]+\/?/i,"")).replace(/\/+$/,""); }catch(e){ return null; } };
  const plain=q=>{ try{ return !q.ref||q.isEqual(q.ref); }catch(e){ return false; } };   // keine sortierten/gefilterten Abfragen
  const okPath=p=>p!=null&&p!==""&&!p.startsWith(".info");
  const lsGet=k=>{ try{ const v=localStorage.getItem(k); return v==null?undefined:JSON.parse(v); }catch(e){ return undefined; } };
  const lsSet=(k,v)=>{ try{ const s=JSON.stringify(v===undefined?null:v); if(s.length>1500000) return; localStorage.setItem(k,s); }catch(e){} };
  const watch=()=>{ if(watching) return; try{ if(!F.apps||!F.apps.length) return; watching=true;
    oOn.call(F.database().ref(".info/connected"),"value",s=>{ conn=s.val()===true; if(conn) setTimeout(replay,500); }); }catch(e){ watching=false; } };
  const offline=()=>conn!==true&&(navigator.onLine===false||Date.now()-t0>3500);

      forEach(fn){ if(!val||typeof val!=="object") return false; for(const k of Object.keys(val)) if(fn(snap(val[k],ref&&ref.child(k)))===true) return true; return false; }};

    const pr=oOnce.call(this,ev,...rest).then(s=>{ if(conn===true) lsSet(PRE+p,s.val()); return s; }), ref=this.ref||this;
    const c=lsGet(PRE+p), ms=wait();

    return Promise.race([pr,new Promise(res=>setTimeout(()=>res(snap(c,ref)),ms))]);
  };

  const getIn=(o,ks)=>{ for(const k of ks){ if(o==null||typeof o!=="object") return undefined; o=o[k]; } return o; };
  function setIn(o,ks,v){ if(!ks.length) return v; o=o&&typeof o==="object"?o:{}; const k=ks[0], r=setIn(o[k],ks.slice(1),v); if(r==null) delete o[k]; else o[k]=r; return o; }

      lsSet(OUT,outbox().filter(x=>x.id!==o.id)); } replaying=false; })();
  }
  addEventListener("online",()=>setTimeout(replay,1500));
  window.OursOffline={get connected(){ return conn; },pending:()=>outbox().length,replay};
})();

  const initial = n => (String(n||"?").trim()[0]||"?").toUpperCase();
  // Öffentliches Profil (Name, Bild, Über mich) unter pub/<uid>; Bilder werden nachgeladen und überall ausgetauscht
  const pubCache = new Map(), pubWait = new Set();

  function loadPub(uid){
    if(!uid || !pubDb || pubCache.has(uid) || pubWait.has(uid)) return;
    pubWait.add(uid);

  function paintAv(uid){ document.querySelectorAll(`[data-av="${uid}"]`).forEach(el=>{ el.innerHTML=avInner(uid,el.dataset.avname); }); }
  const GOOGLE = '<svg viewBox="0 0 48 48" aria-hidden="true" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>';

  // Versionsprüfung: Hat der Browser eine alte Seite aus dem Zwischenspeicher geholt, einmal neu laden
  const APP_VERSION="2026-11-06-230930";
  function checkVersion(){
    try{ fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(v=>{
      if(!v || !v.v || v.v===APP_VERSION) return;
      const k="ours.reload."+v.v; try{ if(sessionStorage.getItem(k)) return; sessionStorage.setItem(k,"1"); }catch(e){}

  }

  // Was beim Zusammenlegen und Austreten mitgenommen wird

  function pgToggle(open){ const m=document.getElementById("pgMenu"), b=document.querySelector("header .wordmark.pg-title")||document.getElementById("pgBtn"); if(!m||!b) return; m.hidden=!open; b.setAttribute("aria-expanded",open); }
  // Schalter in den Einstellungen, getrennt pro Seite (standardmäßig aus):

  try{ Object.keys(KC_KEY).forEach(t=>kcalOn[t]=localStorage.getItem("ours.kcal."+t)==="1"); }catch(e){}
  function applyKcal(t,on){ on=!!on; if(on===kcalOn[t]) return; kcalOn[t]=on; try{ localStorage.setItem("ours.kcal."+t,on?"1":"0"); }catch(e){}
    document.dispatchEvent(new CustomEvent("ours-kcal",{detail:{type:t,on}})); }
  window.Auth = {

    start(config, type, cb){
    const PAGE = PAGES.find(p=>p.type===type);

    // Name der App oben in jeder Seite

          <div class="pf-who"><img class="pf-logo" src="ours-mark.png" alt=""><span class="pf-brand">Ours</span></div>
          <div class="pf-sep"></div>
          ${PAGES.filter(p=>!p.noSpace||p.menu).map(p=>`<a href="${p.file}" data-page="${p.type}"${p.type===type?' aria-current="page"':""}><span class="dot" style="background:${p.color}"></span>${p.label}</a>`).join("")}
          ${SOON.map(p=>`<span class="pg-soon" aria-disabled="true" title="Kommt bald"><span class="dot" style="background:${p.color}"></span>${p.label}<small>bald</small></span>`).join("")}
        </nav>`);
      const pgBtn=document.getElementById("pgBtn"), pgMenu=document.getElementById("pgMenu");
      // Logo → Startseite (auf der Startseite selbst: Seitenliste); Überschrift → Seitenliste
      pgBtn.addEventListener("click",e=>{ e.stopPropagation(); if(window.Auth._closePf) window.Auth._closePf(); if(type==="home") pgToggle(pgMenu.hidden); else location.href="home.html"; });
      const wm=hd.querySelector(".wordmark");
      if(wm){ wm.classList.add("pg-title"); wm.setAttribute("role","button"); wm.setAttribute("tabindex","0"); wm.removeAttribute("aria-hidden"); wm.setAttribute("aria-haspopup","true"); wm.setAttribute("aria-expanded","false"); wm.setAttribute("aria-controls","pgMenu"); wm.setAttribute("aria-label",(PAGE?PAGE.label:"Seite")+" – Seiten anzeigen");
        const tgl=e=>{ e.preventDefault(); e.stopPropagation(); if(window.Auth._closePf) window.Auth._closePf(); pgToggle(pgMenu.hidden); };
        wm.addEventListener("click",tgl); wm.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" ") tgl(e); }); }

    let user=null, profile={}, sid=null, started=false, setupEl=null;

    /* ---------- Fenster (Anmelden und Pop-ups) ---------- */
    let screen=null;
    function show(title,sub,html,dim){

    /* ---------- Anmelden / Konto erstellen ---------- */
    function loginView(mode){
      const reg=mode==="register", join=parseJoin();
      show("Ours",
        join?`Du wurdest zu ${PAGE.label} eingeladen. Melde dich an oder erstell ein Konto.`:/^#friend-/.test(location.hash)?"Du wurdest als Freund eingeladen. Melde dich an oder erstell ein Konto.":reg?"Neues Konto erstellen.":"Bitte melde dich an.",
        `<div class="auth-tabs" role="group"><button type="button" data-mode="login" aria-pressed="${!reg}">Anmelden</button><button type="button" data-mode="register" aria-pressed="${reg}">Konto erstellen</button></div>
        <form id="authForm" style="display:flex;flex-direction:column;gap:12px" novalidate>
          ${reg?`<label>Dein Name<input type="text" id="authName" autocomplete="given-name" maxlength="30" placeholder="So sehen dich die anderen"></label>`:""}
          <label>E-Mail<input type="email" id="authMail" autocomplete="email"></label>
          <label>Passwort<input type="password" id="authPw" autocomplete="${reg?"new-password":"current-password"}"></label>
          ${reg?`<label>Passwort wiederholen<input type="password" id="authPw2" autocomplete="new-password"></label>
            <p class="auth-note">Mindestens 10 Zeichen. Am besten ein Passwort, das du nirgends sonst benutzt.</p>`:""}
          <p class="auth-msg" id="authMsg" hidden></p>

      screen.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>loginView(b.dataset.mode));
      (reg?$a("#authName"):$a("#authMail")).focus();
      $a("#authForm").onsubmit=async e=>{
        e.preventDefault();
        const mail=$a("#authMail").value.trim(), pw=$a("#authPw").value;

          if(pw.length<10) return msg("Das Passwort braucht mindestens 10 Zeichen.",true);
          if(pw!==$a("#authPw2").value) return msg("Die beiden Passwörter sind nicht gleich.",true);

    /* ---------- Profil, Einstellungen ---------- */
    function profileView(){
      const pb=pubCache.get(user.uid)||{}; let photo=okPhoto(pb.photo)?pb.photo:null;
      show("Mein Profil","Name, Bild und ein paar Worte über dich sehen deine Freunde.",`
        <div class="pf-photo"><span class="ours-av" id="pfPrev">${photo?`<img src="${photo}" alt="">`:esc(initial(profile.name))}</span>
          <div><button class="auth-btn alt" type="button" id="pfPick">${photo?"Bild ändern":"Profilbild wählen"}</button>

        <input type="file" id="pfFile" accept="image/*" hidden>
        <label>Dein Name<input type="text" id="pfIn" maxlength="30" value="${esc(profile.name||"")}"></label>
        <label>Über mich <small>(optional)</small><textarea id="pfBio" maxlength="140" placeholder="z.B. Koche am liebsten Asiatisch, backe sonntags">${esc(pb.bio||"")}</textarea></label>
        <p class="auth-msg" id="authMsg" hidden></p>

      $a("#pfFile").onchange=async e=>{
        const f=e.target.files[0]; e.target.value=""; if(!f) return;
        try{ // quadratisch zuschneiden, klein halten

      if(!uid) return {err:"Zu diesem Code gibt es niemanden. Prüf die Schreibweise."};

      if(friends[uid]) return {ok:`${friends[uid].name||"Diese Person"} ist schon dein Freund.`};
      if(requestsIn[uid]){ await acceptRequest(uid); return {ok:`Ihr seid jetzt befreundet.`}; }
      await db.ref(`requests/${uid}/${user.uid}`).set({name:myName(),at:Date.now()});

    async function migrate(code,id){
      if(type==="budget"){
        const b=(await db.ref(`lists/${code}/budget`).once("value")).val();
        if(b) await db.ref(`spaces/${id}`).update(b);
        return;
      }
      const out={};
      for(const k of PAGE.keys){ const v=(await db.ref(`lists/${code}/${k}`).once("value")).val(); if(v!=null) out[k]=v; }
      const ids=new Set();
      if(out.ideas) Object.values(out.ideas).forEach(i=>(Array.isArray(i.photos)?i.photos:[]).forEach(p=>ids.add(p)));
      if(out.recipes) Object.values(out.recipes).forEach(r=>{ if(r.cover) ids.add(r.cover); });
      if(ids.size){ out.photos={}; for(const p of ids){ const v=(await db.ref(`lists/${code}/photos/${p}`).once("value")).val(); if(v) out.photos[p]=v; } }
      if(Object.keys(out).length) await db.ref(`spaces/${id}`).update(out);
    }

    /* ---------- Einladung annehmen ---------- */
    // wie viele Einträge eine Liste hat (für die Frage beim Beitreten)
    async function countData(id){
      const d=DATA[type]; if(!d) return 0;
      try{ return Object.keys((await db.ref(`spaces/${id}/${d.keys[0]}`).once("value")).val()||{}).length; }catch(e){ return 0; }
    }
    async function join(j,current,mode){
      if(current && current!==j.sid && !mode){
        const n=await countData(current), d=DATA[type], w=d?d.word:["Eintrag","Einträge"];
        if(n>0){
          show(`Einladung zu ${PAGE.label}`,"",`<p class="auth-note">Du hast schon eine eigene ${esc(PAGE.noun)} mit <b>${n} ${n===1?w[0]:w[1]}</b>. Was soll damit passieren?</p>

            <button class="auth-btn alt" type="button" id="jDrop">Nicht mitnehmen und löschen</button>

            b.disabled=true; join(j,current,"drop"); };
          $a("#jNo").onclick=()=>{ clearHash(); hide(); open(current); };
          return;
        }
        mode="drop";   // eigene Liste ist leer: einfach wechseln
      }
      try{
        await db.ref(`spaces/${j.sid}/access/${user.uid}`).set(j.code);
        await db.ref(`spaces/${j.sid}/meta/owners/${user.uid}`).set(true).catch(()=>{});   // gehört dann allen gemeinsam
        if(current && current!==j.sid){
          if(mode==="merge") await copyData(current,j.sid);
          // alte Liste aufräumen: löschen, wenn sonst niemand drin war, sonst nur selbst austreten
          try{ const acc=(await db.ref(`spaces/${current}/access`).once("value")).val()||{};

        }
        await db.ref(`users/${user.uid}/spaces/${type}`).set(j.sid);

    // Alle Daten dieser Seite samt Fotos von einer Liste in eine andere kopieren (Vorhandenes bleibt)
    async function copyData(from,to){
      const d=DATA[type]; if(!d) return;
      const photos=new Set();
      for(const key of d.keys){
        const src=(await db.ref(`spaces/${from}/${key}`).once("value")).val(); if(!src) continue;
        const dst=(await db.ref(`spaces/${to}/${key}`).once("value")).val()||{};

        if(key==="week"){   // Gym-Wochenplan: Übungen je Tag zusammenführen
          const A=Array.isArray(src)?Object.assign({},src):src, B=Array.isArray(dst)?Object.assign({},dst):dst;

        }else if(key==="log"){   // abgehakte Übungen je Datum zusammenführen
          for(const [day,v] of Object.entries(src)) out[day]={...(v||{}),...(dst[day]||{})};
        }else if(key==="rooms"||key==="cats"){   // eigene Namen: doppelte weglassen
          const have=new Set(Object.values(dst));
          for(const [k,v] of Object.entries(src)) if(!have.has(v) && !dst[k]) out[k]=v;
        }else{
          for(const [k,v] of Object.entries(src)){ if(dst[k] || !v) continue; out[k]=v;
            if(v.cover && /^[0-9a-f]{32}$/.test(v.cover)) photos.add(v.cover);
            if(Array.isArray(v.photos)) v.photos.forEach(p=>{ if(/^[0-9a-f]{32}$/.test(p)) photos.add(p); }); }
        }
        if(Object.keys(out).length) await db.ref(`spaces/${to}/${key}`).update(out);
      }
      for(const p of photos){ const ph=(await db.ref(`spaces/${from}/photos/${p}`).once("value")).val(); if(ph) await db.ref(`spaces/${to}/photos/${p}`).set(ph); }
    }

    async function open(id){
      try{ await db.ref(`spaces/${id}/meta`).once("value"); ready(id); }
      catch(err){ await db.ref(`users/${user.uid}/spaces/${type}`).remove().catch(()=>{}); setupView("Du hast keinen Zugriff mehr auf diese Liste. Leg eine neue an oder lass dich wieder einladen."); }
    }
    function ready(id){

          profile.name=n||u.displayName||u.email.split("@")[0];
          await db.ref(`users/${u.uid}/profile/name`).set(profile.name);
        }
        try{ const pb=(await db.ref(`pub/${u.uid}`).once("value")).val()||{}; pubCache.set(u.uid,pb);
          if(pb.name!==profile.name) await db.ref(`pub/${u.uid}/name`).set(profile.name); pubCache.get(u.uid).name=profile.name; }catch(e){}
        window.Auth._profileView=profileView; window.Auth.me=u.uid;
        installMenu();
        db.ref(`users/${u.uid}/settings`).on("value",s=>{ const v=s.val()||{};
          Object.entries(KC_KEY).forEach(([t,k])=>applyKcal(t,typeof v[k]==="boolean"?v[k]:v.kcal===true)); },()=>{});
        try{ await ensureFriendCode(); watchFriends(); watchChats(); }catch(e){}
        const fr=location.hash.match(/^#friend-([A-Za-z0-9]{6,12})$/);
        if(fr){ clearHash(); setTimeout(async()=>{ let r; try{ r=await sendRequest(fr[1]); }catch(e){ r={err:"Die Anfrage hat nicht geklappt."}; } friendsView(r.err||r.ok,!!r.err); },400); }
        if(PAGE.noSpace){ hide(); updateMenu(); if(!started){ started=true; cb(null,{uid:u.uid,email:u.email,name:profile.name,db}); } return; }
        const current=(await db.ref(`users/${u.uid}/spaces/${type}`).once("value")).val();
        const j=parseJoin();
        if(j){ await join(j,current); return; }
        if(current){ await open(current); return; }
        setupView();
      }catch(err){
        show(PAGE.label,"",`<p class="auth-msg err">Die Daten konnten nicht geladen werden. Prüf die Internetverbindung und die Regeln in Firebase.</p>
          <button class="auth-btn" type="button" onclick="location.reload()">Neu laden</button>
          <button class="auth-link" type="button" id="authOut">Abmelden</button>`);
        $a("#authOut").onclick=()=>auth.signOut();
      }
    });
  }};
})();

function streakOf(plan,ses,uidX){
  const entries=Object.entries(plan||{}).filter(([,w])=>w&&w.rep); if(!entries.length) return 0;
  const mine=Object.values(ses||{}).filter(x=>x&&x.end&&x.by===uidX);
  const isDone=(di,wid,w)=>mine.some(x=>x.date===di&&(x.plan===wid||(w.tpl&&x.tpl===w.tpl)));
  const today=iso(new Date()); let n=0; const d=new Date(); d.setHours(12,0,0,0);
  for(let k=0;k<400;k++){
    const di=iso(d), occ=entries.filter(([,w])=>occurs(w,di)&&di>=iso(new Date(w.at||0)));
    for(const [wid,w] of occ){ if(isDone(di,wid,w)) n++; else if(di<today) return n; }
    d.setDate(d.getDate()-1);
  }
  return n;
}

const cidOf=(a,b)=>[a,b].sort().join("_");

async function chatSend(fid,text,extra){
  const at=Date.now(), cid=cidOf(myUid,fid), last=text.replace(/\s+/g," ").slice(0,80), ref=fdb().ref(`chats/${cid}/messages`).push();

  fdb().ref(`chatIndex/${myUid}/${cid}`).update({with:fid,name:(friendsIdx[fid]||{}).name||"Freund",last,lastBy:myUid,at,unread:0}).catch(()=>{});
  const inc=firebase.database.ServerValue&&firebase.database.ServerValue.increment?firebase.database.ServerValue.increment(1):1;
  fdb().ref(`chatIndex/${fid}/${cid}`).update({with:myUid,name:myName,last,lastBy:myUid,at,unread:inc}).catch(()=>{});
  return ref.key;
}

let body={};

const ageOf=()=>{ const y=+body.birth; return y>1900?new Date().getFullYear()-y:null; };
const hrMaxOf=()=>ageOf()?Math.round(208-0.7*ageOf()):null;   // geschätzter Maximalpuls (Tanaka)
// Grundumsatz pro Stunde aus Größe, Gewicht, Alter, Geschlecht (Mifflin-St Jeor); ohne Angaben: 1 kcal je kg und Stunde
function bmrOf(b){
  const kg=num(b.weight), cm=num(b.height), y=+b.birth, age=y>1900?new Date().getFullYear()-y:null, sx=b.sex, bf=num(b.fat);
  if(!kg) return null;
  if(bf&&bf>3&&bf<60) return 370+21.6*kg*(1-bf/100);   // Katch-McArdle: mit Körperfettanteil am genauesten
  if(!cm||!age||!sx) return null;
  const m=10*kg+6.25*cm-5*age+5, w=10*kg+6.25*cm-5*age-161;   // Mifflin-St Jeor

}
function bmrPerHour(){ const b=bmrOf(body); return b?b/24:bodyKg(); }
// Wie anstrengend war das Training? (Sätze pro Minute) → MET für Krafttraining zwischen 3,5 und 6
function metOf(se,ex){
  if(ex.length&&ex.filter(x=>x.group==="cardio").length>=ex.length/2) return 7;
  const sets=ex.reduce((a,x)=>a+doneSets(setsOf(se,x.id)).length,0), min=Math.max(1,(se.dur||0)/60), rate=sets/min;
  return rate>=0.4?6:rate>=0.25?5:rate>0?4:5;
}
// Kalorien eines Trainings: mit Ø-Puls nach Keytel (2005, nutzt Puls, Gewicht, Alter, Geschlecht),
// sonst „korrigierter MET“: MET × eigener Grundumsatz pro Stunde × Stunden (nutzt Größe, Gewicht, Alter, Geschlecht)
function kcalFor(se,ex){
  ex=ex||sessEx(se);
  const kg=bodyKg(), min=(se.dur||0)/60, cardio=ex.length&&ex.filter(x=>x.group==="cardio").length>=ex.length/2;
  const hr=num(se.hrAvg), age=ageOf(), sx=body.sex;
  if(hr&&hr>60&&age&&sx&&min>0){
    const m=(-55.0969+0.6309*hr+0.1988*kg+0.2017*age)/4.184, w=(-20.4022+0.4472*hr-0.1263*kg+0.074*age)/4.184;
    const perMin=sx==="m"?m:sx==="w"?w:(m+w)/2;
    return Math.max(0,Math.round(perMin*min*(cardio?1:0.8)));   // beim Krafttraining treibt Anspannung den Puls höher als der Verbrauch: 20 % weniger
  }

}
const kcalOf=se=>se&&se.end?kcalFor(se):0;
function kcalBasis(se){

  if(hr) return "Für die Berechnung aus dem Puls fehlen Geburtsjahr und Geschlecht unter „Ich“.";
  return full?"Berechnet aus Dauer, Satz-Tempo und deinem Grundumsatz (Größe, Gewicht, Alter, Geschlecht). Mit Ø-Puls wird es noch genauer."
    :"Grob geschätzt. Trag unter „Ich“ Größe, Gewicht, Geburtsjahr und Geschlecht ein, dann wird es genauer.";
}

function trainingFeedback(se,ex,prev,dv){

  const prs=done.filter(x=>{ if(x.group==="cardio") return false; const b=best(setsOf(se,x.id)), m=bestBefore(x.id,se.start); return b&&m!=null&&b.kg>m; });
