<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ours · Reisen</title>
<link rel="icon" href="ours-logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ours">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--page:#f2f2f7;--band:#1d6a7a;--on-band:#fff;--on-band-muted:#bfe0e6;--bg:#ffffff;--surface:#ffffff;--surface2:#f4f5f7;--ink:#111;--muted:#8a8a8e;--line:#e5e5ea;--shadow:rgba(0,0,0,.07);
  --accent:#1d6a7a;--accent-soft:#e3f1f4;--logo-bg:#155463;--body:"Inter",system-ui,-apple-system,sans-serif;--minus:#e5483d;--plus:#1f9d55;color-scheme:light;
  --grouped:#f2f2f7;--cell:#ffffff;--sep:#d8d8dc;--red:#e5483d;--warn:#c27c0e}
@media (prefers-color-scheme:dark){:root{--page:#000;--band:#174f5b;--bg:#000;--surface:#1c1c1e;--surface2:#151517;--ink:#f2f2f7;--muted:#8e8e93;--line:#2c2c2e;--shadow:rgba(0,0,0,.6);--accent:#4fb3c6;--accent-soft:#16343b;--logo-bg:#123f49;color-scheme:dark;
  --grouped:#000;--cell:#1c1c1e;--sep:#38383a;--red:#ff453a;--warn:#e8a33d}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--body);background:var(--page)}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:720px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative;padding:0 16px}
@media (min-width:661px){.wrap{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
header{flex:none;margin:0 -16px;background:var(--band);color:var(--on-band);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;background:var(--bg);border-radius:14px 14px 0 0}
header.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(12px + env(safe-area-inset-top,0px)) 64px 25px!important;overflow:visible;z-index:30}
header.brand .wordmark{font-weight:800;letter-spacing:-.02em;font-size:clamp(2.1rem,9.5vw,2.7rem);line-height:1;color:var(--on-band);white-space:nowrap}
header.brand .pf-btn{top:calc(50% - 27px + env(safe-area-inset-top,0px) / 2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.status{flex:none;font-size:.82rem;color:var(--muted);padding:4px 0}
.status:empty{display:none}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -16px;padding:6px 16px 110px}
h2.big{margin:6px 0 10px;font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.sec{margin:20px 2px 8px;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.sec .sp{flex:1}
.sec button{border:0;background:none;color:var(--accent);font-size:.82rem;font-weight:600;text-transform:none;letter-spacing:0;padding:2px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 3px var(--shadow)}
.muted{color:var(--muted)}
/* Liste */
.hero{display:block;width:100%;text-align:left;border:0;border-radius:22px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--c,#1d6a7a),color-mix(in srgb,var(--c,#1d6a7a) 55%,#0b1e24));box-shadow:0 14px 30px -18px rgba(0,0,0,.6);position:relative;overflow:hidden;text-decoration:none}
.hero::after{content:attr(data-ic);position:absolute;right:-6px;bottom:-18px;font-size:6.5rem;opacity:.22;transform:rotate(-8deg)}
.hero small{display:block;font-size:.78rem;font-weight:600;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.hero b{display:block;font-size:1.8rem;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.hero .when{font-size:.92rem;opacity:.9}
.hero .cd{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem}
.hero .bar{margin-top:12px;height:6px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden;max-width:260px}
.hero .bar i{display:block;height:100%;background:#fff;border-radius:999px}
.hero .pp{font-size:.78rem;opacity:.9;margin-top:5px;max-width:250px;line-height:1.35}
.trow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 14px;color:var(--ink);position:relative}
.trow+.trow::before{content:"";position:absolute;left:60px;right:0;top:0;border-top:.5px solid var(--sep)}
.trow .em{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:1.2rem;background:var(--accent-soft);flex:none}
.trow span.t{flex:1;min-width:0}
.trow b{display:block;font-weight:700}
.trow small{display:block;color:var(--muted);font-size:.8rem}
.trow .r{color:var(--muted);font-size:.82rem;white-space:nowrap}
.empty{text-align:center;padding:30px 10px}
.empty .big{font-size:3.4rem}
.empty h3{margin:8px 0 6px;font-size:1.25rem}
.empty p{margin:0 auto 16px;color:var(--muted);max-width:330px;line-height:1.45}
.btn{border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;padding:13px 18px;font-size:1rem}
.btn.alt{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:.86rem;border-radius:10px}
/* Reise */
.thead{display:flex;align-items:center;gap:8px;padding-top:8px}
.thead .back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 9px;font-weight:600;font-size:.88rem;box-shadow:0 1px 3px var(--shadow)}
.thead .sp{flex:1}
.ttl{margin:10px 0 2px;font-size:1.8rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tsub{color:var(--muted);font-size:.92rem}
.tabs{position:sticky;top:-6px;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:12px 0 4px}
.tabs button{border:0;background:none;border-radius:9px;padding:7px 2px;font-size:.78rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button span{font-size:1rem}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.now{padding:16px;border-radius:18px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.now small{font-size:.75rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.now h3{margin:4px 0 4px;font-size:1.35rem;font-weight:800}
.now p{margin:0;color:var(--ink);opacity:.85;font-size:.92rem;line-height:1.4}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tl{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;text-align:left;color:var(--ink)}
.tl small{display:block;color:var(--muted);font-size:.72rem;font-weight:600}
.tl b{display:block;font-size:1.1rem;font-weight:800;margin-top:2px}
.tl .mini{height:4px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:6px}
.tl .mini i{display:block;height:100%;background:var(--accent)}
.wx{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.wx::-webkit-scrollbar{display:none}
.wd{flex:none;min-width:58px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px;font-size:.74rem}
.wd b{display:block;font-size:1.25rem;line-height:1.4}
.wd .tmp{font-weight:700;font-size:.8rem}
.wd .rn{color:#2b7bd6}
.wd.today{border-color:var(--accent)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.it{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:46px;position:relative;width:100%;border:0;background:none;text-align:left;color:var(--ink)}
.it+.it::before{content:"";position:absolute;left:46px;right:0;top:0;border-top:.5px solid var(--sep)}
.ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--sep);background:none;display:grid;place-items:center;padding:0;color:#fff;font-size:.8rem;font-weight:800}
.ck[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.it .tx{flex:1;min-width:0}
.it .tx b{display:block;font-weight:500;font-size:.95rem}
.it.done .tx b{color:var(--muted);text-decoration:line-through}
.it .tx small{display:block;color:var(--muted);font-size:.76rem}
.it .tx small.late{color:var(--red);font-weight:600}
.it .ppl{display:flex;gap:2px}
.it .ppl i{width:18px;height:18px;border-radius:50%;font-style:normal;font-size:.62rem;font-weight:800;display:grid;place-items:center;color:#fff;background:var(--c)}
.it .ppl i.no{background:none;border:1.5px dashed var(--sep);color:var(--muted)}
.it .x{flex:none;border:0;background:none;color:var(--red);font-size:1.1rem;padding:4px 6px}
.it .tm{flex:none;width:46px;font-weight:700;font-size:.86rem;color:var(--accent)}
.it .ic{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center}
.add{display:flex;gap:6px;padding:8px;border-top:.5px solid var(--sep)}
.add input,.add select{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 10px;min-width:0}
.add input{flex:1}
.add select{flex:none;max-width:120px}
.add button{flex:none;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:0 14px;font-weight:700;font-size:1.1rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:.84rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.sug{border-style:dashed;color:var(--accent)}
.dayh{margin:16px 2px 6px;display:flex;align-items:baseline;gap:8px}
.dayh b{font-weight:800}
.dayh small{color:var(--muted);font-size:.82rem}
.dayh.today b{color:var(--accent)}
.dayh .sp{flex:1}
.dayh button{border:0;background:none;color:var(--accent);font-weight:600;font-size:.85rem}
.conf{display:inline-block;margin-top:2px;font-family:ui-monospace,Menlo,monospace;font-size:.74rem;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink)}
.sum{padding:14px}
.sum .tot{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.sum .bb{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:8px 0 4px}
.sum .bb i{display:block;height:100%;background:var(--accent);border-radius:999px}
.sum .bb i.over{background:var(--red)}
.settle{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:.92rem;font-weight:600}
.pp{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:.84rem;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:4px;padding:10px 12px;position:relative}
.field+.field::before{content:"";position:absolute;left:12px;right:0;top:0;border-top:.5px solid var(--sep)}
.field label{font-size:.74rem;font-weight:700;color:var(--muted)}
.field input,.field textarea{border:0;background:none;padding:2px 0;outline:none;font-size:.98rem;width:100%}
.field textarea{min-height:80px;resize:vertical;line-height:1.4}
.rowbtn{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.fab{position:absolute;z-index:6;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(0,0,0,.5);right:max(18px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.fab svg{width:26px;height:26px}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,20,25,.5);padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:460px;max-height:100%;overflow-y:auto;border-radius:14px;display:flex;flex-direction:column;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.wiz-ic{font-size:1.3rem}
/* Bogen im Apple-Stil */
.sheet.ios{background:var(--grouped);padding:0 16px 22px;gap:0;max-width:460px;border-radius:14px}
.sheet.ios>*{flex-shrink:0}
.ihead{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 0 10px;background:var(--grouped)}
.ihead b{font-size:1rem;font-weight:700;text-align:center;white-space:nowrap}
.ib{border:0;background:none;color:var(--accent);font-size:1rem;padding:4px 0;text-align:left;white-space:nowrap}
.ib:last-child{text-align:right}
.ib.strong{font-weight:700}
.ib[disabled]{color:var(--muted);opacity:.6}
.igrp{background:var(--cell);border-radius:12px;overflow:hidden;margin:0 0 18px;display:flex;flex-direction:column}
.cell{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:10px 14px;border:0;background:none;color:var(--ink);font:inherit;font-size:1rem;text-align:left;width:100%;position:relative}
.cell+.cell::before{content:"";position:absolute;left:14px;right:0;top:0;border-top:.5px solid var(--sep)}
.cell.inp{outline:none}
.cell.inp::placeholder{color:var(--muted)}
.cell.note{min-height:110px;resize:vertical;line-height:1.4}
.cell.col{flex-direction:column;align-items:flex-start;gap:4px}
.cell .cv{color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.cell .cv i{font-style:normal;font-size:1.2rem;color:var(--sep)}
.cell .chk{color:var(--accent);font-weight:700}
.cell.danger{color:var(--red);justify-content:center}
.cell .sub,.sub{color:var(--muted);font-size:.84rem;display:block}
.cdot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px}
.dt{display:flex;gap:6px;min-width:0}
.dt input[type=date]{width:134px}
.dt input[type=time]{width:92px}
.dt input{min-width:0}
.dt input{border:0;background:var(--surface2);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-size:.92rem}
.sheet.ios .dt input{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tgl{position:relative;width:51px;height:31px;flex:none}
.tgl input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.tgl i{position:absolute;inset:0;border-radius:999px;background:color-mix(in srgb,var(--ink) 16%,transparent);transition:background .2s}
.tgl i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.tgl input:checked+i{background:#34c759}
.tgl input:checked+i::after{transform:translateX(20px)}
.segc{gap:4px;justify-content:stretch;background:none}
.segc button{flex:1;border:0;border-radius:8px;padding:7px 2px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink);font:inherit;font-size:.82rem;font-weight:600}
.segc button[aria-pressed="true"]{background:var(--accent);color:#fff}
.step{display:inline-flex;align-items:center;gap:10px}
.step button{width:32px;height:32px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);font-size:1.1rem}
.step b{min-width:92px;text-align:center;font-weight:600}
.wdays{justify-content:space-between}
.wdays button{width:38px;height:38px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink);font:inherit;font-weight:600;font-size:.82rem}
.wdays button[aria-pressed="true"]{background:var(--accent);color:#fff}
.ifoot{margin:-10px 4px 18px;font-size:.82rem;color:var(--muted)}
.evd{padding:4px 2px 14px}
.evd h3{margin:0 0 4px;font-size:1.5rem;font-weight:800;border-left:4px solid var(--c);padding-left:10px}
.evd p{margin:8px 0 0;font-size:.95rem}
.kchips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 12px}
.kchips button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px 4px;font-size:.8rem;font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.kchips button span{font-size:1.3rem}
.kchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.cell input.r{text-align:right;border:0;background:none;outline:none;min-width:0;flex:1;font-size:1rem}
.cell select{border:0;background:none;color:var(--accent);font-size:1rem;text-align:right;max-width:60%}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand" id="head">
    <div class="wordmark" aria-hidden="true">Reisen</div>
    <h1 class="sr-only">Reiseplanung</h1>
  </header>
  <main class="scroll" id="main"></main>
  <div class="status" id="status" aria-live="polite"></div>
  <button class="fab" id="fab" type="button" aria-label="Neue Reise"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
</div>
<div class="modal" id="modal" hidden><div class="sheet ios" role="dialog" aria-modal="true" id="sheet"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* Anmeldung, Profil und Bereiche für alle Seiten
   - E-Mail und Passwort über Firebase Authentication
   - Jede Seite hat ihren eigenen Bereich unter spaces/<id> mit eigenen Personen (access/<uid>)
   - users/<uid>/spaces/<typ> merkt sich, welcher Bereich zu welcher Seite gehört
   Seiten rufen Auth.start(firebaseConfig, "dates" | "recipes" | "chores" | "budget" | "gym", (ref, info) => { ... }) auf. */
/* ---------- Darstellung: Automatisch / Hell / Dunkel – gilt für alle Seiten ----------
   Seiten mit eigenem Dunkel-Design (@media prefers-color-scheme) werden umgeschaltet,
   alle anderen bekommen ein allgemeines dunkles Farbschema. */
(function(){
  const KEY="ours.theme", mq=matchMedia("(prefers-color-scheme: dark)");
  // Vorerst nur ein (heller) Modus – der Dunkelmodus kommt später wieder
  let pref="light";
  let rules=null;
  const find=()=>{ if(rules) return rules; rules=[]; for(const ss of document.styleSheets){ let rs; try{ rs=ss.cssRules; }catch(e){ continue; }
    for(const r of rs){ if(r.media&&/prefers-color-scheme:\s*dark/.test(r.media.mediaText)) rules.push({r,orig:r.media.mediaText}); } } return rules; };
  const css=document.createElement("style"); css.id="ours-theme-css";
  css.textContent=`html.ours-dark{color-scheme:dark;--page:#000;--bg:#121214;--surface:#1c1c1f;--surface2:#26262b;--ink:#ececf1;--muted:#9b9ba5;--line:#2f2f35;--btn:#2a2a30;--frame-line:#1a1a1e;--dots:rgba(255,255,255,.03);
      --accent:color-mix(in srgb,var(--band) 45%,#fff);--accent-soft:color-mix(in srgb,var(--band) 38%,#1c1c1f);--theirs:#26262b;--mine:color-mix(in srgb,var(--band) 45%,#1c1c1f);--shadow:rgba(0,0,0,.6)}
    html.ours-dark body{background-color:#000!important;background-image:none!important}
    html.ours-dark input,html.ours-dark textarea,html.ours-dark select{color-scheme:dark}`;
  function apply(){
    const dark=pref==="dark"||(pref==="auto"&&mq.matches), list=find(), root=document.documentElement;

    /* ---------- Personen und Einladungen für diese Seite ---------- */

            <span class="nm"><b>${esc(p.name)}${p.id===user.uid?" (du)":""}</b><small>${p.own?(type==="recipes"&&ids.length>1?"Besitzer":"Hat die Liste angelegt"):esc(p.mail)}</small></span>
            ${owner&&p.id!==user.uid?`<button type="button" class="rm${rmConfirm===p.id?" sure":""}" data-rm="${esc(p.id)}">${rmConfirm===p.id?"Entfernen?":"Entfernen"}</button>`:""}</li>`).join("")}</ul>
        ${type==="gym"?`<p class="auth-note">Dein Gymplan gehört nur dir. Deine Freunde können ihn im Gym unter „Freunde“ ansehen und Workouts kopieren, aber nichts ändern.</p>`:""}
        <div${type==="gym"?" hidden":""}>
        ${(()=>{ const fl=Object.entries(friends).filter(([id])=>!access[id]); return fl.length?`<p class="auth-sec">Freunde einladen</p>
          <ul class="auth-people">${fl.map(([id,f])=>`<li>${avatar(id,f.name,30)}<span class="nm"><b>${esc(f.name||"Freund")}</b><small>bekommt die Einladung unter „Freunde“</small></span>
          <button type="button" class="rm yes" data-fr-inv="${esc(id)}">Einladen</button></li>`).join("")}</ul>`:""; })()}
        <p class="auth-sec">Per Link einladen</p>
        <p class="auth-note">Der Link gilt nur für ${esc(PAGE.label)} und nur für eine Person. Wer ihn öffnet, tritt mit eigenem Konto bei. Deine anderen Seiten sieht die Person nicht.</p>
        <button class="auth-btn" type="button" id="invNew">Einladungslink erstellen</button>
        <div class="auth-copy" id="invBox" hidden><input type="text" id="invLink" readonly aria-label="Einladungslink"><button class="auth-btn" type="button" id="invCopy">Kopieren</button></div>
        </div>
        <p class="auth-msg" id="authMsg" hidden></p>
        ${nInv?`<button class="auth-link" type="button" id="invRevoke">${nInv} offene${nInv===1?"r Link":" Links"} · alle zurückziehen</button>`:""}
        ${ids.length>1&&DATA[type]?`<button class="auth-link danger" type="button" id="leave">Austreten und alles mitnehmen</button>`:""}
        <button class="auth-btn alt" type="button" id="ppClose">Fertig</button>`,true);
      $a("#ppClose").onclick=()=>{ rmConfirm=null; hide(); };
      $a("#invNew").onclick=async()=>{
        const code=rand(20);
        try{
          await db.ref(`spaces/${sid}/invites/${code}`).set({by:user.uid,at:Date.now()});
          const base=location.href.split("#")[0].replace(/[^/]*$/,"");
          $a("#invLink").value=`${base}${PAGE.file}#join-${sid}-${code}`; $a("#invBox").hidden=false; msg("");
        }catch(err){ msg("Der Link konnte nicht erstellt werden.",true); }
      };
      $a("#invCopy").onclick=async()=>{
        try{ await navigator.clipboard.writeText($a("#invLink").value); msg("Kopiert. Jetzt per WhatsApp oder Mail verschicken."); }
        catch(e){ $a("#invLink").select(); msg("Markiert. Jetzt kopieren und verschicken."); }
      };
      screen.querySelectorAll("[data-fr-inv]").forEach(b=>b.onclick=async()=>{
        b.disabled=true; b.textContent="…";
        try{ await inviteFriend(b.dataset.frInv); b.textContent="Eingeladen ✓"; b.classList.remove("yes"); b.classList.add("done"); }
        catch(err){ b.disabled=false; b.textContent="Einladen"; msg("Die Einladung hat nicht geklappt. Prüf die Regeln in Firebase.",true); }

      screen.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{

        await db.ref(`spaces/${sid}/access/${id}`).remove().catch(()=>{});

    /* ---------- Freunde ---------- */
    let friends={}, requestsIn={}, inbox={}, friendCode=null, friendsOpen=false, frConfirm=null;
    const frBadge=()=>Object.keys(requestsIn).length+Object.keys(inbox).length;
    let chatUnread=0;
    function updateFriendBadge(){
      const n=frBadge(), b=document.getElementById("pfFriendBadge"), d=document.getElementById("pfDot"), c=document.getElementById("pfChatBadge");
      if(b){ b.textContent=n; b.hidden=!n; } if(c){ c.textContent=chatUnread; c.hidden=!chatUnread; } if(d) d.hidden=!(n||chatUnread);
      const cb=document.getElementById("oursChatN"); if(cb){ cb.textContent=chatUnread>99?"99+":chatUnread; cb.hidden=!chatUnread; }
    }
    function watchChats(){
      db.ref(`chatIndex/${user.uid}`).on("value",s=>{ const v=s.val()||{}; chatUnread=Object.values(v).reduce((a,x)=>a+(x&&+x.unread>0?+x.unread:0),0);
        updateFriendBadge(); document.dispatchEvent(new CustomEvent("ours-chat",{detail:{unread:chatUnread,index:v}})); },()=>{});
    }
    async function ensureFriendCode(){
      friendCode=(await db.ref(`users/${user.uid}/friendCode`).once("value")).val();
      if(friendCode) return;
      for(let i=0;i<5 && !friendCode;i++){
        const c=rand(8).toUpperCase().replace(/[^A-Z0-9]/g,"X");
        try{ await db.ref(`friendCodes/${c}`).set(user.uid); await db.ref(`users/${user.uid}/friendCode`).set(c); friendCode=c; }catch(e){}
      }
    }
    function watchFriends(){
      db.ref(`friends/${user.uid}`).on("value",s=>{ friends=s.val()||{}; if(friendsOpen) friendsView(); },()=>{});
      db.ref(`requests/${user.uid}`).on("value",s=>{ requestsIn=s.val()||{}; updateFriendBadge(); if(friendsOpen) friendsView(); },()=>{});
      db.ref(`inbox/${user.uid}`).on("value",s=>{ inbox=s.val()||{}; updateFriendBadge(); if(friendsOpen) friendsView(); },()=>{});
    }
    const myName=()=>profile.name||user.email.split("@")[0];
    async function sendRequest(code){
      code=String(code||"").trim().toUpperCase().replace(/^.*#FRIEND-/,"").replace(/[^A-Z0-9]/g,"");
      if(code.length<6) return {err:"Gib einen Freundescode ein. Er hat 8 Zeichen."};
      const uid=(await db.ref(`friendCodes/${code}`).once("value")).val();
      if(!uid) return {err:"Zu diesem Code gibt es niemanden. Prüf die Schreibweise."};
      if(uid===user.uid) return {err:"Das ist dein eigener Code."};
      if(friends[uid]) return {ok:`${friends[uid].name||"Diese Person"} ist schon dein Freund.`};
      if(requestsIn[uid]){ await acceptRequest(uid); return {ok:`Ihr seid jetzt befreundet.`}; }
      await db.ref(`requests/${uid}/${user.uid}`).set({name:myName(),at:Date.now()});
      return {ok:"Freundschaftsanfrage gesendet. Sobald sie angenommen ist, erscheint die Person hier."};
    }
    async function acceptRequest(from){
      const req=requestsIn[from]||{}, now=Date.now();
      await db.ref(`friends/${user.uid}/${from}`).set({name:req.name||"Freund",since:now});
      await db.ref(`friends/${from}/${user.uid}`).set({name:myName(),since:now});
      await db.ref(`requests/${user.uid}/${from}`).remove();
    }
    function friendsView(msgText,isErr){
      friendsOpen=true;
      const base=location.href.split("#")[0].replace(/[^/]*$/,"");
      const link=friendCode?`${base}index.html#friend-${friendCode}`:"";

      show("Freunde",fl.length?`${fl.length} ${fl.length===1?"Freund":"Freunde"}`:"Füg Freunde hinzu, um sie schnell zu deinen Listen einzuladen.",`
        ${inv.length?`<p class="auth-sec">Einladungen</p><ul class="auth-people">${inv.map(([id,x])=>`<li>${avatar(x.from,x.fromName,30)}
          <span class="nm"><b>${esc(x.fromName||"Jemand")}</b><small>${x.type==="swipe"?"will mit dir Rezepte swipen":`lädt dich zu ${esc(pageOf(x.type).label)} ein`}</small></span>
          <button type="button" class="rm" data-inv-no="${esc(id)}">Nein</button><button type="button" class="rm yes" data-inv-yes="${esc(id)}">Annehmen</button></li>`).join("")}</ul>`:""}
        ${reqs.length?`<p class="auth-sec">Anfragen</p><ul class="auth-people">${reqs.map(([id,x])=>`<li>${avatar(id,x.name,30)}
          <span class="nm"><b>${esc(x.name||"Jemand")}</b><small>möchte mit dir befreundet sein</small></span>
          <button type="button" class="rm" data-req-no="${esc(id)}">Ablehnen</button><button type="button" class="rm yes" data-req-yes="${esc(id)}">Annehmen</button></li>`).join("")}</ul>`:""}
        <p class="auth-sec">Deine Freunde</p>
        ${fl.length?`<ul class="auth-people">${fl.map(([id,f])=>`<li>${avatar(id,f.name,30)}<span class="nm"><b>${esc(f.name||"Freund")}</b><small>befreundet seit ${new Date(f.since||Date.now()).toLocaleDateString("de-DE")}</small></span>
          <button type="button" class="rm${frConfirm===id?" sure":""}" data-fr-rm="${esc(id)}">${frConfirm===id?"Entfernen?":"Entfernen"}</button></li>`).join("")}</ul>`
          :`<p class="auth-note">Noch keine Freunde. Schick deinen Code oder Link, oder gib unten einen Code ein.</p>`}
        <p class="auth-sec">Dein Freundescode</p>
        <div class="fr-code">${esc(friendCode||"…")}</div>
        <div class="auth-copy"><input type="text" id="frLink" readonly value="${esc(link)}" aria-label="Dein Freundes-Link"><button class="auth-btn" type="button" id="frCopy">Link kopieren</button></div>
        <p class="auth-sec">Freund hinzufügen</p>
        <form class="auth-copy" id="frAdd" autocomplete="off"><input type="text" id="frIn" maxlength="40" placeholder="Code, z.B. K7M2QX9A" aria-label="Freundescode"><button class="auth-btn" type="submit">Senden</button></form>
        <p class="auth-msg${isErr?" err":""}" id="authMsg"${msgText?"":" hidden"}>${esc(msgText||"")}</p>
        <button class="auth-btn alt" type="button" id="frClose">Fertig</button>`,true);
      $a("#frClose").onclick=()=>{ friendsOpen=false; frConfirm=null; hide(); };
      $a("#frCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(link); msg("Kopiert. Schick den Link an deine Freunde."); }catch(e){ $a("#frLink").select(); msg("Markiert. Jetzt kopieren und verschicken."); } };

        try{ await ensureFriendCode(); watchFriends(); watchChats(); }catch(e){}
        const fr=location.hash.match(/^#friend-([A-Za-z0-9]{6,12})$/);
        if(fr){ clearHash(); setTimeout(async()=>{ let r; try{ r=await sendRequest(fr[1]); }catch(e){ r={err:"Die Anfrage hat nicht geklappt."}; } friendsView(r.err||r.ok,!!r.err); },400); }
        if(PAGE.noSpace){ hide(); updateMenu(); if(!started){ started=true; cb(null,{uid:u.uid,email:u.email,name:profile.name,db}); } return; }
        const current=(await db.ref(`users/${u.uid}/spaces/${type}`).once("value")).val();
        const j=parseJoin();
        if(j){ await join(j,current); return; }
        if(current){ await open(current); return; }
        setupView();

        show(PAGE.label,"",`<p class="auth-msg err">Die Daten konnten nicht geladen werden. Prüf die Internetverbindung und die Regeln in Firebase.</p>
          <button class="auth-btn" type="button" onclick="location.reload()">Neu laden</button>
          <button class="auth-link" type="button" id="authOut">Abmelden</button>`);

function sortedTrips(){ return Object.entries(trips).filter(([,t])=>t&&t.from).sort((a,b)=>a[1].from.localeCompare(b[1].from)); }

const WX={}, WIC=c=>c===0?"☀️":c<=2?"🌤️":c===3?"☁️":c<=48?"🌫️":c<=57?"🌦️":c<=67?"🌧️":c<=77?"🌨️":c<=82?"🌧️":c<=86?"🌨️":"⛈️";

async function loadWx(id){

  if(dayNum(tr.from)-dayNum(t)>15||end<t) return;

  WX[id]="busy";

    if(!g){ WX[id]={at:Date.now(),none:true}; return; }
    if(tr.lat==null&&root) root.child(`trips/${id}`).update({lat:g.lat,lon:g.lon,place:g.place||null}).catch(()=>{});
    const a=tr.from>t?tr.from:t, b=addD(t,15)<end?addD(t,15):end;
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.lat}&longitude=${g.lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${a}&end_date=${b}`);

  if(w.days.some(x=>(x.rain||0)>=50)) { sug("Regenschirm","Sonstiges",0,"Regen angesagt",["schirm"]); sug("Regenjacke","Kleidung",1,"Regen angesagt",["regenjacke"]); }
  if(w.days.some(x=>x.hi>=25)){ sug("Sonnencreme","Hygiene",0,"bis "+Math.max(...w.days.map(x=>x.hi))+" °C",["sonnencreme"]); sug("Sonnenbrille","Kleidung",1,"sonnig & warm",["sonnenbrille"]); }

  return `<p class="sec">Unterkunft</p><div class="list">${f("stay","Name","z. B. Hotel Bella Vista")}${f("addr","Adresse","Straße, Ort")}${f("checkin","Check-in","z. B. ab 15 Uhr")}${f("checkout","Check-out","z. B. bis 11 Uhr")}${f("phone","Telefon","+39 …","tel")}</div>
    ${I.addr?`<div class="rowbtn"><a class="btn sm alt" href="https://maps.apple.com/?q=${encodeURIComponent(I.addr)}" target="_blank" rel="noopener" style="text-decoration:none">🗺️ In Karten öffnen</a>${I.phone?`<a class="btn sm alt" href="tel:${esc(I.phone.replace(/[^\d+]/g,""))}" style="text-decoration:none">📞 Anrufen</a>`:""}</div>`:""}
    <p class="sec">Notizen</p><div class="list"><div class="field"><label for="in_notes">Alles Wichtige</label><textarea id="in_notes" data-info="notes" maxlength="3000" placeholder="WLAN-Passwort, Restaurant-Tipps, Gepäckregeln …">${esc(I.notes||"")}</textarea></div></div>
    <p class="muted" style="font-size:.8rem;margin:8px 2px">🆘 Notruf in der EU: <a href="tel:112">112</a>. Speichere keine Passwörter oder Ausweisnummern hier.</p>
    <p class="sec">Reise</p><div class="list"><label class="cell"><span>Im Kalender zeigen</span><span class="tgl"><input type="checkbox" data-act="cal"${tr.cal===false?"":" checked"}><i></i></span></label>
      <button type="button" class="cell nav" data-act="edittrip"><span>Ziel, Datum & Mitreisende ändern</span><span class="cv"><i>›</i></span></button>
      <button type="button" class="cell danger" data-act="deltrip">Reise löschen</button></div>`;
}

/* ---------- Bögen ---------- */
function openSheet(s){ sheet=s; paintSheet(); $("#modal").hidden=false; }
function closeSheet(){ sheet=null; $("#modal").hidden=true; }
function paintSheet(){
  const S=sheet, sh=$("#sheet"); if(!S) return;
  if(S.type==="trip"){ const ids=Object.keys(profiles).length?Object.keys(profiles):[myUid];
    sh.innerHTML=`<div class="ihead"><button type="button" class="ib" data-close>Abbrechen</button><b>${S.id?"Reise bearbeiten":"Neue Reise"}</b><button type="button" class="ib strong" data-act="savetrip"${S.dest.trim()&&S.from?"":" disabled"}>${S.id?"Fertig":"Anlegen"}</button></div>
      <div class="igrp"><input class="cell inp" id="tDest" maxlength="60" placeholder="Wohin? z. B. Rom" value="${esc(S.dest)}" autocomplete="off"></div>
      <div class="igrp"><div class="cell"><span>Hin</span><span class="dt"><input type="date" id="tFrom" value="${esc(S.from)}"></span></div><div class="cell"><span>Zurück</span><span class="dt"><input type="date" id="tTo" value="${esc(S.to)}" min="${esc(S.from)}"></span></div></div>
      <div class="igrp"><div class="cell"><span>Was für eine Reise?</span></div><div class="kchips">${KINDS.map(([k,e,l])=>`<button type="button" data-kind="${k}" aria-pressed="${S.kind===k}"><span>${e}</span>${l}</button>`).join("")}</div></div>
      <div class="igrp"><div class="cell"><span>Wie kommt ihr hin?</span></div><div class="kchips">${GOS.map(([k,e,l])=>`<button type="button" data-go="${k}" aria-pressed="${S.go===k}"><span>${e}</span>${l}</button>`).join("")}</div></div>
      ${ids.length>1?`<div class="igrp"><div class="cell"><span>Wer kommt mit?</span></div><div class="kchips">${ids.map(u=>`<button type="button" data-who="${esc(u)}" aria-pressed="${S.who.includes(u)}"><span>${u===myUid?"🙋":"🧑"}</span>${esc(nameOf(u).split(" ")[0])}</button>`).join("")}</div></div>`:""}
      ${S.id?"":`<p class="ifoot">Ours legt dir dazu eine passende Packliste und eine Checkliste an. Beides kannst du danach ändern.</p>`}`;
  } else if(S.type==="plan"){ const tr=trips[cur], d0=addD(tr.from,-1), n=dayNum(tr.to||tr.from)-dayNum(tr.from)+2, opts=[]; for(let i=0;i<=n;i++) opts.push(addD(d0,i));
    sh.innerHTML=`<div class="ihead"><button type="button" class="ib" data-close>Abbrechen</button><b>${S.id?"Eintrag":"Neuer Eintrag"}</b><button type="button" class="ib strong" data-act="saveplan"${S.t.trim()?"":" disabled"}>${S.id?"Fertig":"Hinzufügen"}</button></div>
      <div class="igrp"><div class="kchips" style="grid-template-columns:repeat(4,1fr)">${PKINDS.map(([k,l])=>`<button type="button" data-pk="${k}" aria-pressed="${S.kind===k}"><span>${PICS[k]}</span>${l}</button>`).join("")}</div></div>
      <div class="igrp"><input class="cell inp" id="pT" maxlength="80" placeholder="Titel, z. B. Flug LH 1234" value="${esc(S.t)}" autocomplete="off"><input class="cell inp" id="pPlace" maxlength="120" placeholder="Ort / Adresse" value="${esc(S.place)}" autocomplete="off"></div>
      <div class="igrp"><div class="cell"><span>Tag</span><select id="pD">${opts.map(d=>`<option value="${d}"${d===S.d?" selected":""}>${fmtD(d,{weekday:"short",day:"numeric",month:"short"})}</option>`).join("")}</select></div>
        <div class="cell"><span>Uhrzeit</span><span class="dt"><input type="time" id="pTime" value="${esc(S.time)}"><input type="time" id="pEnd" value="${esc(S.end)}" aria-label="bis"></span></div></div>
      <div class="igrp"><input class="cell inp" id="pConf" maxlength="40" placeholder="Buchungsnummer (optional)" value="${esc(S.conf)}" autocomplete="off"><input class="cell inp" id="pLink" maxlength="300" placeholder="Link (optional)" value="${esc(S.link)}" autocomplete="off" inputmode="url"></div>
      <div class="igrp"><textarea class="cell inp note" id="pNote" maxlength="600" placeholder="Notiz">${esc(S.note)}</textarea></div>
      ${S.id&&(S.place||S.link)?`<div class="igrp">${S.place?`<a class="cell nav" href="https://maps.apple.com/?q=${encodeURIComponent(S.place)}" target="_blank" rel="noopener"><span>🗺️ In Karten öffnen</span><span class="cv"><i>›</i></span></a>`:""}${/^https?:\/\//.test(S.link)?`<a class="cell nav" href="${esc(S.link)}" target="_blank" rel="noopener"><span>🔗 Link öffnen</span><span class="cv"><i>›</i></span></a>`:""}</div>`:""}
      ${S.id?`<div class="igrp"><button type="button" class="cell danger" data-act="delplan">Eintrag löschen</button></div>`:""}`;
  } else if(S.type==="cost"){ const ws=people(trips[cur]);
    sh.innerHTML=`<div class="ihead"><button type="button" class="ib" data-close>Abbrechen</button><b>${S.id?"Ausgabe":"Neue Ausgabe"}</b><button type="button" class="ib strong" data-act="savecost"${S.amt>0?"":" disabled"}>${S.id?"Fertig":"Hinzufügen"}</button></div>
      <div class="igrp"><div class="cell"><span>Betrag</span><input class="r" id="cAmt" inputmode="decimal" placeholder="0,00 €" value="${S.amt?(S.amt/100).toFixed(2).replace(".",","):""}"></div><input class="cell inp" id="cT" maxlength="60" placeholder="Wofür? z. B. Abendessen" value="${esc(S.t)}" autocomplete="off"></div>
      <div class="igrp"><div class="kchips">${CCATS.map(([k,e,l])=>`<button type="button" data-cc="${k}" aria-pressed="${S.cat===k}"><span>${e}</span>${l}</button>`).join("")}</div></div>
      ${ws.length>1?`<div class="igrp"><div class="cell"><span>Wer hat bezahlt?</span></div><div class="kchips">${ws.map(u=>`<button type="button" data-by="${esc(u)}" aria-pressed="${S.by===u}"><span>${u===myUid?"🙋":"🧑"}</span>${esc(nameOf(u).split(" ")[0])}</button>`).join("")}</div>
        <div class="cell"><span>Für wen?</span><select id="cSplit"><option value="">alle teilen</option>${ws.map(u=>`<option value="${esc(u)}"${S.split===u?" selected":""}>nur ${esc(nameOf(u).split(" ")[0])}</option>`).join("")}</select></div></div>`:""}
      ${S.id?`<div class="igrp"><button type="button" class="cell danger" data-act="delcost">Ausgabe löschen</button></div>`:""}`;
  } else if(S.type==="budget"){
    sh.innerHTML=`<div class="ihead"><button type="button" class="ib" data-close>Abbrechen</button><b>Reisebudget</b><button type="button" class="ib strong" data-act="savebudget">Fertig</button></div>
      <div class="igrp"><div class="cell"><span>Budget gesamt</span><input class="r" id="bAmt" inputmode="decimal" placeholder="z. B. 1500 €" value="${S.amt?(S.amt/100).toFixed(0):""}"></div></div><p class="ifoot">Leer lassen, um kein Budget zu nutzen.</p>`;
  } else if(S.type==="deltrip"){
    sh.innerHTML=`<div class="ihead"><button type="button" class="ib" data-close>Abbrechen</button><b>Reise löschen?</b><span class="ib"></span></div><p style="margin:0 4px 16px;color:var(--muted)">Packliste, Plan, Kosten und Infos von <b>${esc(trips[cur].dest)}</b> werden für alle gelöscht.</p><div class="igrp"><button type="button" class="cell danger" data-act="deltripok">Endgültig löschen</button></div>`;
  }
}
const parseEur=v=>{ const n=parseFloat(String(v||"").replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".")); return isFinite(n)?Math.round(n*100):0; };
function grab(){ const S=sheet, g=id=>document.getElementById(id); if(!S) return;
  if(S.type==="trip"){ if(g("tDest")) S.dest=g("tDest").value; if(g("tFrom")) S.from=g("tFrom").value; if(g("tTo")) S.to=g("tTo").value; if(S.to&&S.to<S.from) S.to=S.from; }
  if(S.type==="plan"){ ["t","place","conf","link","note"].forEach(k=>{ const el=g("p"+k[0].toUpperCase()+k.slice(1)); if(el) S[k]=el.value; }); if(g("pD")) S.d=g("pD").value; if(g("pTime")) S.time=g("pTime").value; if(g("pEnd")) S.end=g("pEnd").value; }
  if(S.type==="cost"){ if(g("cAmt")) S.amt=parseEur(g("cAmt").value); if(g("cT")) S.t=g("cT").value; if(g("cSplit")) S.split=g("cSplit").value; }
}
async function saveTrip(){ grab(); const S=sheet; if(!S.dest.trim()||!S.from) return;
  const base={dest:S.dest.trim(),from:S.from,to:S.to&&S.to>S.from?S.to:S.from,kind:S.kind,go:S.go,who:S.who.length?S.who:null};
  if(S.id){ const old=trips[S.id]; if(old.dest!==base.dest){ base.lat=null; base.lon=null; base.place=null; delete WX[S.id]; } Object.assign(trips[S.id],base); root.child("trips/"+S.id).update(base).catch(showErr); closeSheet(); render(); return; }
  const id=uidNew(), tr={...base,by:myUid,at:Date.now(),cal:true,pack:{},todo:{}}, nights=dayNum(tr.to)-dayNum(tr.from);
  packTemplate(S.kind,S.go,nights).forEach((p,i)=>{ tr.pack["p"+i.toString(36)+uidNew()]={t:p.t,cat:p.cat,each:p.each||null}; });
  todoTemplate(S.kind,S.go).forEach((x,i)=>{ tr.todo["t"+i.toString(36)+uidNew()]={t:x.t,off:x.off}; });
  trips[id]=tr; root.child("trips/"+id).set(tr).catch(showErr);
  if(window.OursPush) OursPush.notify(root.key,`${myName||"Jemand"} plant eine Reise ✈️`,`${tr.dest} · ${range(tr.from,tr.to)}`,"reise.html?trip="+id);
  closeSheet(); cur=id; tab="over"; render(); $("#main").scrollTop=0;
  geocode(tr.dest).then(g=>{ if(g&&root) root.child(`trips/${id}`).update(g).catch(()=>{}); });
}
function newTripSheet(){ const t=todayIso(), a=addD(t,30); openSheet({type:"trip",id:null,dest:"",from:a,to:addD(a,6),kind:"beach",go:"plane",who:Object.keys(profiles).length?Object.keys(profiles):[myUid]}); setTimeout(()=>{ const e=$("#tDest"); if(e) e.focus(); },60); }

/* ---------- Klicks ---------- */
document.addEventListener("click",ev=>{
  const t=ev.target, inSheet=t.closest("#modal");
  if(inSheet){
    if(t.id==="modal"||t.closest("[data-close]")) return closeSheet();
    const S=sheet; if(!S) return; const a=t.closest("[data-act]"), A=a&&a.dataset.act;
    const k=t.closest("[data-kind]"); if(k){ grab(); S.kind=k.dataset.kind; return paintSheet(); }
    const g=t.closest("[data-go]"); if(g){ grab(); S.go=g.dataset.go; return paintSheet(); }
    const w=t.closest("[data-who]"); if(w){ grab(); const u=w.dataset.who; S.who=S.who.includes(u)?(S.who.length>1?S.who.filter(x=>x!==u):S.who):[...S.who,u]; return paintSheet(); }
    const pk=t.closest("[data-pk]"); if(pk){ grab(); S.kind=pk.dataset.pk; return paintSheet(); }
    const cc=t.closest("[data-cc]"); if(cc){ grab(); S.cat=cc.dataset.cc; return paintSheet(); }
    const by=t.closest("[data-by]"); if(by){ grab(); S.by=by.dataset.by; return paintSheet(); }
    if(A==="savetrip") return saveTrip();
    if(A==="saveplan"){ grab(); if(!S.t.trim()) return; const p={t:S.t.trim(),kind:S.kind,ic:PICS[S.kind],d:S.d,time:S.time||null,end:S.time&&S.end?S.end:null,place:S.place.trim()||null,conf:S.conf.trim()||null,link:S.link.trim()||null,note:S.note.trim()||null};
      const id=S.id||uidNew(); trips[cur].plan=trips[cur].plan||{}; trips[cur].plan[id]=p; root.child(`trips/${cur}/plan/${id}`).set(p).catch(showErr); closeSheet(); return render(); }
    if(A==="delplan"){ delete trips[cur].plan[S.id]; root.child(`trips/${cur}/plan/${S.id}`).remove().catch(showErr); closeSheet(); return render(); }
    if(A==="savecost"){ grab(); if(!(S.amt>0)) return; const c={amt:S.amt,t:S.t.trim()||null,cat:S.cat,by:S.by||myUid,split:S.split?[S.split]:null,at:S.at||Date.now()};
      const id=S.id||uidNew(); trips[cur].costs=trips[cur].costs||{}; trips[cur].costs[id]=c; root.child(`trips/${cur}/costs/${id}`).set(c).catch(showErr); closeSheet(); return render(); }
    if(A==="delcost"){ delete trips[cur].costs[S.id]; root.child(`trips/${cur}/costs/${S.id}`).remove().catch(showErr); closeSheet(); return render(); }
    if(A==="savebudget"){ const v=parseEur($("#bAmt").value)||null; trips[cur].budget=v; root.child(`trips/${cur}/budget`).set(v).catch(showErr); closeSheet(); return render(); }
    if(A==="deltripok"){ const id=cur; delete trips[id]; root.child("trips/"+id).remove().catch(showErr); closeSheet(); cur=null; return render(); }
    return;
  }
  const op=t.closest("[data-open]"); if(op){ cur=op.dataset.open; tab="over"; editing=false; render(); $("#main").scrollTop=0; history.replaceState(null,"","?trip="+encodeURIComponent(cur)); return; }
  const tb=t.closest("[data-tab]"); if(tb){ tab=tb.dataset.tab; editing=false; render(); $("#main").scrollTop=0; return; }
  if(t.closest("[data-goto]")){ const el=document.getElementById(t.closest("[data-goto]").dataset.goto); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const a=t.closest("[data-act]"), A=a&&a.dataset.act;
  if(A==="new") return newTripSheet();
  if(A==="back"){ cur=null; editing=false; history.replaceState(null,"",location.pathname); render(); return; }
  if(A==="edit"){ editing=!editing; return render(); }
  if(A==="addcost") return openSheet({type:"cost",id:null,amt:0,t:"",cat:"food",by:myUid,split:""});
  if(A==="budget") return openSheet({type:"budget",amt:trips[cur].budget||0});
  if(A==="edittrip"){ const tr=trips[cur]; return openSheet({type:"trip",id:cur,dest:tr.dest||"",from:tr.from,to:tr.to||tr.from,kind:tr.kind||"city",go:tr.go||"car",who:Array.isArray(tr.who)&&tr.who.length?[...tr.who]:people(tr)}); }
  if(A==="deltrip") return openSheet({type:"deltrip"});
  const td=t.closest("[data-todo]"); if(td){ const x=trips[cur].todo[td.dataset.todo]; x.done=!x.done; x.by=x.done?myUid:null; root.child(`trips/${cur}/todo/${td.dataset.todo}`).update({done:x.done||null,by:x.by}).catch(showErr); return render(); }
  const dt=t.closest("[data-deltodo]"); if(dt){ delete trips[cur].todo[dt.dataset.deltodo]; root.child(`trips/${cur}/todo/${dt.dataset.deltodo}`).remove().catch(showErr); return render(); }
  const pc=t.closest("[data-pack]"); if(pc){ const k=pc.dataset.pack, p=trips[cur].pack[k];
    if(p.each){ const v=!packDone(p,myUid); p.done=typeof p.done==="object"&&p.done?p.done:{}; if(v) p.done[myUid]=true; else delete p.done[myUid]; root.child(`trips/${cur}/pack/${k}/done/${myUid}`).set(v||null).catch(showErr); }
    else { p.done=!(p.done===true); p.by=p.done?myUid:null; root.child(`trips/${cur}/pack/${k}`).update({done:p.done||null,by:p.by}).catch(showErr); }
    return render(); }
  const dp=t.closest("[data-delpack]"); if(dp){ delete trips[cur].pack[dp.dataset.delpack]; root.child(`trips/${cur}/pack/${dp.dataset.delpack}`).remove().catch(showErr); return render(); }
  const pv=t.closest("[data-pv]"); if(pv){ packView=pv.dataset.pv; return render(); }
  const sg=t.closest("[data-sug]"); if(sg){ const s=wxSuggest(cur,trips[cur])[+sg.dataset.sug]; if(!s) return; const id=uidNew(), p={t:s.t,cat:s.cat,each:s.each?true:null}; trips[cur].pack=trips[cur].pack||{}; trips[cur].pack[id]=p; root.child(`trips/${cur}/pack/${id}`).set(p).catch(showErr); return render(); }
  const ap=t.closest("[data-addplan]"); if(ap) return openSheet({type:"plan",id:null,kind:ap.dataset.addplan===trips[cur].from?(trips[cur].go==="plane"?"flight":trips[cur].go==="train"?"train":"car"):"ticket",t:"",place:"",d:ap.dataset.addplan,time:"",end:"",conf:"",link:"",note:""});
  const pl=t.closest("[data-plan]"); if(pl){ const p=trips[cur].plan[pl.dataset.plan]; return openSheet({type:"plan",id:pl.dataset.plan,kind:p.kind||"place",t:p.t||"",place:p.place||"",d:p.d,time:p.time||"",end:p.end||"",conf:p.conf||"",link:p.link||"",note:p.note||""}); }
  const co=t.closest("[data-cost]"); if(co){ const c=trips[cur].costs[co.dataset.cost]; return openSheet({type:"cost",id:co.dataset.cost,amt:c.amt,t:c.t||"",cat:c.cat||"misc",by:c.by,split:Array.isArray(c.split)&&c.split.length===1?c.split[0]:"",at:c.at}); }
});
document.addEventListener("submit",ev=>{ const f=ev.target.closest("[data-form]"); if(!f) return; ev.preventDefault(); const fd=new FormData(f), txt=String(fd.get("t")||"").trim(); if(!txt||!cur) return; const id=uidNew();
  if(f.dataset.form==="todo"){ const x={t:txt.slice(0,80),off:+fd.get("off")||0}; trips[cur].todo=trips[cur].todo||{}; trips[cur].todo[id]=x; root.child(`trips/${cur}/todo/${id}`).set(x).catch(showErr); }
  if(f.dataset.form==="pack"){ const p={t:txt.slice(0,60),cat:String(fd.get("cat")||"Sonstiges"),each:fd.get("each")==="1"?true:null}; trips[cur].pack=trips[cur].pack||{}; trips[cur].pack[id]=p; root.child(`trips/${cur}/pack/${id}`).set(p).catch(showErr); }
  render(); const inp=document.querySelector(`[data-form="${f.dataset.form}"] input[name="t"]`); if(inp) inp.focus(); });
document.addEventListener("input",ev=>{ const t=ev.target;
  if(sheet&&["tDest","pT","cAmt"].includes(t.id)){ const b=document.querySelector("#sheet .ib.strong"); grab(); if(b) b.disabled=sheet.type==="trip"?!(sheet.dest.trim()&&sheet.from):sheet.type==="plan"?!sheet.t.trim():!(sheet.amt>0); } });
document.addEventListener("change",ev=>{ const t=ev.target;
  if(t.dataset&&t.dataset.info&&cur){ const v=t.value.trim()||null; trips[cur].info=trips[cur].info||{}; trips[cur].info[t.dataset.info]=v; root.child(`trips/${cur}/info/${t.dataset.info}`).set(v).catch(showErr); if(t.dataset.info==="addr"||t.dataset.info==="phone") render(); }
  if(t.dataset&&t.dataset.act==="cal"&&cur){ trips[cur].cal=t.checked; root.child(`trips/${cur}/cal`).set(t.checked).catch(showErr); }
  if(sheet&&t.id==="tFrom"){ const old=sheet.to&&sheet.from?dayNum(sheet.to)-dayNum(sheet.from):6; grab(); if(t.value) sheet.to=addD(t.value,Math.max(0,old)); paintSheet(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&sheet) closeSheet(); });
$("#fab").addEventListener("click",newTripSheet);

Auth.start(firebaseConfig,"trips",(r,info)=>{
  root=r; if(info){ myUid=info.uid; myName=info.name||""; } render(); if(!root||!myUid) return;
  const q=new URLSearchParams(location.search); let first=true;
  root.child("trips").on("value",s=>{ trips=s.val()||{}; loaded=true;
    if(first){ first=false;
      if(q.get("trip")&&trips[q.get("trip")]) cur=q.get("trip");
      else if(q.get("jetzt")){ const n=nextTrip(); if(n) cur=n[0]; }
      if(q.get("neu")) setTimeout(newTripSheet,200);
    }
    if(!sheet) render(); },()=>showErr());
  root.child("profiles").on("value",s=>{ profiles=s.val()||{}; if(!sheet) render(); },()=>{});
});
</script>
