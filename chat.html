<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Ours · Chats</title>
<link rel="icon" href="ours-logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ours">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=Playfair+Display:wght@800;900&display=swap">
<style>
/* Chats: Nachrichten mit Freunden, ähnlich wie WhatsApp */
:root{
  --page:#18201b; --dots:rgba(255,255,255,.035); --frame-line:#121814; --shadow:rgba(8,14,10,.45);
  --band:#3e5446; --on-band:#eef3ec; --on-band-muted:#b7c6b9;
  --bg:#f1f0eb; --surface:#fcfbf8; --ink:#1f2622; --muted:#6c756e; --line:#e2e2da;
  --accent:#4f6b57; --accent-soft:#e3ebe2; --btn:#e6e8e1; --mine:#d9e8d2; --theirs:#ffffff;
  --display:"Gloock", Georgia, serif; --body:"Figtree", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;background-color:var(--page);
  background-image:radial-gradient(var(--dots) 1.2px,transparent 1.2px);background-size:18px 18px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:620px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative;
  padding:0 16px max(10px,env(safe-area-inset-bottom,0px))}
@media (min-width:661px){.wrap{border-left:1px solid var(--frame-line);border-right:1px solid var(--frame-line)}}
header{flex:none;margin:0 -16px;background:var(--band);color:var(--on-band);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;background:var(--bg);border-radius:14px 14px 0 0}
header.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(12px + env(safe-area-inset-top,0px)) 64px 25px!important}
header.brand .wordmark{font-family:"Playfair Display",var(--display);font-weight:900;font-size:clamp(2.1rem,9.5vw,2.7rem);line-height:1;color:var(--on-band);white-space:nowrap}
header.brand .pf-btn{top:calc(50% - 27px + env(safe-area-inset-top,0px) / 2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap.talking header{display:none}
.status{flex:none;font-size:.82rem;color:var(--muted)}
.status:empty{display:none}

/* Liste */
.panel{flex:1;min-height:0;display:flex;flex-direction:column}
.topbar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 0}
.topbar h2{margin:0;flex:1;font-family:var(--display);font-weight:400;font-size:1.4rem}
.btn{background:var(--btn);color:var(--ink);border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--band);color:var(--on-band)}
.back{display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:6px 4px 6px 0;color:var(--accent);font-weight:600}
.back svg{width:22px;height:22px}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -16px;padding:0 16px 20px}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:10px 4px;color:var(--ink);border-bottom:1px solid var(--line)}
.crow:hover{background:color-mix(in srgb,var(--accent-soft) 50%,transparent)}
.cmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ctop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ctop b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctop time{flex:none;font-size:.75rem;color:var(--muted)}
.ctop time.new{color:var(--accent);font-weight:700}
.cbot{display:flex;justify-content:space-between;gap:8px;align-items:center}
.cbot span{font-size:.88rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbot .unread{color:#fff;overflow:visible;flex:none;min-width:20px;height:20px;border-radius:999px;background:var(--accent);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;padding:0 6px}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:20px;color:var(--muted);display:flex;flex-direction:column;gap:8px;margin-top:8px}
.empty strong{color:var(--ink);font-family:var(--display);font-weight:400;font-size:1.35rem}
.sec-l{margin:14px 0 4px;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}

/* Unterhaltung */
.talk{flex:1;min-height:0;display:flex;flex-direction:column;margin:0 -16px}
.tbar{flex:none;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:var(--band);color:var(--on-band)}
.tbar .back{color:var(--on-band)}
.tbar .ours-av{background:color-mix(in srgb,var(--on-band) 22%,transparent);color:var(--on-band)}
.tbar b{font-weight:600;font-size:1.02rem;display:block}
.tbar small{font-size:.75rem;color:var(--on-band-muted)}
.tbar .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;text-align:left;padding:0}
.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px 8px;display:flex;flex-direction:column;gap:3px;
  background-color:#ebe7dd;background-image:radial-gradient(rgba(62,84,70,.07) 1.2px,transparent 1.2px);background-size:16px 16px}
.day{align-self:center;margin:10px 0 6px;font-size:.74rem;font-weight:600;color:var(--muted);background:rgba(255,255,255,.85);border-radius:8px;padding:3px 10px}
.msg{max-width:80%;padding:6px 10px 4px;border-radius:12px;font-size:.95rem;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.08);position:relative}
.msg.mine{align-self:flex-end;background:var(--mine);border-top-right-radius:4px}
.msg.theirs{align-self:flex-start;background:var(--theirs);border-top-left-radius:4px}
.msg.cont.mine{border-top-right-radius:12px}
.msg.cont.theirs{border-top-left-radius:12px}
.msg:not(.cont){margin-top:5px}
.meta{float:right;margin:6px 0 -2px 10px;font-size:.68rem;color:var(--muted);display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.meta svg{width:16px;height:16px}
.meta .read{color:#3b8bd6}
.msg a{color:var(--accent)}
.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 10px max(8px,env(safe-area-inset-bottom,0px));background:#ebe7dd}
.composer textarea{flex:1;min-width:0;font:inherit;font-size:1rem;line-height:1.35;resize:none;max-height:140px;border:0;border-radius:22px;padding:10px 16px;background:#fff;color:var(--ink);box-shadow:0 1px 1px rgba(0,0,0,.06)}
.composer textarea:focus{outline:none}
.send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center}
.send:disabled{opacity:.5}
.send svg{width:22px;height:22px;margin-left:2px}
.hello{align-self:center;margin:auto;text-align:center;color:var(--muted);font-size:.9rem;max-width:260px;background:rgba(255,255,255,.8);border-radius:12px;padding:10px 14px}
.wrap.talking{padding-bottom:0}
</style>
<script>
// Farbe der Seite übernehmen, von der man kommt (?from=recipes usw.)
(function(){
  const P={
    dates:  {band:"#7b6650",on:"#fbf4e9",muted:"#e0d2bd",page:"#cdbca3",accent:"#7b6650"},
    recipes:{band:"#5a2a31",on:"#f4ebe9",muted:"#c9adad",page:"#231417",accent:"#5a2a31"},
    chores: {band:"#3b5a6d",on:"#eef5f9",muted:"#b9cddb",page:"#8fa6b5",accent:"#3b5a6d"},
    budget: {band:"#123354",on:"#ffffff",muted:"#b8c7d9",page:"#e9eef4",accent:"#0f7b8a",logo:"#0c2640"},
    calendar:{band:"#2f6b4f",on:"#ffffff",muted:"#c3dccf",page:"#e6ece8",accent:"#2f6b4f",logo:"#22513b"},
    home:   {band:"#2b2a33",on:"#ffffff",muted:"#c9c6d2",page:"#e9e6e1",accent:"#2b2a33",logo:"#1d1c24"},
    mail:   {band:"#7a2e2e",on:"#ffffff",muted:"#e8c9c9",page:"#ece9e6",accent:"#a13b3b",logo:"#5e2222"},
    rooms:  {band:"#8a4a30",on:"#fbefe8",muted:"#e6c7b8",page:"#3a2219",accent:"#8a4a30"},
    gym:    {band:"#3c4270",on:"#eef0fa",muted:"#b8bcdc",page:"#191b2b",accent:"#3c4270"}
  };
  let from=(location.search.match(/[?&]from=([a-z]+)/)||[])[1];
  try{ if(from&&P[from]) sessionStorage.setItem("chat.from",from); else from=sessionStorage.getItem("chat.from"); }catch(e){}
  const c=P[from]; if(!c) return;
  const r=document.documentElement.style;
  r.setProperty("--band",c.band); r.setProperty("--on-band",c.on); r.setProperty("--on-band-muted",c.muted); r.setProperty("--page",c.page);
  r.setProperty("--accent",c.accent); r.setProperty("--accent-soft",`color-mix(in srgb,${c.accent} 14%,#fff)`);
  r.setProperty("--mine",`color-mix(in srgb,${c.accent} 16%,#fff)`);
  if(c.logo) r.setProperty("--logo-bg",c.logo);
})();
</script>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="brand" id="head">
    <div class="wordmark" aria-hidden="true">Chats</div>
    <h1 class="sr-only">Chats</h1>
  </header>

  <section class="panel" id="listView">
    <div class="topbar"><h2 id="listTitle">Unterhaltungen</h2><button class="btn primary" type="button" id="newChat">+ Neuer Chat</button></div>
    <div class="scroll" id="list"></div>
  </section>

  <section class="talk" id="talkView" hidden>
    <div class="tbar">
      <button class="back" type="button" id="talkBack" aria-label="Zurück zu den Chats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="who" id="talkWho"></div>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <form class="composer" id="composer" autocomplete="off">
      <textarea id="msgIn" rows="1" maxlength="2000" placeholder="Nachricht" aria-label="Nachricht schreiben"></textarea>
      <button class="send" type="submit" id="sendBtn" aria-label="Senden" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z" fill="currentColor"/></svg></button>
    </form>
  </section>
  <div class="status" id="status" aria-live="polite"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* Anmeldung, Profil und Bereiche für alle Seiten
   - E-Mail und Passwort über Firebase Authentication
   - Jede Seite hat ihren eigenen Bereich unter spaces/<id> mit eigenen Personen (access/<uid>)
   - users/<uid>/spaces/<typ> merkt sich, welcher Bereich zu welcher Seite gehört
   Seiten rufen Auth.start(firebaseConfig, "dates" | "recipes" | "chores" | "budget" | "gym", (ref, info) => { ... }) auf. */
/* ---------- Darstellung: Automatisch / Hell / Dunkel – gilt für alle Seiten ----------
   Seiten mit eigenem Dunkel-Design (@media prefers-color-scheme) werden umgeschaltet,
   alle anderen bekommen ein allgemeines dunkles Farbschema. */
(function(){

  let rules=null;
  const find=()=>{ if(rules) return rules; rules=[]; for(const ss of document.styleSheets){ let rs; try{ rs=ss.cssRules; }catch(e){ continue; }
    for(const r of rs){ if(r.media&&/prefers-color-scheme:\s*dark/.test(r.media.mediaText)) rules.push({r,orig:r.media.mediaText}); } } return rules; };
  const css=document.createElement("style"); css.id="ours-theme-css";
  css.textContent=`html.ours-dark{color-scheme:dark;--page:#000;--bg:#121214;--surface:#1c1c1f;--surface2:#26262b;--ink:#ececf1;--muted:#9b9ba5;--line:#2f2f35;--btn:#2a2a30;--frame-line:#1a1a1e;--dots:rgba(255,255,255,.03);
      --accent:color-mix(in srgb,var(--band) 45%,#fff);--accent-soft:color-mix(in srgb,var(--band) 38%,#1c1c1f);--theirs:#26262b;--mine:color-mix(in srgb,var(--band) 45%,#1c1c1f);--shadow:rgba(0,0,0,.6)}
    html.ours-dark body{background-color:#000!important;background-image:none!important}
    html.ours-dark input,html.ours-dark textarea,html.ours-dark select{color-scheme:dark}`;
  function apply(){
    const dark=pref==="dark"||(pref==="auto"&&mq.matches), list=find(), root=document.documentElement;
    list.forEach(x=>{ try{ x.r.media.mediaText=pref==="auto"?x.orig:pref==="dark"?"all":"not all"; }catch(e){} });

  window.OursTheme={get pref(){ return pref; },set(){ /* vorerst immer hell */ },apply};
  apply();

/* ---------- Apple-Design für alle Seiten ----------
   Systemschrift (SF Pro), Systemfarben in Hell und Dunkel, gruppierte Flächen, weiches Federn beim Drücken,
   Haptik beim Umschalten (iPhone ab iOS 18), Bögen mit Feder-Animation, sanfte Übergänge zwischen den Seiten. */
(function(){

  :root:root[data-theme="dark"]{--page:#000;--bg:#000;--surface:#1c1c1e;--surface2:#2c2c2e;--ink:#ffffff;--muted:#98989f;--line:#38383a;--frame-line:#2c2c2e;--btn:#2c2c2e;--dots:transparent;
    --shadow:rgba(0,0,0,.5);--theirs:#26252a;--accent:color-mix(in srgb,var(--band) 40%,#fff);--accent-soft:color-mix(in srgb,var(--band) 30%,#1c1c1e);--grouped:#000;--cell:#1c1c1e;--sep:#38383a;--red:#cf4b42;--minus:#cf4b42;--plus:#3e9e60;color-scheme:dark}

  :root:root[data-theme="light"][data-hig-page="kalender"],:root:root[data-theme="light"][data-hig-page="reise"]{--bg:#ffffff;--surface2:#f2f2f7}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{font-family:var(--body)!important;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;letter-spacing:-.01em;background-image:none!important}
  *{-webkit-tap-highlight-color:transparent}
  ::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
  h1,h2,h3,h4,.wordmark,.auth-head h2,.auth-setup h3{font-family:var(--display)!important;font-weight:700!important;letter-spacing:-.022em!important}
  header.brand .wordmark{font-weight:800!important;letter-spacing:-.03em!important}

    .sheet.ios{max-width:none!important;width:100%!important;border-radius:14px 14px 0 0!important;max-height:100%!important;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))!important}

  @keyframes hig-rise{from{transform:translateY(100%)}}
  .dt input{padding:6px 7px!important}

  ::view-transition-group(hig-head){animation-duration:.42s;animation-timing-function:var(--hig-spring)}

  :root[data-theme="dark"] input[type=checkbox][role=switch]:checked+i{background:#3e9e60!important}`;
  const put=()=>{ if(!css.isConnected) document.head.appendChild(css); }; put(); addEventListener("DOMContentLoaded",()=>document.head.appendChild(css));

  const apple=document.createElement("style"); apple.id="ours-apple"; apple.textContent=`  /* ===== Apple-Gestaltung (iOS 26): eine helle Variante, Systemfarben, Glas-Leiste, Kapsel-Knöpfe ===== */
  :root:root:root{--page:#f2f2f7;--bg:#f2f2f7;--surface:#ffffff;--surface2:#f2f2f7;--ink:#000000;--muted:#6c6c70;--line:#e5e5ea;--frame-line:#e5e5ea;--sep:#c6c6c8;
    --fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.08);--btn:rgba(118,118,128,.12);--dots:transparent;--shadow:rgba(0,0,0,.04);--theirs:#e9e9eb;--grouped:#f2f2f7;--cell:#ffffff;

        ${groups.map(g=>`<p class="auth-sec">${esc(g.sec)}</p><div class="st-grp">${g.rows.join("")}</div>`).join("")}
        <p class="auth-sec">Mitteilungen</p>

        <div id="psCats" hidden><div class="st-grp">${OursPush.CATS.map(([k,l,n])=>`<label class="auth-sw" for="ps_${k}"><span>${l}<small>${n}</small></span><input type="checkbox" id="ps_${k}" data-pcat="${k}" role="switch"${OursPush.cats[k]?" checked":""}><i aria-hidden="true"></i></label>`).join("")}
          <button type="button" class="st-row" id="psTest"><span class="st-t" style="color:var(--tint,var(--accent))">Test-Mitteilung schicken</span></button></div></div>

        <div class="st-grp"><button type="button" class="st-row" id="stLinks">${ic(IC2.link,"#5a5bb8")}<span class="st-t">Direkt-Links<small>Für die Kurzbefehle-App, Siri oder ein Widget</small></span><i class="chev">›</i></button></div>

    /* ---------- Personen und Einladungen für diese Seite ---------- */

        [profiles,access,meta,invites]=(await Promise.all(["profiles","access","meta","invites"].map(k=>db.ref(`spaces/${sid}/${k}`).once("value")))).map(s=>s.val()||{});
      }catch(err){ return; }
      const coOwn=id=>meta.owner===id || (meta.owners&&meta.owners[id]);
      const owner=!!coOwn(user.uid), ids=Object.keys(access);
      const list=ids.map(id=>({id,name:(profiles[id]&&profiles[id].name)||"Ohne Namen",mail:profiles[id]&&profiles[id].email||"",own:!!coOwn(id)}))
        .sort((a,b)=>(b.own-a.own)||(a.id===user.uid?-1:b.id===user.uid?1:0));

        `<ul class="auth-people">${list.map(p=>`<li>${avatar(p.id,p.name,30)}
            <span class="nm"><b>${esc(p.name)}${p.id===user.uid?" (du)":""}</b><small>${p.own?(type==="recipes"&&ids.length>1?"Besitzer":"Hat die Liste angelegt"):esc(p.mail)}</small></span>
            ${owner&&p.id!==user.uid?`<button type="button" class="rm${rmConfirm===p.id?" sure":""}" data-rm="${esc(p.id)}">${rmConfirm===p.id?"Entfernen?":"Entfernen"}</button>`:""}</li>`).join("")}</ul>
        ${type==="gym"?`<p class="auth-note">Dein Gymplan gehört nur dir. Deine Freunde können ihn im Gym unter „Freunde“ ansehen und Workouts kopieren, aber nichts ändern.</p>`:""}
        <div${type==="gym"?" hidden":""}>
        ${(()=>{ const fl=Object.entries(friends).filter(([id])=>!access[id]); return fl.length?`<p class="auth-sec">Freunde einladen</p>
          <ul class="auth-people">${fl.map(([id,f])=>`<li>${avatar(id,f.name,30)}<span class="nm"><b>${esc(f.name||"Freund")}</b><small>bekommt die Einladung unter „Freunde“</small></span>
          <button type="button" class="rm yes" data-fr-inv="${esc(id)}">Einladen</button></li>`).join("")}</ul>`:""; })()}
        <p class="auth-sec">Per Link einladen</p>
        <p class="auth-note">Der Link gilt nur für ${esc(PAGE.label)} und nur für eine Person. Wer ihn öffnet, tritt mit eigenem Konto bei. Deine anderen Seiten sieht die Person nicht.</p>
        <button class="auth-btn" type="button" id="invNew">Einladungslink erstellen</button>
        <div class="auth-copy" id="invBox" hidden><input type="text" id="invLink" readonly aria-label="Einladungslink"><button class="auth-btn" type="button" id="invCopy">Kopieren</button></div>
        </div>
        <p class="auth-msg" id="authMsg" hidden></p>
        ${nInv?`<button class="auth-link" type="button" id="invRevoke">${nInv} offene${nInv===1?"r Link":" Links"} · alle zurückziehen</button>`:""}
        ${ids.length>1&&DATA[type]?`<button class="auth-link danger" type="button" id="leave">Austreten und alles mitnehmen</button>`:""}
        <button class="auth-btn alt" type="button" id="ppClose">Fertig</button>`,true);
      $a("#ppClose").onclick=()=>{ rmConfirm=null; hide(); };
      $a("#invNew").onclick=async()=>{
        const code=rand(20);
        try{
          await db.ref(`spaces/${sid}/invites/${code}`).set({by:user.uid,at:Date.now()});
          const base=location.href.split("#")[0].replace(/[^/]*$/,"");
          $a("#invLink").value=`${base}${PAGE.file}#join-${sid}-${code}`; $a("#invBox").hidden=false; msg("");
        }catch(err){ msg("Der Link konnte nicht erstellt werden.",true); }
      };
      $a("#invCopy").onclick=async()=>{
        try{ await navigator.clipboard.writeText($a("#invLink").value); msg("Kopiert. Jetzt per WhatsApp oder Mail verschicken."); }
        catch(e){ $a("#invLink").select(); msg("Markiert. Jetzt kopieren und verschicken."); }
      };
      screen.querySelectorAll("[data-fr-inv]").forEach(b=>b.onclick=async()=>{
        b.disabled=true; b.textContent="…";
        try{ await inviteFriend(b.dataset.frInv); b.textContent="Eingeladen ✓"; b.classList.remove("yes"); b.classList.add("done"); }
        catch(err){ b.disabled=false; b.textContent="Einladen"; msg("Die Einladung hat nicht geklappt. Prüf die Regeln in Firebase.",true); }

      const rv=$a("#invRevoke"); if(rv) rv.onclick=async()=>{ await db.ref(`spaces/${sid}/invites`).remove().catch(()=>{}); peopleView(); };
      screen.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
        const id=b.dataset.rm;
        if(rmConfirm!==id){ rmConfirm=id; peopleView(); return; }
        rmConfirm=null;
        await db.ref(`spaces/${sid}/access/${id}`).remove().catch(()=>{});
        await db.ref(`spaces/${sid}/profiles/${id}`).remove().catch(()=>{});
        peopleView();
      });
      const lv=$a("#leave"); if(lv) lv.onclick=async()=>{
        const w=(DATA[type]||{}).word||["Eintrag","Einträge"];
        if(lv.dataset.sure!=="1"){ lv.dataset.sure="1"; lv.textContent=`Wirklich austreten? Du nimmst alle ${w[1]} als eigene ${PAGE.noun} mit. Neue teilt ihr dann nicht mehr.`; return; }
        lv.textContent=`${w[1]} werden mitgenommen …`; lv.disabled=true;

          await db.ref(`spaces/${nid}/access/${user.uid}`).set("owner");
          await db.ref(`spaces/${nid}/meta`).set({type,owner:user.uid,createdAt:Date.now()});

            await db.ref(`spaces/${sid}/share/${user.uid}`).remove().catch(()=>{});

          await db.ref(`spaces/${sid}/meta/owners/${user.uid}`).remove().catch(()=>{});

    /* ---------- Freunde ---------- */
    let friends={}, requestsIn={}, inbox={}, friendCode=null, friendsOpen=false, frConfirm=null;
    const frBadge=()=>Object.keys(requestsIn).length+Object.keys(inbox).length;
    let chatUnread=0;
    function updateFriendBadge(){
      const n=frBadge(), b=document.getElementById("pfFriendBadge"), d=document.getElementById("pfDot"), c=document.getElementById("pfChatBadge");
      if(b){ b.textContent=n; b.hidden=!n; } if(c){ c.textContent=chatUnread; c.hidden=!chatUnread; } if(d) d.hidden=!(n||chatUnread);
      const cb=document.getElementById("oursChatN"); if(cb){ cb.textContent=chatUnread>99?"99+":chatUnread; cb.hidden=!chatUnread; }
    }
    function watchChats(){
      db.ref(`chatIndex/${user.uid}`).on("value",s=>{ const v=s.val()||{}; chatUnread=Object.values(v).reduce((a,x)=>a+(x&&+x.unread>0?+x.unread:0),0);
        updateFriendBadge(); document.dispatchEvent(new CustomEvent("ours-chat",{detail:{unread:chatUnread,index:v}})); },()=>{});
    }
    async function ensureFriendCode(){
      friendCode=(await db.ref(`users/${user.uid}/friendCode`).once("value")).val();
      if(friendCode) return;
      for(let i=0;i<5 && !friendCode;i++){
        const c=rand(8).toUpperCase().replace(/[^A-Z0-9]/g,"X");
        try{ await db.ref(`friendCodes/${c}`).set(user.uid); await db.ref(`users/${user.uid}/friendCode`).set(c); friendCode=c; }catch(e){}
      }
    }
    function watchFriends(){
      db.ref(`friends/${user.uid}`).on("value",s=>{ friends=s.val()||{}; if(friendsOpen) friendsView(); },()=>{});
      db.ref(`requests/${user.uid}`).on("value",s=>{ requestsIn=s.val()||{}; updateFriendBadge(); if(friendsOpen) friendsView(); },()=>{});
      db.ref(`inbox/${user.uid}`).on("value",s=>{ inbox=s.val()||{}; updateFriendBadge(); if(friendsOpen) friendsView(); },()=>{});
    }
    const myName=()=>profile.name||user.email.split("@")[0];
    async function sendRequest(code){
      code=String(code||"").trim().toUpperCase().replace(/^.*#FRIEND-/,"").replace(/[^A-Z0-9]/g,"");
      if(code.length<6) return {err:"Gib einen Freundescode ein. Er hat 8 Zeichen."};
      const uid=(await db.ref(`friendCodes/${code}`).once("value")).val();
      if(!uid) return {err:"Zu diesem Code gibt es niemanden. Prüf die Schreibweise."};
      if(uid===user.uid) return {err:"Das ist dein eigener Code."};
      if(friends[uid]) return {ok:`${friends[uid].name||"Diese Person"} ist schon dein Freund.`};
      if(requestsIn[uid]){ await acceptRequest(uid); return {ok:`Ihr seid jetzt befreundet.`}; }
      await db.ref(`requests/${uid}/${user.uid}`).set({name:myName(),at:Date.now()});
      return {ok:"Freundschaftsanfrage gesendet. Sobald sie angenommen ist, erscheint die Person hier."};
    }
    async function acceptRequest(from){
      const req=requestsIn[from]||{}, now=Date.now();
      await db.ref(`friends/${user.uid}/${from}`).set({name:req.name||"Freund",since:now});
      await db.ref(`friends/${from}/${user.uid}`).set({name:myName(),since:now});
      await db.ref(`requests/${user.uid}/${from}`).remove();
    }
    function friendsView(msgText,isErr){

      const base=location.href.split("#")[0].replace(/[^/]*$/,"");

      const pageOf=t=>PAGES.find(p=>p.type===(t==="swipe"?"recipes":t))||PAGES[0];
      const since=t=>new Date(t||Date.now()).toLocaleDateString("de-DE",{day:"numeric",month:"short",year:"numeric"});
      const X='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
      show("Freunde","",`
        ${inv.length?`<p class="auth-sec">Einladungen</p><div class="st-grp">${inv.map(([id,x])=>`<div class="fr-row">${avatar(x.from,x.fromName,44)}

          <button type="button" class="fr-b fill sm" data-inv-yes="${esc(id)}">Annehmen</button><button type="button" class="fr-x" data-inv-no="${esc(id)}" aria-label="Ablehnen">${X}</button></div>`).join("")}</div>`:""}
        ${reqs.length?`<p class="auth-sec">Anfragen</p><div class="st-grp">${reqs.map(([id,x])=>`<div class="fr-row">${avatar(id,x.name,44)}
          <span class="st-t"><b>${esc(x.name||"Jemand")}</b><small>möchte mit dir befreundet sein</small></span>
          <button type="button" class="fr-b fill sm" data-req-yes="${esc(id)}">Annehmen</button><button type="button" class="fr-x" data-req-no="${esc(id)}" aria-label="Ablehnen">${X}</button></div>`).join("")}</div>`:""}
        <div class="fr-share"><div class="fr-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.5" cy="8.5" r="3.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20c.7-3.7 3.3-5.8 6.5-5.8 1.6 0 3 .5 4.1 1.4M18 13v6M15 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>

          <input type="hidden" id="frLink" value="${esc(link)}"></div>
        <p class="auth-sec">Freund hinzufügen</p>
        <form class="st-grp fr-add" id="frAdd" autocomplete="off"><input type="text" id="frIn" maxlength="40" placeholder="Freundescode eingeben" aria-label="Freundescode" autocapitalize="characters"><button type="submit" id="frAddBtn">Senden</button></form>
        <p class="auth-msg${isErr?" err":""}" id="authMsg"${msgText?"":" hidden"}>${esc(msgText||"")}</p>
        <p class="auth-sec">Deine Freunde${fl.length?` · ${fl.length}`:""}</p>
        ${fl.length?`<div class="st-grp">${fl.map(([id,f])=>`<div class="fr-row">${avatar(id,f.name,44)}<span class="st-t"><b>${esc(f.name||"Freund")}</b><small>Freunde seit ${since(f.since)}</small></span>
          <button type="button" class="fr-rm${frConfirm===id?" sure":""}" data-fr-rm="${esc(id)}">${frConfirm===id?"Entfernen":"•••"}</button></div>`).join("")}</div>`
          :`<div class="st-grp"><div class="fr-empty"><b>Noch keine Freunde</b><span>Teile oben deinen Link oder gib den Code eines Freundes ein.</span></div></div>`}
        <button type="button" id="frClose" hidden>Fertig</button>`,true);
      $a("#frClose").onclick=()=>{ friendsOpen=false; frConfirm=null; hide(); };
      { const hd=screen.querySelector(".auth-head"); if(hd&&!hd.querySelector(".auth-done")){ hd.insertAdjacentHTML("beforeend",'<button type="button" class="auth-done" id="frDone">Fertig</button>'); hd.querySelector("#frDone").onclick=()=>{ friendsOpen=false; frConfirm=null; hide(); }; } }
      $a("#frShare").onclick=async()=>{ if(navigator.share){ try{ await navigator.share({title:"Ours",text:"Füg mich bei Ours als Freund hinzu – mein Code: "+(friendCode||""),url:link}); return; }catch(e){ if(e&&e.name==="AbortError") return; } } $a("#frCopy").click(); };
      $a("#frCodeBtn").onclick=async()=>{ try{ await navigator.clipboard.writeText(friendCode||""); msg("Code kopiert."); }catch(e){ msg("Dein Code: "+(friendCode||"")); } };
      $a("#frCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(link); msg("Link kopiert. Schick ihn an deine Freunde."); }catch(e){ msg("Dein Link: "+link); } };
      $a("#frAdd").onsubmit=async e=>{ e.preventDefault(); try{ const r=await sendRequest($a("#frIn").value); friendsView(r.err||r.ok,!!r.err); }catch(err){ friendsView("Das hat nicht geklappt. Prüf die Regeln in Firebase.",true); } };
      screen.querySelectorAll("[data-req-yes]").forEach(b=>b.onclick=async()=>{ try{ await acceptRequest(b.dataset.reqYes); }catch(e){ friendsView("Annehmen hat nicht geklappt.",true); } });
      screen.querySelectorAll("[data-req-no]").forEach(b=>b.onclick=()=>db.ref(`requests/${user.uid}/${b.dataset.reqNo}`).remove().catch(()=>{}));
      screen.querySelectorAll("[data-inv-no]").forEach(b=>b.onclick=()=>db.ref(`inbox/${user.uid}/${b.dataset.invNo}`).remove().catch(()=>{}));
      screen.querySelectorAll("[data-inv-yes]").forEach(b=>b.onclick=async()=>{
        const x=inbox[b.dataset.invYes]; if(!x) return; const p=pageOf(x.type);
        if(x.type==="swipe"){ friendsOpen=false; hide(); const t=`${p.file}#swipe-${x.sid}`; if(p.type===type){ history.replaceState(null,"",t); location.reload(); } else location.href=t; return; }
        await db.ref(`inbox/${user.uid}/${b.dataset.invYes}`).remove().catch(()=>{});
        const target=`${p.file}#join-${x.sid}-${x.code}`;
        if(p.type===type){ history.replaceState(null,"",target); location.reload(); } else location.href=target;
      });
      screen.querySelectorAll("[data-fr-rm]").forEach(b=>b.onclick=async()=>{
        const id=b.dataset.frRm; if(frConfirm!==id){ frConfirm=id; friendsView(); return; }
        frConfirm=null;
        await db.ref(`friends/${user.uid}/${id}`).remove().catch(()=>{});
        await db.ref(`friends/${id}/${user.uid}`).remove().catch(()=>{});
      });
    }
    // Freund direkt zu dieser Liste einladen (landet bei ihm unter "Freunde")
    async function inviteFriend(fid){
      const code=rand(20);
      await db.ref(`spaces/${sid}/invites/${code}`).set({by:user.uid,at:Date.now(),for:fid});
      await db.ref(`inbox/${fid}`).push().set({type,sid,code,from:user.uid,fromName:myName(),at:Date.now()});
    }

    /* ---------- Seite ohne Bereich: neu anlegen ---------- */
    function setupView(problem){
      hide();
      const wrap=document.querySelector(".wrap"), head=document.querySelector("header");
      if(!setupEl){ setupEl=document.createElement("div"); setupEl.className="auth-setup"; wrap.style.position="relative"; wrap.appendChild(setupEl); }
      setupEl.style.top=(head.offsetTop+head.offsetHeight)+"px";
      const cnt=document.getElementById("count"); if(cnt) cnt.textContent="";
      let oldCode=null; try{ oldCode=localStorage.getItem("dateideen.code"); }catch(e){}
      setupEl.innerHTML=`<div class="box">
        <h3>${esc(PAGE.empty)}</h3>
        ${problem?`<p class="auth-msg err">${esc(problem)}</p>`:""}
        <p class="auth-note">${esc(PAGE.hint)}</p>
        ${oldCode?`<label class="auth-check"><input type="checkbox" id="setMig" checked> Bisherige ${esc(PAGE.label)} von diesem Gerät übernehmen</label>`:""}
        <p class="auth-msg" id="authMsg" hidden></p>
        <button class="auth-btn" type="button" id="setNew">${PAGE.type==="chores"?"Neuen Haushalt anlegen":PAGE.type==="budget"?"Budget anlegen":`${esc(PAGE.noun)} anlegen`}</button>
        <p class="auth-note">Hat dich jemand eingeladen? Dann öffne einfach den Einladungslink.</p>
      </div>`;
      setupEl.hidden=false;
      setupEl.querySelector("#setNew").onclick=async()=>{
        const btn=setupEl.querySelector("#setNew"); btn.disabled=true; msg("Wird angelegt …",false,setupEl);
        const id=rand(20);
        try{
          await db.ref(`spaces/${id}/access/${user.uid}`).set("owner");
          await db.ref(`spaces/${id}/meta`).set({type,owner:user.uid,createdAt:Date.now()});
          const mig=setupEl.querySelector("#setMig");
          if(mig && mig.checked && oldCode){ msg("Bisherige Daten werden übernommen …",false,setupEl); await migrate(oldCode,id); }
          await db.ref(`users/${user.uid}/spaces/${type}`).set(id);
          ready(id);
        }catch(err){ msg("Das Anlegen hat nicht geklappt. Prüf die Internetverbindung und die Regeln in Firebase.",true,setupEl); btn.disabled=false; }
      };
    }
    // alte Daten vom geheimen Link übernehmen, nur was zu dieser Seite gehört
    async function migrate(code,id){
      if(type==="budget"){
        const b=(await db.ref(`lists/${code}/budget`).once("value")).val();
        if(b) await db.ref(`spaces/${id}`).update(b);
        return;
      }
      const out={};
      for(const k of PAGE.keys){ const v=(await db.ref(`lists/${code}/${k}`).once("value")).val(); if(v!=null) out[k]=v; }
      const ids=new Set();
      if(out.ideas) Object.values(out.ideas).forEach(i=>(Array.isArray(i.photos)?i.photos:[]).forEach(p=>ids.add(p)));
      if(out.recipes) Object.values(out.recipes).forEach(r=>{ if(r.cover) ids.add(r.cover); });
      if(ids.size){ out.photos={}; for(const p of ids){ const v=(await db.ref(`lists/${code}/photos/${p}`).once("value")).val(); if(v) out.photos[p]=v; } }
      if(Object.keys(out).length) await db.ref(`spaces/${id}`).update(out);
    }

    /* ---------- Einladung annehmen ---------- */
    // wie viele Einträge eine Liste hat (für die Frage beim Beitreten)
    async function countData(id){
      const d=DATA[type]; if(!d) return 0;
      try{ return Object.keys((await db.ref(`spaces/${id}/${d.keys[0]}`).once("value")).val()||{}).length; }catch(e){ return 0; }
    }
    async function join(j,current,mode){
      if(current && current!==j.sid && !mode){
        const n=await countData(current), d=DATA[type], w=d?d.word:["Eintrag","Einträge"];
        if(n>0){
          show(`Einladung zu ${PAGE.label}`,"",`<p class="auth-note">Du hast schon eine eigene ${esc(PAGE.noun)} mit <b>${n} ${n===1?w[0]:w[1]}</b>. Was soll damit passieren?</p>
            <button class="auth-btn" type="button" id="jYes">Mitnehmen und zusammenlegen</button>
            <p class="auth-note">Deine ${w[1]} kommen in die gemeinsame ${esc(PAGE.noun)}. Sie gehört dann euch beiden. Wenn du später austrittst, nimmst du alles mit.</p>
            <button class="auth-btn alt" type="button" id="jDrop">Nicht mitnehmen und löschen</button>
            <p class="auth-note">Du trittst ohne deine ${w[1]} bei. Deine bisherige ${esc(PAGE.noun)} wird gelöscht.</p>
            <button class="auth-link" type="button" id="jNo">Abbrechen, bei meiner bleiben</button>`);
          $a("#jYes").onclick=()=>{ $a("#jYes").disabled=true; $a("#jYes").textContent="Wird zusammengelegt …"; join(j,current,"merge"); };
          $a("#jDrop").onclick=()=>{ const b=$a("#jDrop"); if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent=`Wirklich löschen? ${n} ${n===1?w[0]:w[1]} gehen verloren.`; return; }
            b.disabled=true; join(j,current,"drop"); };
          $a("#jNo").onclick=()=>{ clearHash(); hide(); open(current); };
          return;
        }
        mode="drop";   // eigene Liste ist leer: einfach wechseln
      }
      try{
        await db.ref(`spaces/${j.sid}/access/${user.uid}`).set(j.code);
        await db.ref(`spaces/${j.sid}/meta/owners/${user.uid}`).set(true).catch(()=>{});   // gehört dann allen gemeinsam
        if(current && current!==j.sid){
          if(mode==="merge") await copyData(current,j.sid);
          // alte Liste aufräumen: löschen, wenn sonst niemand drin war, sonst nur selbst austreten
          try{ const acc=(await db.ref(`spaces/${current}/access`).once("value")).val()||{};
            if(Object.keys(acc).length<=1) await db.ref(`spaces/${current}`).remove();
            else { await db.ref(`spaces/${current}/profiles/${user.uid}`).remove(); await db.ref(`spaces/${current}/meta/owners/${user.uid}`).remove().catch(()=>{}); await db.ref(`spaces/${current}/access/${user.uid}`).remove(); } }catch(e){}
        }
        await db.ref(`users/${user.uid}/spaces/${type}`).set(j.sid);
        await db.ref(`spaces/${j.sid}/invites/${j.code}`).remove().catch(()=>{});   // Link gilt nur einmal
        clearHash(); ready(j.sid);
      }catch(err){ clearHash(); if(current) open(current); else setupView("Der Einladungslink ist ungültig oder wurde zurückgezogen."); }
    }
    let confirm_=false;
    // Alle Daten dieser Seite samt Fotos von einer Liste in eine andere kopieren (Vorhandenes bleibt)
    async function copyData(from,to){
      const d=DATA[type]; if(!d) return;
      const photos=new Set();
      for(const key of d.keys){
        const src=(await db.ref(`spaces/${from}/${key}`).once("value")).val(); if(!src) continue;
        const dst=(await db.ref(`spaces/${to}/${key}`).once("value")).val()||{};
        const out={};
        if(key==="week"){   // Gym-Wochenplan: Übungen je Tag zusammenführen
          const A=Array.isArray(src)?Object.assign({},src):src, B=Array.isArray(dst)?Object.assign({},dst):dst;
          for(const [day,v] of Object.entries(A)){ if(!v) continue; const b=B[day];
            if(!b) out[day]=v; else out[day]={title:b.title||v.title||null,ex:[...new Set([...(b.ex||[]),...(v.ex||[])])]}; }
        }else if(key==="log"){   // abgehakte Übungen je Datum zusammenführen
          for(const [day,v] of Object.entries(src)) out[day]={...(v||{}),...(dst[day]||{})};
        }else if(key==="rooms"||key==="cats"){   // eigene Namen: doppelte weglassen
          const have=new Set(Object.values(dst));
          for(const [k,v] of Object.entries(src)) if(!have.has(v) && !dst[k]) out[k]=v;
        }else{
          for(const [k,v] of Object.entries(src)){ if(dst[k] || !v) continue; out[k]=v;
            if(v.cover && /^[0-9a-f]{32}$/.test(v.cover)) photos.add(v.cover);
            if(Array.isArray(v.photos)) v.photos.forEach(p=>{ if(/^[0-9a-f]{32}$/.test(p)) photos.add(p); }); }
        }
        if(Object.keys(out).length) await db.ref(`spaces/${to}/${key}`).update(out);
      }
      for(const p of photos){ const ph=(await db.ref(`spaces/${from}/photos/${p}`).once("value")).val(); if(ph) await db.ref(`spaces/${to}/photos/${p}`).set(ph); }
    }

    async function open(id){
      try{ await db.ref(`spaces/${id}/meta`).once("value"); ready(id); }
      catch(err){ await db.ref(`users/${user.uid}/spaces/${type}`).remove().catch(()=>{}); setupView("Du hast keinen Zugriff mehr auf diese Liste. Leg eine neue an oder lass dich wieder einladen."); }
    }
    function ready(id){
      sid=id; hide(); if(setupEl) setupEl.hidden=true; updateMenu();
      db.ref(`spaces/${id}/profiles/${user.uid}`).update({name:profile.name||user.email.split("@")[0],email:user.email}).catch(()=>{});
      if(started) return; started=true;
      cb(db.ref("spaces/"+id),{uid:user.uid,sid:id,email:user.email,name:profile.name});
    }

    auth.onAuthStateChanged(async u=>{
      if(!u){ if(user){ location.reload(); return; } loginView(parseJoin()||/^#friend-/.test(location.hash)?"register":"login"); return; }
      user=u;
      if(bootT) clearTimeout(bootT); bootT=setTimeout(()=>{ bootT=null; if(!started) show(PAGE.label,"",`<p class="auth-note">Lädt …</p>`); },1500);
      try{
        pubDb=db;
        profile=(await db.ref(`users/${u.uid}/profile`).once("value")).val()||{};
        if(!profile.name){
          let n=""; try{ n=sessionStorage.getItem("auth.newName")||""; sessionStorage.removeItem("auth.newName"); }catch(e){}
          profile.name=n||u.displayName||u.email.split("@")[0];
          await db.ref(`users/${u.uid}/profile/name`).set(profile.name);
        }
        try{ const pb=(await db.ref(`pub/${u.uid}`).once("value")).val()||{}; pubCache.set(u.uid,pb);
          if(pb.name!==profile.name) await db.ref(`pub/${u.uid}/name`).set(profile.name); pubCache.get(u.uid).name=profile.name; }catch(e){}
        window.Auth._profileView=profileView; window.Auth.me=u.uid;
        installMenu();
        db.ref(`users/${u.uid}/settings`).on("value",s=>{ const v=s.val()||{};
          Object.entries(KC_KEY).forEach(([t,k])=>applyKcal(t,typeof v[k]==="boolean"?v[k]:v.kcal===true));
          if(v.theme&&window.OursTheme&&v.theme!==OursTheme.pref) OursTheme.set(v.theme,false); OursPush._load(v.push); },()=>{});
        try{ await ensureFriendCode(); watchFriends(); watchChats(); }catch(e){}
        const fr=location.hash.match(/^#friend-([A-Za-z0-9]{6,12})$/);
        if(fr){ clearHash(); setTimeout(async()=>{ let r; try{ r=await sendRequest(fr[1]); }catch(e){ r={err:"Die Anfrage hat nicht geklappt."}; } friendsView(r.err||r.ok,!!r.err); },400); }
        if(PAGE.noSpace){ hide(); updateMenu(); if(!started){ started=true; cb(null,{uid:u.uid,email:u.email,name:profile.name,db}); } return; }
        const current=(await db.ref(`users/${u.uid}/spaces/${type}`).once("value")).val();
        const j=parseJoin();
        if(j){ await join(j,current); return; }
        if(current){ await open(current); return; }
        setupView();
      }catch(err){
        show(PAGE.label,"",`<p class="auth-msg err">Die Daten konnten nicht geladen werden. Prüf die Internetverbindung und die Regeln in Firebase.</p>
          <button class="auth-btn" type="button" onclick="location.reload()">Neu laden</button>
          <button class="auth-link" type="button" id="authOut">Abmelden</button>`);
        $a("#authOut").onclick=()=>auth.signOut();
      }
    });
  }};
})();
</script>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const firebaseConfig = {
  apiKey: "AIzaSyD6JNwGczfmHYTqHp9qI5bnutz-JLphgGI",
  authDomain: "oursapp-ff4cf.firebaseapp.com",
  databaseURL: "https://oursapp-ff4cf-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "oursapp-ff4cf",
  storageBucket: "oursapp-ff4cf.firebasestorage.app",
  messagingSenderId: "509984933255",
  appId: "1:509984933255:web:1f2e8b0850c94056f87f22"
};

let db=null, me=null, myName="Ich", index={}, friends={}, picking=false, cur=null, msgs=[], readAt={}, msgRef=null, readRef=null;
const cidOf=(a,b)=>[a,b].sort().join("_");
const av=(uid,name,size)=>Auth.avatar(uid,name,size);
const nameOf=(uid,fallback)=>{ const p=Auth.pub(uid); return (p&&p.name)||(friends[uid]&&friends[uid].name)||fallback||"Freund"; };
const CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12.5l4 4 7.5-8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHECK2='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12.5l4 4 7.5-8.5M10 15l1.5 1.5L19 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function showErr(e){ $("#status").textContent=/permission/i.test(String(e&&(e.code||e.message)))?"Keine Berechtigung. Prüf die Regeln in Firebase.":"Das hat nicht geklappt. Prüf die Internetverbindung."; }

/* ---------- Zeiten ---------- */
const sameDay=(a,b)=>a.toDateString()===b.toDateString();
function dayLabel(t){ const d=new Date(t), n=new Date(), y=new Date(Date.now()-864e5);
  if(sameDay(d,n)) return "Heute"; if(sameDay(d,y)) return "Gestern";
  return d.toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short",year:d.getFullYear()===n.getFullYear()?undefined:"numeric"}); }
const clock=t=>new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
function listTime(t){ const d=new Date(t), n=new Date(); if(sameDay(d,n)) return clock(t); if(sameDay(d,new Date(Date.now()-864e5))) return "Gestern";
  return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"}); }
const linkify=t=>esc(t).replace(/https:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);

/* ---------- Liste ---------- */
function renderList(){
  $("#newChat").textContent=picking?"Abbrechen":"+ Neuer Chat";
  $("#listTitle").textContent=picking?"Freund wählen":"Unterhaltungen";
  if(picking){
    const fl=Object.entries(friends).sort((a,b)=>nameOf(a[0],a[1].name).localeCompare(nameOf(b[0],b[1].name)));
    $("#list").innerHTML=fl.length?`<ul class="clist">${fl.map(([id,f])=>`<li><button type="button" class="crow" data-with="${esc(id)}">${av(id,f.name,48)}
        <span class="cmain"><span class="ctop"><b>${esc(nameOf(id,f.name))}</b></span><span class="cbot"><span>${esc((Auth.pub(id)||{}).bio||"Tippen, um zu schreiben")}</span></span></span></button></li>`).join("")}</ul>`
      :`<div class="empty"><strong>Noch keine Freunde</strong><span>Füg über den Profil-Knopf oben rechts unter „Freunde“ jemanden hinzu. Dann könnt ihr hier schreiben.</span></div>`;
    return;
  }
  const rows=Object.entries(index).filter(([,x])=>x&&x.with).sort((a,b)=>(b[1].at||0)-(a[1].at||0));
  $("#list").innerHTML=rows.length?`<ul class="clist">${rows.map(([cid,x])=>{ const n=+x.unread||0;
      return `<li><button type="button" class="crow" data-with="${esc(x.with)}">${av(x.with,x.name,50)}
        <span class="cmain"><span class="ctop"><b>${esc(nameOf(x.with,x.name))}</b><time class="${n?"new":""}">${x.at?listTime(x.at):""}</time></span>
        <span class="cbot"><span>${x.lastBy===me?"Du: ":""}${esc(x.last||"")}</span>${n?`<span class="unread">${n>99?"99+":n}</span>`:""}</span></span></button></li>`; }).join("")}</ul>`
    :`<div class="empty"><strong>Noch keine Chats</strong><span>Tipp auf „+ Neuer Chat“ und such dir einen Freund aus. Oder öffne im Rezepte-Bereich das Profil eines Freundes und tipp auf „Nachricht“.</span></div>`;
}
$("#newChat").addEventListener("click",()=>{ picking=!picking; renderList(); });
document.addEventListener("click",e=>{ const r=e.target.closest("[data-with]"); if(r) openTalk(r.dataset.with); });

/* ---------- Unterhaltung ---------- */
function openTalk(uid,replace){
  if(!uid || uid===me) return;
  picking=false; cur={uid,cid:cidOf(me,uid)};
  if(replace) history.replaceState({talk:uid},"",location.pathname); else history.pushState({talk:uid},"",location.pathname);
  $("#wrap").classList.add("talking"); $("#listView").hidden=true; $("#talkView").hidden=false;
  const x=index[cur.cid]||{};
  $("#talkWho").innerHTML=`${av(uid,x.name||(friends[uid]||{}).name,38)}<span><b>${esc(nameOf(uid,x.name))}</b><small>${friends[uid]?"Freund":"nicht mehr befreundet"}</small></span>`;
  msgs=[]; readAt={}; renderMsgs(true);
  if(msgRef) msgRef.off(); if(readRef) readRef.off();
  const base=db.ref(`chats/${cur.cid}`);
  msgRef=base.child("messages"); const q=msgRef.limitToLast?msgRef.limitToLast(400):msgRef;
  q.on("value",s=>{ const v=s.val()||{}; msgs=Object.entries(v).map(([id,m])=>({id,...m})).filter(m=>m&&m.text).sort((a,b)=>a.at-b.at); renderMsgs(); markRead(); },showErr);
  readRef=base.child("read"); readRef.on("value",s=>{ readAt=s.val()||{}; renderMsgs(); },()=>{});
  msgRef=q;
  setTimeout(()=>{ if(matchMedia("(pointer:fine)").matches) $("#msgIn").focus(); },50);
}
function closeTalk(){
  if(msgRef) msgRef.off(); if(readRef) readRef.off(); msgRef=readRef=null; cur=null;
  $("#wrap").classList.remove("talking"); $("#talkView").hidden=true; $("#listView").hidden=false; renderList();
}
$("#talkBack").addEventListener("click",()=>{ if(history.state&&history.state.talk) history.back(); else closeTalk(); });
addEventListener("popstate",e=>{ if(e.state&&e.state.talk) openTalk(e.state.talk,true); else if(cur) closeTalk(); });
function markRead(){
  if(!cur || document.hidden) return;
  const last=msgs.length?msgs[msgs.length-1].at:0;
  if(last && (readAt[me]||0)<last){ readAt[me]=last; db.ref(`chats/${cur.cid}/read/${me}`).set(last).catch(()=>{}); }
  if(index[cur.cid] && +index[cur.cid].unread){ index[cur.cid].unread=0; db.ref(`chatIndex/${me}/${cur.cid}/unread`).set(0).catch(()=>{}); }
}
document.addEventListener("visibilitychange",markRead);
function renderMsgs(jump){
  if(!cur) return;
  const box=$("#msgs"), atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  if(!msgs.length){ box.innerHTML=`<p class="hello">Schreib ${esc(nameOf(cur.uid))} die erste Nachricht.</p>`; return; }
  const seen=readAt[cur.uid]||0; let html="", prev=null;
  msgs.forEach(m=>{
    if(!prev || !sameDay(new Date(prev.at),new Date(m.at))) html+=`<div class="day">${dayLabel(m.at)}</div>`;
    const mine=m.by===me, cont=prev && prev.by===m.by && sameDay(new Date(prev.at),new Date(m.at)) && m.at-prev.at<5*60e3;
    html+=`<div class="msg ${mine?"mine":"theirs"}${cont?" cont":""}">${linkify(m.text)}<span class="meta">${clock(m.at)}${mine?`<span class="${m.at<=seen?"read":""}" aria-label="${m.at<=seen?"gelesen":"gesendet"}">${m.at<=seen?CHECK2:CHECK}</span>`:""}</span></div>`;
    prev=m;
  });
  box.innerHTML=html;
  if(jump || atEnd) box.scrollTop=box.scrollHeight;
}
const msgIn=$("#msgIn");
const grow=()=>{ msgIn.style.height="auto"; msgIn.style.height=Math.min(140,msgIn.scrollHeight)+"px"; $("#sendBtn").disabled=!msgIn.value.trim(); };
msgIn.addEventListener("input",grow);
msgIn.addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.shiftKey && matchMedia("(pointer:fine)").matches){ e.preventDefault(); $("#composer").requestSubmit(); } });
$("#composer").addEventListener("submit",async e=>{
  e.preventDefault(); if(!cur) return;
  const text=msgIn.value.trim().slice(0,2000); if(!text) return;
  msgIn.value=""; grow();
  const at=Date.now(), c=cur, last=text.replace(/\s+/g," ").slice(0,80);
  try{
    await db.ref(`chats/${c.cid}/messages`).push().set({by:me,text,at});
    await db.ref(`chatIndex/${me}/${c.cid}`).update({with:c.uid,name:nameOf(c.uid,(index[c.cid]||{}).name),last,lastBy:me,at,unread:0});
    const inc=firebase.database.ServerValue&&firebase.database.ServerValue.increment?firebase.database.ServerValue.increment(1):1;
    await db.ref(`chatIndex/${c.uid}/${c.cid}`).update({with:me,name:myName,last,lastBy:me,at,unread:inc});
  }catch(err){ msgIn.value=text; grow(); showErr(err); }
});

/* ---------- Start ---------- */
Auth.start(firebaseConfig,"chat",(r,info)=>{
  if(!info){ $("#status").textContent="Die Verbindung hat nicht geklappt. Lade die Seite neu."; return; }
  db=info.db||firebase.database(); me=info.uid; myName=info.name||"Ich";
  const want=(location.hash.match(/^#with-([A-Za-z0-9_-]{6,64})$/)||[])[1];
  history.replaceState(null,"",location.pathname);
  db.ref(`friends/${me}`).on("value",s=>{ friends=s.val()||{}; if(!cur) renderList(); },()=>{});
  db.ref(`chatIndex/${me}`).on("value",s=>{ index=s.val()||{}; if(!cur) renderList(); else markRead(); },err=>showErr(err));
  renderList();
  if(want) openTalk(want);
});
document.addEventListener("ours-pub",()=>{ if(!cur) renderList(); });
</script>
