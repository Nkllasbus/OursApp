<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ours · Kalender</title>
<link rel="icon" href="ours-logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--band:#4f7a5a;--ink:#1d1d22;--muted:#6b6b75;--bg:#f3efe9}
@media (prefers-color-scheme:dark){:root{--ink:#f1f0f4;--muted:#a3a3ad;--bg:#16161a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;padding:24px}
main{max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.ic{width:84px;height:84px;border-radius:24px;background:var(--band);display:grid;place-items:center;font-size:2.4rem}
h1{margin:0;font-family:Gloock,Georgia,serif;font-weight:400;font-size:2.2rem}
p{margin:0;color:var(--muted);line-height:1.5}
a{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<main>
  <div class="ic" aria-hidden="true">📅</div>
  <h1>Kalender</h1>
  <p>Gemeinsame Termine, Gym-Trainings und Dateideen an einem Ort – synchron mit dem Kalender auf deinem iPhone.</p>
  <p><b>Kommt bald.</b></p>
  <a href="index.html">Zurück zu Ours</a>
</main>
</body>
</html>
