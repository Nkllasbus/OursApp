<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ours · Kalender</title>
<link rel="icon" href="ours-logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ours">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Kalender: gemeinsame Termine + Gym, Dateideen, Verträge und Käufe */
:root{--page:#f2f2f7;--band:#2f6b4f;--on-band:#fff;--on-band-muted:#c3dccf;--bg:#ffffff;--surface:#ffffff;--surface2:#f2f2f7;--ink:#111;--muted:#8a8a8e;--line:#e5e5ea;--shadow:rgba(0,0,0,.08);
  --accent:#2f6b4f;--accent-soft:#e6f2ec;--logo-bg:#22513b;--body:"Inter",system-ui,-apple-system,sans-serif;--minus:#cf4b42;--plus:#1f9d55;color-scheme:light;
  --grouped:#f2f2f7;--cell:#ffffff;--sep:#d8d8dc;--red:#cf4b42;
  --c-ev:#2f6b4f;--c-gym:#3c4270;--c-date:#8c7559;--c-con:#123354;--c-buy:#8a8f99;--c-trip:#1d6a7a}
@media (prefers-color-scheme:dark){:root{--page:#000;--band:#1f4a36;--bg:#000;--surface:#1c1c1e;--surface2:#1c1c1e;--ink:#f2f2f7;--muted:#8e8e93;--line:#2c2c2e;--shadow:rgba(0,0,0,.6);--accent:#5fbf8f;--accent-soft:#1f3a2d;--logo-bg:#173828;color-scheme:dark;
  --grouped:#000;--cell:#1c1c1e;--sep:#38383a;--red:#ff453a;--c-ev:#4fae80;--c-gym:#7d84c9;--c-date:#c4a27a;--c-con:#5b8fd1;--c-buy:#8a8f99;--c-trip:#4fb3c6}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--body);background:var(--page)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative;padding:0 16px}
@media (min-width:661px){.wrap{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
header{flex:none;margin:0 -16px;background:var(--band);color:var(--on-band);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;background:var(--bg);border-radius:14px 14px 0 0}
header.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(12px + env(safe-area-inset-top,0px)) 64px 25px!important;overflow:visible;z-index:30}
header.brand .wordmark{font-weight:800;letter-spacing:-.02em;font-size:clamp(2.1rem,9.5vw,2.7rem);line-height:1;color:var(--on-band);white-space:nowrap}
header.brand .pf-btn{top:calc(50% - 27px + env(safe-area-inset-top,0px) / 2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.status{flex:none;font-size:.82rem;color:var(--muted);padding:4px 0}
.status:empty{display:none}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.bar{flex:none;display:flex;align-items:center;gap:8px;padding-top:8px}
.bar h2{flex:1;margin:0;font-size:1.2rem;font-weight:700;text-align:center}
.nav{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem}
.today-btn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:.82rem;font-weight:600}
.seg{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:6px;font-size:.84rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.filters{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fl{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.fl i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.fl[aria-pressed="true"]{color:var(--ink);border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -16px;padding:2px 16px 100px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 6px;box-shadow:0 1px 2px var(--shadow)}
.dow{text-align:center;font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;padding-bottom:4px}
.day{position:relative;border:0;background:none;border-radius:10px;min-height:50px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink)}
.day .n{font-size:.88rem;font-weight:600;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.out{opacity:.35}
.day.today .n{background:var(--accent);color:#fff}
.day.sel{background:var(--accent-soft)}
.day .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:34px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.day .amt{font-size:.58rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.agenda{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.ag-h{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 2px}
.ag-h b{font-size:.95rem}
.ag-h small{font-size:.78rem;color:var(--muted)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:9px 12px;color:var(--ink);box-shadow:0 1px 2px var(--shadow);text-decoration:none}
.item .t{flex:none;width:44px;font-size:.78rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.item .m{flex:1;min-width:0;display:flex;flex-direction:column}
.item .m b{font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m small{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{flex:none;font-weight:700;font-size:.86rem;font-variant-numeric:tabular-nums}
.item.done{opacity:.6}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted);font-size:.86rem}
/* iPhone-ähnliche Ansichten */
.ibar{flex:none;display:flex;align-items:center;gap:8px;padding-top:8px}
.ibar .sp{flex:1}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;box-shadow:0 1px 3px var(--shadow)}
.back{display:inline-flex;align-items:center;gap:6px;padding:7px 14px 7px 10px;font-size:.95rem}
.back span{font-size:1.3rem;line-height:1;color:var(--accent)}
.back b{font-weight:600}
.grp{display:flex;align-items:center;padding:2px}
.grp button{border:0;background:none;width:40px;height:36px;display:grid;place-items:center;border-radius:999px;color:var(--ink)}
.grp button svg{width:20px;height:20px}
.grp button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.big{flex:none;margin:4px 2px 0;font-size:2rem;font-weight:800;letter-spacing:-.02em}
.dowrow{flex:none;display:grid;grid-template-columns:repeat(7,1fr);font-size:.72rem;font-weight:700;color:var(--muted);text-align:center;border-bottom:1px solid var(--line);padding-bottom:6px}
.dowrow:empty{display:none}
.scroll{touch-action:pan-y}
.todaypill{position:absolute;left:var(--chat-x,16px);bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 88px);z-index:6;padding:9px 18px;font-weight:600;font-size:.95rem}
/* Woche: Wochen untereinander */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);height:var(--wkH,300px);padding:6px 0 8px;box-sizing:border-box;overflow:hidden}
.wd{overflow:hidden}
.mlabel{font-size:1rem;font-weight:800;margin:0;padding:8px 2px 0;height:0;overflow:visible;position:relative;top:-2px;color:var(--accent);pointer-events:none}
.wd{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0;padding:0 2px;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer}
.wd .dn{align-self:center;font-size:1.3rem;font-weight:600;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;margin:4px 0 6px}
.wd.we .dn{color:var(--muted)}
.wd.today .dn{background:#cf4b42;color:#fff}
.wd.past{opacity:.8}
.chipev{display:block;font-size:.66rem;font-weight:600;line-height:1.2;border-radius:6px;padding:2px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.chipev.timed{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;border-left:3px solid var(--c);border-radius:4px;padding:3px 4px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.chipev small{display:block;font-weight:500;opacity:.8}
.chipev.done{opacity:.55;text-decoration:line-through}
.msum{display:block;font-size:.66rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;border-radius:6px;padding:1px 2px;margin-top:1px}
.msum.out{color:var(--minus);background:color-mix(in srgb,var(--minus) 10%,transparent)}
.msum.in{color:var(--plus);background:color-mix(in srgb,var(--plus) 12%,transparent)}
.md .msum{font-size:.58rem;padding:0 2px;background:none}
.daysum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.daysum span{flex:1;min-width:100px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.daysum b{font-size:.95rem;color:var(--ink);font-variant-numeric:tabular-nums}
.daysum b.o{color:var(--minus)} .daysum b.i{color:var(--plus)}
.budnote{flex:none;display:block;background:color-mix(in srgb,var(--c-con) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c-con) 30%,var(--line));border-radius:12px;padding:9px 12px;font-size:.82rem;color:var(--ink);text-decoration:none}
.more{font-size:.62rem;color:var(--muted);text-align:center}
/* Tag: Stundenleiste */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.dayhead button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;font-size:1.1rem;color:var(--ink)}
.dayhead b{font-size:1rem}
.allday{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.timeline{position:relative;height:calc(var(--hpx,48px) * 24);border-top:1px solid var(--line)}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:.68rem;color:var(--muted)}
.hr span{position:absolute;top:-8px;left:0;background:var(--bg);padding-right:6px}
.tev{position:absolute;left:46px;right:4px;border-radius:8px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surface));padding:4px 8px;font-size:.8rem;overflow:hidden;color:var(--ink);text-align:left;border-top:0;border-right:0;border-bottom:0}
.tev b{display:block;font-weight:600}
.tev small{color:var(--muted)}
.nowline{position:absolute;left:40px;right:0;border-top:2px solid #cf4b42}
.nowline::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:#cf4b42}
/* Monat (rausgezoomt) */
.mon{margin-bottom:6px}
.mon h3{margin:8px 2px 4px;font-size:1.15rem;font-weight:800;color:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.md{border:0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;height:var(--mdH,64px);border-top:1px solid var(--line);overflow:hidden}
.md .n{font-size:.95rem;font-weight:600;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.md.today .n{background:#cf4b42;color:#fff}
.md .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:34px}
.md .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.md.blank{border-top:0}
/* Jahr */
.yr{height:var(--yrH,auto);display:flex;flex-direction:column}
.yr h3{margin:6px 2px 4px;font-size:1.5rem;font-weight:800;color:#cf4b42;flex:none}
.ygrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:6px 10px;margin-bottom:8px;min-height:0}
.ym{border:0;background:none;color:var(--ink);text-align:left;padding:0}
.ym{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ym b{display:block;font-size:.9rem;font-weight:700;margin-bottom:2px}
.ym b.cur{color:#cf4b42}
.ymg{display:grid;grid-template-columns:repeat(7,1fr);gap:0 1px;font-size:var(--ymF,.55rem);line-height:1.5;text-align:center;color:var(--ink)}
.ymg span.t{background:#cf4b42;color:#fff;border-radius:50%}
.ymg span.o{visibility:hidden}
#list.zin{animation:zin .24s ease}
#list.zout{animation:zout .24s ease}
@keyframes zin{from{opacity:.25;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes zout{from{opacity:.25;transform:scale(1.08)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#list.zin,#list.zout{animation:none}}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:150px;z-index:9;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 12px;font-size:.8rem;box-shadow:0 8px 20px rgba(0,0,0,.3);max-width:280px;text-align:center}
/* Bogen im Apple-Stil */
.sheet.ios{background:var(--grouped);padding:0 16px 22px;gap:0;max-width:460px;border-radius:14px}
.sheet.ios>*{flex-shrink:0}
.ihead{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 0 10px;background:var(--grouped)}
.ihead b{font-size:1rem;font-weight:700;text-align:center;white-space:nowrap}
.ib{border:0;background:none;color:var(--accent);font-size:1rem;padding:4px 0;text-align:left;white-space:nowrap}
.ib:last-child{text-align:right}
.ib.strong{font-weight:700}
.ib[disabled]{color:var(--muted);opacity:.6}
.igrp{background:var(--cell);border-radius:12px;overflow:hidden;margin:0 0 18px;display:flex;flex-direction:column}
.cell{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:10px 14px;border:0;background:none;color:var(--ink);font:inherit;font-size:1rem;text-align:left;width:100%;position:relative}
.cell+.cell::before{content:"";position:absolute;left:14px;right:0;top:0;border-top:.5px solid var(--sep)}
.cell.inp{outline:none}
.cell.inp::placeholder{color:var(--muted)}
.cell.note{min-height:110px;resize:vertical;line-height:1.4}
.cell.col{flex-direction:column;align-items:flex-start;gap:4px}
.cell .cv{color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.cell .cv i{font-style:normal;font-size:1.2rem;color:var(--sep)}
.cell .chk{color:var(--accent);font-weight:700}
.cell.danger{color:var(--red);justify-content:center}
.cell .sub,.sub{color:var(--muted);font-size:.84rem;display:block}
.cdot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px}
.dt{display:flex;gap:6px;min-width:0}
.dt input[type=date]{width:134px}
.dt input[type=time]{width:92px}
.dt input{min-width:0}
.dt input{border:0;background:var(--surface2);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-size:.92rem}
.sheet.ios .dt input{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tgl{position:relative;width:51px;height:31px;flex:none}
.tgl input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.tgl i{position:absolute;inset:0;border-radius:999px;background:color-mix(in srgb,var(--ink) 16%,transparent);transition:background .2s}
.tgl i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.tgl input:checked+i{background:#34c759}
.tgl input:checked+i::after{transform:translateX(20px)}
.segc{gap:4px;justify-content:stretch;background:none}
.segc button{flex:1;border:0;border-radius:8px;padding:7px 2px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink);font:inherit;font-size:.82rem;font-weight:600}
.segc button[aria-pressed="true"]{background:var(--accent);color:#fff}
.step{display:inline-flex;align-items:center;gap:10px}
.step button{width:32px;height:32px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);font-size:1.1rem}
.step b{min-width:92px;text-align:center;font-weight:600}
.wdays{justify-content:space-between}
.wdays button{width:38px;height:38px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink);font:inherit;font-weight:600;font-size:.82rem}
.wdays button[aria-pressed="true"]{background:var(--accent);color:#fff}
.ifoot{margin:-10px 4px 18px;font-size:.82rem;color:var(--muted)}
.evd{padding:4px 2px 14px}
.evd h3{margin:0 0 4px;font-size:1.5rem;font-weight:800;border-left:4px solid var(--c);padding-left:10px}
.evd p{margin:8px 0 0;font-size:.95rem}
.fab{position:absolute;z-index:6;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(0,0,0,.5);
  right:var(--chat-x,16px);bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 22px)}
.fab svg{width:26px;height:26px}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,20,15,.5);padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:440px;max-height:100%;overflow-y:auto;background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.sheet>*{flex-shrink:0}
.sheet h3{margin:0;font-size:1.3rem;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.flabel{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sheet input[type=text],.sheet input[type=date],.sheet input[type=time],.sheet textarea,.sheet select{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.sheet textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:.84rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.csw{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--c);padding:0}
.csw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.chk{display:flex;align-items:center;gap:10px;font-size:.9rem}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:8px}
.actions .right{display:flex;gap:8px;margin-left:auto}
.btn{background:var(--surface2);color:var(--ink);border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--accent);color:#fff}
.ghost{background:none;border:0;color:var(--muted);padding:8px 4px}

    /* ---------- Personen und Einladungen für diese Seite ---------- */
    let rmConfirm=null;
    async function peopleView(){

      let profiles={}, access={}, meta={}, invites={};

        [profiles,access,meta,invites]=(await Promise.all(["profiles","access","meta","invites"].map(k=>db.ref(`spaces/${sid}/${k}`).once("value")))).map(s=>s.val()||{});
      }catch(err){ return; }
      const coOwn=id=>meta.owner===id || (meta.owners&&meta.owners[id]);
      const owner=!!coOwn(user.uid), ids=Object.keys(access);
      const list=ids.map(id=>({id,name:(profiles[id]&&profiles[id].name)||"Ohne Namen",mail:profiles[id]&&profiles[id].email||"",own:!!coOwn(id)}))
        .sort((a,b)=>(b.own-a.own)||(a.id===user.uid?-1:b.id===user.uid?1:0));

        `<ul class="auth-people">${list.map(p=>`<li>${avatar(p.id,p.name,30)}
            <span class="nm"><b>${esc(p.name)}${p.id===user.uid?" (du)":""}</b><small>${p.own?(type==="recipes"&&ids.length>1?"Besitzer":"Hat die Liste angelegt"):esc(p.mail)}</small></span>
            ${owner&&p.id!==user.uid?`<button type="button" class="rm${rmConfirm===p.id?" sure":""}" data-rm="${esc(p.id)}">${rmConfirm===p.id?"Entfernen?":"Entfernen"}</button>`:""}</li>`).join("")}</ul>
        ${type==="gym"?`<p class="auth-note">Dein Gymplan gehört nur dir. Deine Freunde können ihn im Gym unter „Freunde“ ansehen und Workouts kopieren, aber nichts ändern.</p>`:""}
        <div${type==="gym"?" hidden":""}>
        ${(()=>{ const fl=Object.entries(friends).filter(([id])=>!access[id]); return fl.length?`<p class="auth-sec">Freunde einladen</p>
          <ul class="auth-people">${fl.map(([id,f])=>`<li>${avatar(id,f.name,30)}<span class="nm"><b>${esc(f.name||"Freund")}</b><small>bekommt die Einladung unter „Freunde“</small></span>
          <button type="button" class="rm yes" data-fr-inv="${esc(id)}">Einladen</button></li>`).join("")}</ul>`:""; })()}
        <p class="auth-sec">Per Link einladen</p>
        <p class="auth-note">Der Link gilt nur für ${esc(PAGE.label)} und nur für eine Person. Wer ihn öffnet, tritt mit eigenem Konto bei. Deine anderen Seiten sieht die Person nicht.</p>
        <button class="auth-btn" type="button" id="invNew">Einladungslink erstellen</button>
        <div class="auth-copy" id="invBox" hidden><input type="text" id="invLink" readonly aria-label="Einladungslink"><button class="auth-btn" type="button" id="invCopy">Kopieren</button></div>
        </div>
        <p class="auth-msg" id="authMsg" hidden></p>
        ${nInv?`<button class="auth-link" type="button" id="invRevoke">${nInv} offene${nInv===1?"r Link":" Links"} · alle zurückziehen</button>`:""}
        ${ids.length>1&&DATA[type]?`<button class="auth-link danger" type="button" id="leave">Austreten und alles mitnehmen</button>`:""}
        <button class="auth-btn alt" type="button" id="ppClose">Fertig</button>`,true);
      $a("#ppClose").onclick=()=>{ rmConfirm=null; hide(); };
      $a("#invNew").onclick=async()=>{
        const code=rand(20);
        try{
          await db.ref(`spaces/${sid}/invites/${code}`).set({by:user.uid,at:Date.now()});
          const base=location.href.split("#")[0].replace(/[^/]*$/,"");
          $a("#invLink").value=`${base}${PAGE.file}#join-${sid}-${code}`; $a("#invBox").hidden=false; msg("");
        }catch(err){ msg("Der Link konnte nicht erstellt werden.",true); }
      };
      $a("#invCopy").onclick=async()=>{
        try{ await navigator.clipboard.writeText($a("#invLink").value); msg("Kopiert. Jetzt per WhatsApp oder Mail verschicken."); }
        catch(e){ $a("#invLink").select(); msg("Markiert. Jetzt kopieren und verschicken."); }
      };
      screen.querySelectorAll("[data-fr-inv]").forEach(b=>b.onclick=async()=>{
        b.disabled=true; b.textContent="…";
        try{ await inviteFriend(b.dataset.frInv); b.textContent="Eingeladen ✓"; b.classList.remove("yes"); b.classList.add("done"); }
        catch(err){ b.disabled=false; b.textContent="Einladen"; msg("Die Einladung hat nicht geklappt. Prüf die Regeln in Firebase.",true); }
      });
      const rv=$a("#invRevoke"); if(rv) rv.onclick=async()=>{ await db.ref(`spaces/${sid}/invites`).remove().catch(()=>{}); peopleView(); };
      screen.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
        const id=b.dataset.rm;
        if(rmConfirm!==id){ rmConfirm=id; peopleView(); return; }
        rmConfirm=null;
        await db.ref(`spaces/${sid}/access/${id}`).remove().catch(()=>{});
        await db.ref(`spaces/${sid}/profiles/${id}`).remove().catch(()=>{});
        peopleView();
      });
      const lv=$a("#leave"); if(lv) lv.onclick=async()=>{
        const w=(DATA[type]||{}).word||["Eintrag","Einträge"];
        if(lv.dataset.sure!=="1"){ lv.dataset.sure="1"; lv.textContent=`Wirklich austreten? Du nimmst alle ${w[1]} als eigene ${PAGE.noun} mit. Neue teilt ihr dann nicht mehr.`; return; }
        lv.textContent=`${w[1]} werden mitgenommen …`; lv.disabled=true;
        const nid=rand(20);
        try{
          await db.ref(`spaces/${nid}/access/${user.uid}`).set("owner");
          await db.ref(`spaces/${nid}/meta`).set({type,owner:user.uid,createdAt:Date.now()});
          await copyData(sid,nid);
          await db.ref(`users/${user.uid}/spaces/${type}`).set(nid);

            await db.ref(`spaces/${sid}/share/${user.uid}`).remove().catch(()=>{});

          const acc=(await db.ref(`spaces/${sid}/access`).once("value")).val()||{};
          for(const id of Object.keys(acc)) if(id!==user.uid) await db.ref(`spaces/${sid}/meta/owners/${id}`).set(true).catch(()=>{});
          await db.ref(`spaces/${sid}/meta/owners/${user.uid}`).remove().catch(()=>{});
          await db.ref(`spaces/${sid}/profiles/${user.uid}`).remove().catch(()=>{});
          await db.ref(`spaces/${sid}/access/${user.uid}`).remove().catch(()=>{});

    /* ---------- Freunde ---------- */
    let friends={}, requestsIn={}, inbox={}, friendCode=null, friendsOpen=false, frConfirm=null;
    const frBadge=()=>Object.keys(requestsIn).length+Object.keys(inbox).length;
    let chatUnread=0;
    function updateFriendBadge(){
      const n=frBadge(), b=document.getElementById("pfFriendBadge"), d=document.getElementById("pfDot"), c=document.getElementById("pfChatBadge");
      if(b){ b.textContent=n; b.hidden=!n; } if(c){ c.textContent=chatUnread; c.hidden=!chatUnread; } if(d) d.hidden=!(n||chatUnread);
      const cb=document.getElementById("oursChatN"); if(cb){ cb.textContent=chatUnread>99?"99+":chatUnread; cb.hidden=!chatUnread; }
    }
    function watchChats(){
      db.ref(`chatIndex/${user.uid}`).on("value",s=>{ const v=s.val()||{}; chatUnread=Object.values(v).reduce((a,x)=>a+(x&&+x.unread>0?+x.unread:0),0);
        updateFriendBadge(); document.dispatchEvent(new CustomEvent("ours-chat",{detail:{unread:chatUnread,index:v}})); },()=>{});
    }
    async function ensureFriendCode(){
      friendCode=(await db.ref(`users/${user.uid}/friendCode`).once("value")).val();
      if(friendCode) return;
      for(let i=0;i<5 && !friendCode;i++){
        const c=rand(8).toUpperCase().replace(/[^A-Z0-9]/g,"X");
        try{ await db.ref(`friendCodes/${c}`).set(user.uid); await db.ref(`users/${user.uid}/friendCode`).set(c); friendCode=c; }catch(e){}
      }
    }
    function watchFriends(){
      db.ref(`friends/${user.uid}`).on("value",s=>{ friends=s.val()||{}; if(friendsOpen) friendsView(); },()=>{});
      db.ref(`requests/${user.uid}`).on("value",s=>{ requestsIn=s.val()||{}; updateFriendBadge(); if(friendsOpen) friendsView(); },()=>{});
      db.ref(`inbox/${user.uid}`).on("value",s=>{ inbox=s.val()||{}; updateFriendBadge(); if(friendsOpen) friendsView(); },()=>{});
    }
    const myName=()=>profile.name||user.email.split("@")[0];
    async function sendRequest(code){
      code=String(code||"").trim().toUpperCase().replace(/^.*#FRIEND-/,"").replace(/[^A-Z0-9]/g,"");
      if(code.length<6) return {err:"Gib einen Freundescode ein. Er hat 8 Zeichen."};
      const uid=(await db.ref(`friendCodes/${code}`).once("value")).val();
      if(!uid) return {err:"Zu diesem Code gibt es niemanden. Prüf die Schreibweise."};
      if(uid===user.uid) return {err:"Das ist dein eigener Code."};
      if(friends[uid]) return {ok:`${friends[uid].name||"Diese Person"} ist schon dein Freund.`};
      if(requestsIn[uid]){ await acceptRequest(uid); return {ok:`Ihr seid jetzt befreundet.`}; }
      await db.ref(`requests/${uid}/${user.uid}`).set({name:myName(),at:Date.now()});
      return {ok:"Freundschaftsanfrage gesendet. Sobald sie angenommen ist, erscheint die Person hier."};
    }
    async function acceptRequest(from){
      const req=requestsIn[from]||{}, now=Date.now();
      await db.ref(`friends/${user.uid}/${from}`).set({name:req.name||"Freund",since:now});
      await db.ref(`friends/${from}/${user.uid}`).set({name:myName(),since:now});
      await db.ref(`requests/${user.uid}/${from}`).remove();
    }
    function friendsView(msgText,isErr){
      friendsOpen=true;
      const base=location.href.split("#")[0].replace(/[^/]*$/,"");
      const link=friendCode?`${base}index.html#friend-${friendCode}`:"";
      const reqs=Object.entries(requestsIn), inv=Object.entries(inbox), fl=Object.entries(friends).sort((a,b)=>(a[1].name||"").localeCompare(b[1].name||""));
      const pageOf=t=>PAGES.find(p=>p.type===(t==="swipe"?"recipes":t))||PAGES[0];
      const since=t=>new Date(t||Date.now()).toLocaleDateString("de-DE",{day:"numeric",month:"short",year:"numeric"});
      const X='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
      show("Freunde","",`
        ${inv.length?`<p class="auth-sec">Einladungen</p><div class="st-grp">${inv.map(([id,x])=>`<div class="fr-row">${avatar(x.from,x.fromName,44)}
          <span class="st-t"><b>${esc(x.fromName||"Jemand")}</b><small>${x.type==="swipe"?"will mit dir Rezepte swipen":`lädt dich zu ${esc(pageOf(x.type).label)} ein`}</small></span>
          <button type="button" class="fr-b fill sm" data-inv-yes="${esc(id)}">Annehmen</button><button type="button" class="fr-x" data-inv-no="${esc(id)}" aria-label="Ablehnen">${X}</button></div>`).join("")}</div>`:""}
        ${reqs.length?`<p class="auth-sec">Anfragen</p><div class="st-grp">${reqs.map(([id,x])=>`<div class="fr-row">${avatar(id,x.name,44)}
          <span class="st-t"><b>${esc(x.name||"Jemand")}</b><small>möchte mit dir befreundet sein</small></span>
          <button type="button" class="fr-b fill sm" data-req-yes="${esc(id)}">Annehmen</button><button type="button" class="fr-x" data-req-no="${esc(id)}" aria-label="Ablehnen">${X}</button></div>`).join("")}</div>`:""}
        <div class="fr-share"><div class="fr-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.5" cy="8.5" r="3.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20c.7-3.7 3.3-5.8 6.5-5.8 1.6 0 3 .5 4.1 1.4M18 13v6M15 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
          <b>Freunde einladen</b><p>Teile deinen Code oder Link. Wer ihn eingibt, schickt dir eine Freundschaftsanfrage.</p>
          <button type="button" class="fr-code2" id="frCodeBtn" aria-label="Code kopieren">${esc(friendCode||"…")}</button>

          <input type="hidden" id="frLink" value="${esc(link)}"></div>
        <p class="auth-sec">Freund hinzufügen</p>
        <form class="st-grp fr-add" id="frAdd" autocomplete="off"><input type="text" id="frIn" maxlength="40" placeholder="Freundescode eingeben" aria-label="Freundescode" autocapitalize="characters"><button type="submit" id="frAddBtn">Senden</button></form>

        <button type="button" id="frClose" hidden>Fertig</button>`,true);
      $a("#frClose").onclick=()=>{ friendsOpen=false; frConfirm=null; hide(); };
      { const hd=screen.querySelector(".auth-head"); if(hd&&!hd.querySelector(".auth-done")){ hd.insertAdjacentHTML("beforeend",'<button type="button" class="auth-done" id="frDone">Fertig</button>'); hd.querySelector("#frDone").onclick=()=>{ friendsOpen=false; frConfirm=null; hide(); }; } }
      $a("#frShare").onclick=async()=>{ if(navigator.share){ try{ await navigator.share({title:"Ours",text:"Füg mich bei Ours als Freund hinzu – mein Code: "+(friendCode||""),url:link}); return; }catch(e){ if(e&&e.name==="AbortError") return; } } $a("#frCopy").click(); };
      $a("#frCodeBtn").onclick=async()=>{ try{ await navigator.clipboard.writeText(friendCode||""); msg("Code kopiert."); }catch(e){ msg("Dein Code: "+(friendCode||"")); } };

        if(Object.keys(out).length) await db.ref(`spaces/${to}/${key}`).update(out);
      }
      for(const p of photos){ const ph=(await db.ref(`spaces/${from}/photos/${p}`).once("value")).val(); if(ph) await db.ref(`spaces/${to}/photos/${p}`).set(ph); }
    }

    async function open(id){

        if(!profile.name){
          let n=""; try{ n=sessionStorage.getItem("auth.newName")||""; sessionStorage.removeItem("auth.newName"); }catch(e){}
          profile.name=n||u.displayName||u.email.split("@")[0];
          await db.ref(`users/${u.uid}/profile/name`).set(profile.name);
        }
        try{ const pb=(await db.ref(`pub/${u.uid}`).once("value")).val()||{}; pubCache.set(u.uid,pb);
          if(pb.name!==profile.name) await db.ref(`pub/${u.uid}/name`).set(profile.name); pubCache.get(u.uid).name=profile.name; }catch(e){}
        window.Auth._profileView=profileView; window.Auth.me=u.uid;
        installMenu();
        db.ref(`users/${u.uid}/settings`).on("value",s=>{ const v=s.val()||{};
          Object.entries(KC_KEY).forEach(([t,k])=>applyKcal(t,typeof v[k]==="boolean"?v[k]:v.kcal===true));
          if(v.theme&&window.OursTheme&&v.theme!==OursTheme.pref) OursTheme.set(v.theme,false); OursPush._load(v.push); },()=>{});
        try{ await ensureFriendCode(); watchFriends(); watchChats(); }catch(e){}
        const fr=location.hash.match(/^#friend-([A-Za-z0-9]{6,12})$/);
        if(fr){ clearHash(); setTimeout(async()=>{ let r; try{ r=await sendRequest(fr[1]); }catch(e){ r={err:"Die Anfrage hat nicht geklappt."}; } friendsView(r.err||r.ok,!!r.err); },400); }
        if(PAGE.noSpace){ hide(); updateMenu(); if(!started){ started=true; cb(null,{uid:u.uid,email:u.email,name:profile.name,db}); } return; }
        const current=(await db.ref(`users/${u.uid}/spaces/${type}`).once("value")).val();
        const j=parseJoin();
        if(j){ await join(j,current); return; }
        if(current){ await open(current); return; }
        setupView();
      }catch(err){
        show(PAGE.label,"",`<p class="auth-msg err">Die Daten konnten nicht geladen werden. Prüf die Internetverbindung und die Regeln in Firebase.</p>
          <button class="auth-btn" type="button" onclick="location.reload()">Neu laden</button>
          <button class="auth-link" type="button" id="authOut">Abmelden</button>`);
        $a("#authOut").onclick=()=>auth.signOut();
      }
    });
  }};
})();

<script>

// eigene Termine: einmalig oder wiederkehrend (wöchentlich, monatlich, jährlich)
// Wiederholung: {f:"day"|"week"|"month"|"year", n: alle n, days:[0..6] (bei Woche), until:"JJJJ-MM-TT"}; ältere Termine: "week"/"month"/"year"
function repOf(e){ const r=e&&e.rep; if(!r||r==="none") return null; if(typeof r==="string") return {f:r,n:1}; return r; }
const wkIdx=di=>Math.floor((dayNum(di)-((fromIso(di).getDay()+6)%7))/7);
function startsOn(e,r,di){
  const a=fromIso(e.date), d=fromIso(di), n=Math.max(1,+r.n||1);
  if(r.f==="day") return (dayNum(di)-dayNum(e.date))%n===0;
  if(r.f==="week"){ const days=r.days&&r.days.length?r.days:[dowOf(e.date)]; return days.includes(dowOf(di))&&(wkIdx(di)-wkIdx(e.date))%n===0; }
  if(r.f==="month"){ const m=(d.getFullYear()-a.getFullYear())*12+d.getMonth()-a.getMonth(); return m%n===0&&d.getDate()===a.getDate(); }
  if(r.f==="year"){ return (d.getFullYear()-a.getFullYear())%n===0&&d.getMonth()===a.getMonth()&&d.getDate()===a.getDate(); }
  return false;
}
function evOn(e,di){
  if(!e||!e.date||di<e.date) return false; const r=repOf(e), until=(r&&r.until)||e.until;
  if(until&&di>until) return false; if(e.skip&&e.skip[di]) return false;
  const span=e.end&&e.end>e.date?dayNum(e.end)-dayNum(e.date):0;
  if(!r) return dayNum(di)-dayNum(e.date)<=span;
  for(let k=0;k<=span;k++){ const st=iso(new Date(fromIso(di).getTime()-k*864e5)); if(st<e.date) break; if(!(e.skip&&e.skip[st])&&startsOn(e,r,st)) return true; }
  return false;
}
const DLONG=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
function repText(r){
  if(!r) return "Nie"; const n=Math.max(1,+r.n||1), U={day:["Tag","Tage"],week:["Woche","Wochen"],month:["Monat","Monate"],year:["Jahr","Jahre"]}[r.f]||["",""];
  let t=n===1?{day:"Jeden Tag",week:"Jede Woche",month:"Jeden Monat",year:"Jedes Jahr"}[r.f]:`Alle ${n} ${U[1]}`;
  if(r.f==="week"&&r.days&&r.days.length&&!(r.days.length===1&&n===1&&!r.custom)) t+=" am "+r.days.slice().sort().map(d=>DOW[d]).join(", ");
  return t;
}
// Gym-Plan (gleiche Regeln wie auf der Gym-Seite)
function gymOn(w,di){ if(!w||!w.rep) return false; const r=w.rep;
  if(r.type==="once") return r.date===di; if(r.type==="weekly") return Array.isArray(r.days)&&r.days.includes(dowOf(di));
  if(r.type==="every"){ const n=+r.n||2, d=dayNum(di)-dayNum(r.start||di); return d>=0&&d%n===0; } return false; }
// Dateideen: geplantes Datum (date) oder Datum im „Wann“-Text, erledigte am Tag der Erledigung
function ideaDate(i){
  if(i.date) return i.date;
  const m=String(i.when||"").match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})?/); if(m){ const y=m[3]?(+m[3]<100?2000+(+m[3]):+m[3]):now.getFullYear(); return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
  const t=String(i.when||"").match(/(\d{4})-(\d{2})-(\d{2})/); return t?`${t[1]}-${t[2]}-${t[3]}`:null;
}
// Verträge: nächste Zahlung + Rhythmus → künftige Termine
const STEP={week:[0,7],month:[1,0],quarter:[3,0],half:[6,0],year:[12,0]};
function conDates(c,from,to){ const out=[]; if(!c.d) return out; let d=fromIso(c.d); const [mo,dd]=STEP[c.r]||[1,0]; let guard=0;
  while(iso(d)<=to&&guard++<400){ if(iso(d)>=from) out.push(iso(d)); if(mo) d=new Date(d.getFullYear(),d.getMonth()+mo,fromIso(c.d).getDate(),12); else d.setDate(d.getDate()+dd); } return out; }
function itemsOn(di){

    al:(()=>{ const a={...(old.al||{})}, mine=E.al.filter(v=>v!=null); if(mine.length) a[myUid]=mine; else delete a[myUid]; return Object.keys(a).length?a:null; })()};
  events[id]=e; root.child("events/"+id).set(e).catch(showErr); feedPublish(true);
  if(!E.id&&window.OursPush) OursPush.notify(root.key,`${myName||"Jemand"} hat einen Termin eingetragen`,`${title} · ${fromIso(E.date).toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"})}${e.start?" · "+e.start+" Uhr":""}`,"kalender.html");
  if(e.idea&&ideasRef) ideasRef.child(e.idea+"/date").set(E.date).catch(()=>{});
  focus=E.date; $("#modal").hidden=true; edit=null; if(level==="week") render(); else refresh();
}
function icsFor(e){
  const z=s=>String(s||"").replace(/[\\,;]/g,m=>"\\"+m).replace(/\n/g,"\\n"), dt=(d,t)=>d.replace(/-/g,"")+(t?"T"+t.replace(":","")+"00":"");
  const nd=d=>{ const x=fromIso(d); x.setDate(x.getDate()+1); return iso(x).replace(/-/g,""); };
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ours//Kalender//DE","BEGIN:VEVENT","UID:"+Date.now()+"@ours","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z","SUMMARY:"+z(e.title)];
  if(e.allDay||!e.start){ L.push("DTSTART;VALUE=DATE:"+dt(e.date),"DTEND;VALUE=DATE:"+nd(e.end||e.date)); } else { L.push("DTSTART:"+dt(e.date,e.start),"DTEND:"+dt(e.end||e.date,e.endTime||e.start)); }
  const r=repOf(e); if(r){ let rr="RRULE:FREQ="+({day:"DAILY",week:"WEEKLY",month:"MONTHLY",year:"YEARLY"}[r.f]); if((+r.n||1)>1) rr+=";INTERVAL="+r.n;
    if(r.f==="week"&&r.days&&r.days.length) rr+=";BYDAY="+r.days.map(d=>["MO","TU","WE","TH","FR","SA","SU"][d]).join(","); if(r.until) rr+=";UNTIL="+r.until.replace(/-/g,"")+"T235959Z"; L.push(rr);
    Object.keys(e.skip||{}).forEach(d=>L.push(e.allDay||!e.start?"EXDATE;VALUE=DATE:"+d.replace(/-/g,""):"EXDATE:"+d.replace(/-/g,"")+"T"+e.start.replace(":","")+"00")); }
  if(e.loc) L.push("LOCATION:"+z(e.loc));
  if(e.note) L.push("DESCRIPTION:"+z(e.note));
  ((e.al&&e.al[myUid])||[]).forEach(v=>{ const m=e.allDay||!e.start?v-9*60:v; L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+z(e.title||"Termin"),"TRIGGER:"+(m<0?"PT"+(-m)+"M":"-PT"+m+"M"),"END:VALARM"); });
  L.push("END:VEVENT","END:VCALENDAR"); return L.join("\r\n");
}

/* ---------- Apple-Kalender-Abo: je Terminart ein eigener Kalender in seiner Farbe ----------
   Gemeinsame Termine (nach Farbe) gelten für alle im Kalender; Gym, Dates, Reisen und Verträge sind privat. */
const CAL_W="https://oursapp.niklasbergnerbus.workers.dev";
let calFeedOn=false, calTok=null, pubT=null, pubLast="", calSid=null;
const slugOf=s=>String(s||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30)||"termine";
const PRIV_FEEDS={gym:["gym","Ours · Gym","#5a5bb8"],date:["dates","Ours · Dates","#8c7559"],con:["vertraege","Ours · Verträge & Gehalt","#3f70b8"],sal:["vertraege","Ours · Verträge & Gehalt","#3f70b8"]};
function feedData(){
  const start=addDays(now,-60), days=430, shared={}, priv={};
  // eigene/gemeinsame Termine, nach Farbe getrennt
  Object.entries(events).forEach(([id,e])=>{ if(!e||!e.date||!e.title) return; const col=e.col||ECOLS[0], k="c-"+slugOf(COLNAMES[col]||col);
    const f=shared[k]=shared[k]||{name:"Ours · "+(COLNAMES[col]||"Termine"),color:col,items:[]};
    const base={t:e.title,s:e.allDay?null:e.start||null,et:e.allDay?null:e.endTime||null,l:e.loc||null,n:e.note||null,url:e.url||null,al:e.al||null};
    const r=repOf(e), span=e.end&&e.end>e.date?dayNum(e.end)-dayNum(e.date):0;
    if(!r){ f.items.push({...base,u:id,d:e.date,e:span?e.end:null}); return; }
    for(let i=0;i<days&&f.items.length<1800;i++){ const di=iso(addDays(start,i)); if(di<e.date) continue; if(r.until&&di>r.until) break;
      if(!(e.skip&&e.skip[di])&&startsOn(e,r,di)) f.items.push({...base,u:id+"_"+di,d:di,e:span?iso(addDays(fromIso(di),span)):null}); } });
  // private Bereiche aus dem, was der Kalender ohnehin anzeigt
  const keep=show; show={ev:false,gym:true,date:true,con:true,buy:false,inc:false,trip:false};
  try{ for(let i=0;i<days;i++){ const di=iso(addDays(start,i)); itemsOn(di).forEach(x=>{ const pf=PRIV_FEEDS[x.src]; if(!pf) return;
      const f=priv[pf[0]]=priv[pf[0]]||{name:pf[1],color:pf[2],items:[]}; if(f.items.length>=1500) return;
      const timed=!!x.t, end=x.end||(timed?addMin(x.t,x.dur||60):null);
      f.items.push({u:x.src+"_"+di+"_"+slugOf(x.title),t:x.title+(x.r?" ("+x.r.replace("−","-")+")":""),d:di,s:timed?x.t:null,et:end,n:x.sub||null}); }); } }
  finally{ show=keep; }
  // Reisen: ganze Reise als ganztägiger Eintrag, Programmpunkte mit Uhrzeit
  Object.entries(trips||{}).forEach(([id,tr])=>{ if(!tr||!tr.from||tr.cal===false) return; const f=priv.reisen=priv.reisen||{name:"Ours · Reisen",color:"#25a199",items:[]};
    f.items.push({u:"trip_"+id,t:"✈️ "+(tr.dest||"Reise"),d:tr.from,e:tr.to&&tr.to>tr.from?tr.to:null});
    Object.entries(tr.plan||{}).forEach(([pid,p])=>{ if(p&&p.d&&p.t) f.items.push({u:"trip_"+id+"_"+pid,t:(p.ic||"📍")+" "+p.t,d:p.d,s:p.time||null,et:p.time?(p.end||addMin(p.time,60)):null,l:p.place||null,n:p.conf?"Buchungsnummer: "+p.conf:null}); }); });
  return {shared,priv};
}
async function calCall(body){ const u=firebase.auth().currentUser; if(!u) throw new Error("Bitte neu anmelden.");
  const r=await fetch(CAL_W,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,token:await u.getIdToken()})}); const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(/Link|Video/.test(d.error||"")?"Der Cloudflare-Worker hat noch den alten Code. Füg den neuen Code ein und drück auf Deploy.":d.error||"Der Helfer antwortet nicht."); return d; }
function feedPublish(fast){ if(!root||!myUid||!calFeedOn) return; clearTimeout(pubT); pubT=setTimeout(async()=>{ const d=feedData(), h=JSON.stringify(d); if(h===pubLast) return;
    try{ await calCall({mode:"cal-publish",sid:calSid||root.key,shared:d.shared,priv:d.priv}); pubLast=h; }catch(e){} },fast?400:5000); }
async function appleSheet(){
  const sh=$("#sheet"); sh.classList.add("ios"); edit=null; view=null;
  sh.innerHTML=`<div class="ihead"><button type="button" class="ib" data-close>Schließen</button><b>Apple-Kalender</b><span class="ib"></span></div><p class="ifoot" style="margin:0 4px 16px">Wird vorbereitet …</p>`;
  $("#modal").hidden=false;
  try{ const t=await calCall({mode:"cal-token"}); calTok=t; calFeedOn=true; root.child("meta/calFeed").set(true).catch(()=>{}); pubLast=""; feedPublish(true); }
  catch(e){ sh.innerHTML=`<div class="ihead"><button type="button" class="ib" data-close>Schließen</button><b>Apple-Kalender</b><span class="ib"></span></div><div class="igrp"><div class="cell"><span>${esc(e.message)}</span></div></div>`; return; }
  const d=feedData(), all={...d.shared,...d.priv}, web=k=>calTok.base.replace(/^https:/,"webcal:")+k+".ics";
  sh.innerHTML=`<div class="ihead"><button type="button" class="ib" data-close>Schließen</button><b>Apple-Kalender</b><span class="ib"></span></div>
    <p class="ifoot" style="margin:0 4px 14px">Tipp bei jeder Terminart auf <b>Abonnieren</b> und bestätige im iPhone-Kalender. Jede Art wird ein eigener Kalender in ihrer Farbe. Neue und geänderte Termine kommen automatisch nach (Apple holt sie etwa alle 15 Minuten).</p>
    <div class="igrp">${Object.entries(all).map(([k,f])=>`<div class="cell"><span><span class="cdot" style="background:${f.color}"></span> ${esc(f.name.replace("Ours · ",""))}<small class="sub">${f.items.length} ${f.items.length===1?"Eintrag":"Einträge"}</small></span><a class="ab-btn" href="${web(k)}">Abonnieren</a></div>`).join("")||`<div class="cell"><span class="sub">Noch keine Termine.</span></div>`}</div>
    <div class="igrp"><div class="cell"><span>Alles in einem Kalender<small class="sub">eine Farbe für alles</small></span><a class="ab-btn alt" href="${web("alle")}">Abonnieren</a></div></div>
    <div class="igrp"><button type="button" class="cell nav" id="abCopy"><span>Links kopieren</span><span class="cv"><i>›</i></span></button><button type="button" class="cell danger" id="abReset">Neue Links erzeugen (alte werden ungültig)</button></div>
    <p class="ifoot">Kommen neue Arten dazu (z. B. eine neue Farbe), öffne dieses Fenster nochmal und abonniere sie. Falls „Abonnieren“ nichts öffnet: Links kopieren und unter Einstellungen → Kalender → Accounts → Account hinzufügen → Andere → Kalenderabo hinzufügen einfügen. Wer den Link kennt, kann die Termine lesen, aber nichts ändern.</p>`;
  sh._links=Object.keys(all).concat("alle").map(k=>`${(all[k]||{name:"Ours (alles)"}).name}: ${calTok.base}${k}.ics`).join("\n");
}

  action:()=>{ setTimeout(()=>{ const c=document.getElementById("stClose"); if(c) c.click(); appleSheet(); },80); }});

let ideasRef=null, refT=null, budChecked=false;

function refresh(){ feedPublish(); clearTimeout(refT); refT=setTimeout(()=>{ if(level==="week"&&!listMode&&$("#list").querySelector("[data-wk]")){ dayCache=new Map(); paintFilters(); $("#budNote").hidden=!!bud||!budChecked; renderWeeks(false); } else render(); },60); }
Auth.start(firebaseConfig,"calendar",(r,info)=>{
  root=r; if(info){ myUid=info.uid; myName=info.name||""; calSid=info.sid||null; } render(); if(!root||!myUid) return;
  root.child("events").on("value",s=>{ events=s.val()||{}; refresh(); },showErr);
  root.child("profiles").on("value",s=>{ profiles=s.val()||{}; refresh(); },()=>{});
  root.child("meta/calFeed").on("value",s=>{ calFeedOn=s.val()===true; if(calFeedOn) feedPublish(); },()=>{});
  const db=fdb();
  db.ref(`users/${myUid}/spaces/dates`).once("value").then(s=>{ const sid=s.val(); if(!sid) return; ideasRef=db.ref(`spaces/${sid}/ideas`); ideasRef.on("value",x=>{ ideas=x.val()||{}; refresh(); },()=>{}); }).catch(()=>{});
  db.ref(`users/${myUid}/spaces/gym`).once("value").then(s=>{ const sid=s.val(); if(!sid) return; ["workouts","templates","sessions"].forEach(k=>db.ref(`spaces/${sid}/${k}`).on("value",x=>{ gym[k]=x.val()||{}; refresh(); },()=>{})); }).catch(()=>{});
  db.ref(`users/${myUid}/home/budget`).on("value",s=>{ bud=s.val(); budChecked=true; refresh(); },()=>{});
  db.ref(`users/${myUid}/spaces/trips`).once("value").then(s=>{ const sid=s.val(); if(!sid) return; db.ref(`spaces/${sid}/trips`).on("value",x=>{ trips=x.val()||{}; refresh(); },()=>{}); }).catch(()=>{});
  // Direkt-Link: kalender.html?neu=1&titel=…&datum=JJJJ-MM-TT
  const q=new URLSearchParams(location.search); if(q.get("neu")){ const d=/^\d{4}-\d{2}-\d{2}$/.test(q.get("datum")||"")?q.get("datum"):null; history.replaceState(null,"",location.pathname);
